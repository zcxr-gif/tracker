# XcodeGen spec for the native iOS tracker.
#
# The .xcodeproj is deliberately NOT committed. A pbxproj is a merge-conflict
# generator that nobody can review, and Codemagic regenerates the project from
# this file on every build (see codemagic.yaml). To work on the app locally:
#
#   brew install xcodegen && xcodegen generate && open InflightTracker.xcodeproj
#
# There are no third-party dependencies — no SPM resolution, no CocoaPods, no
# Podfile. Everything the app uses ships with the SDK (SwiftUI, MapKit,
# CoreLocation, URLSession).

name: InflightTracker

options:
  bundleIdPrefix: com.tracker
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # agvtool (used by the Codemagic build-number step) only works on projects
    # using apple-generic versioning.
    VERSIONING_SYSTEM: "apple-generic"
    VERSION_INFO_PREFIX: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  InflightTracker:
    type: application
    platform: iOS
    sources:
      - path: InflightTracker/Sources
      - path: InflightTracker/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.InflightTracker
        PRODUCT_NAME: Inflight
        INFOPLIST_FILE: InflightTracker/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone + iPad. The iPhone is locked to portrait in Info.plist; the
        # iPad keeps every orientation.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        # A tracker is useless without the network, and every request is
        # https, so no ATS exceptions are needed.
        CODE_SIGN_STYLE: Manual

schemes:
  InflightTracker:
    build:
      targets:
        InflightTracker: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
