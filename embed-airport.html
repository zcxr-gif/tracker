<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
    /* ------------------------------------------------------------------ *
     *  Embed-style airport card, ported from the VA embed widget          *
     *  (embed.html / airportCardHTML) and re-themed for the tracker's      *
     *  docked airport window. Fed by AIRPORT_DATA_UPDATE postMessage; the   *
     *  VA-specific "inbound VA pilots" and "Powered by" blocks are dropped  *
     *  since this runs inside the tracker itself.                          *
     * ------------------------------------------------------------------ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        /* Solid dark surface so the card's low-opacity labels stay legible
           regardless of what sits behind the iframe in the host window. */
        background: #17181c;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
    }
    body { padding: 14px; overflow: hidden; }

    .emb-apt { display: flex; flex-direction: column; gap: 10px; color: #fff; max-width: 520px; margin: 0 auto; }
    .emb-apt-hero { position: relative; height: 150px; border-radius: 12px; overflow: hidden; background: #14202e; flex: 0 0 auto; }
    .emb-apt-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .emb-apt-hero-fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.4) 100%); }
    .emb-apt-head { display: flex; align-items: center; gap: 11px; }
    .emb-apt-flag { width: 30px; height: 21px; border-radius: 3px; object-fit: cover; flex: 0 0 auto; background: rgba(255,255,255,0.08); }
    .emb-apt-icao { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; line-height: 1; }
    .emb-apt-name { font-size: 13.5px; color: rgba(255,255,255,0.82); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .emb-apt-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .emb-apt-mod { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 11px 13px; border: 1px solid rgba(255,255,255,0.05); }
    .emb-apt-mod-h {
        font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
        color: rgba(255,255,255,0.55); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .emb-apt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .emb-apt-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .emb-apt-cell .l { font-size: 8.5px; font-weight: 700; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: .04em; }
    .emb-apt-cell .v { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .emb-apt-pill { font-size: 9px; font-weight: 800; padding: 1px 7px; border-radius: 4px; border: 1px solid; }
    .emb-apt-metar-raw {
        font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: 10.5px;
        color: rgba(255,255,255,0.5); line-height: 1.45; word-break: break-word; margin-top: 8px;
    }

    /* Gates module — terminals as dropdowns, occupant usernames per stand */
    .emb-gate-term { border-top: 1px solid rgba(255,255,255,0.06); }
    .emb-gate-term > summary {
        list-style: none; cursor: pointer; user-select: none;
        display: flex; align-items: center; gap: 8px; padding: 8px 2px;
        font-size: 11.5px; font-weight: 700; color: #cbd5e1;
    }
    .emb-gate-term > summary::-webkit-details-marker { display: none; }
    .emb-gate-term > summary .t { text-transform: uppercase; letter-spacing: 0.4px; }
    .emb-gate-term > summary .c {
        margin-left: auto; font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px; color: #e4e4e7; background: rgba(255,255,255,0.08);
        padding: 1px 7px; border-radius: 999px;
    }
    .emb-gate-term > summary .o {
        font-size: 9px; font-weight: 800; color: #4ade80;
        background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.3);
        padding: 0 6px; border-radius: 999px;
    }
    .emb-gate-list {
        display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
        padding: 5px 0 9px; max-height: 240px; overflow-y: auto;
    }
    .emb-gate-row {
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        padding: 5px 9px; border-radius: 7px; min-width: 0;
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
        font-size: 11px;
    }
    .emb-gate-row.occ { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.06); }
    .emb-gate-row .n { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 800; color: #e4e4e7; flex: 0 0 auto; }
    .emb-gate-row .w { color: #4ade80; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .emb-gate-row .f { color: #64748b; }

    .emb-empty { padding: 40px 12px; text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="card"><div class="emb-empty">Loading airport…</div></div>

    <script>
    'use strict';

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
        const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ── Gate helpers (ported from the embed) ──────────────────────────────
    const gateLabel = (g) => g.name || g.ident || g.gateName || g.id || 'GATE';
    const gateLatLon = (g) => ({
        lat: g.latitude != null ? g.latitude : (g.lat != null ? g.lat : (g.location && (g.location.lat != null ? g.location.lat : g.location.latitude))),
        lon: g.longitude != null ? g.longitude : (g.lon != null ? g.lon : (g.location && (g.location.lon != null ? g.location.lon : g.location.longitude)))
    });
    const gateKeyOf = (g) => { const { lat, lon } = gateLatLon(g); return `${gateLabel(g)}|${lat}|${lon}`; };
    function gateTerminal(g) {
        const e = g.terminal || g.concourse || g.pier;
        if (e) return String(e).trim().toUpperCase();
        const n = String(gateLabel(g)).trim().replace(/^(gate|stand|ramp|apron|parking|bay|spot)\s*/i, '');
        const m = n.match(/^([A-Za-z]+)/);
        return m ? m[1].toUpperCase() : 'Gates';
    }
    // Tag each gate with the username of a pilot parked on it, from the live
    // occupant list the host handed us.
    function gateOccupants(gates, occupants) {
        const res = new Map();
        if (!gates || !gates.length || !Array.isArray(occupants) || !occupants.length) return res;
        const gi = gates.map(g => { const { lat, lon } = gateLatLon(g); return { lat, lon, key: gateKeyOf(g) }; })
            .filter(x => x.lat != null && x.lon != null);
        occupants.forEach(p => {
            if (!p || p.lat == null || p.lon == null) return;
            let best = null, bd = Infinity;
            gi.forEach(g => { const d = getDistanceKm(p.lat, p.lon, g.lat, g.lon); if (d < bd) { bd = d; best = g; } });
            if (best && bd <= 0.05 && !res.has(best.key)) res.set(best.key, p.username || p.callsign || 'Pilot');
        });
        return res;
    }
    function gatesModHTML(gates, occupants) {
        if (!gates || !gates.length) {
            return `<div class="emb-apt-mod"><div class="emb-apt-mod-h"><span>Gates</span></div>
                <div class="emb-apt-sub" style="margin:0">No gate data for this field.</div></div>`;
        }
        const occ = gateOccupants(gates, occupants);
        const groups = new Map();
        gates.forEach(g => { const k = gateTerminal(g); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(g); });
        const keys = [...groups.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        const body = keys.map(k => {
            const list = groups.get(k).slice().sort((a, b) =>
                String(gateLabel(a)).localeCompare(String(gateLabel(b)), undefined, { numeric: true }));
            const occN = list.filter(g => occ.get(gateKeyOf(g))).length;
            const title = k === 'Gates' ? 'Gates' : 'Terminal ' + k;
            const rows = list.map(g => {
                const who = occ.get(gateKeyOf(g));
                return `<div class="emb-gate-row${who ? ' occ' : ''}"><span class="n">${esc(gateLabel(g))}</span>` +
                    (who ? `<span class="w">${esc(who)}</span>` : '<span class="f">—</span>') + '</div>';
            }).join('');
            return `<details class="emb-gate-term"><summary>` +
                `<span class="t">${esc(title)}</span><span class="c">${list.length}</span>` +
                (occN ? `<span class="o">${occN}</span>` : '') +
                `</summary><div class="emb-gate-list">${rows}</div></details>`;
        }).join('');
        return `<div class="emb-apt-mod"><div class="emb-apt-mod-h"><span>Gates</span>` +
            `<span class="emb-apt-pill" style="color:#7dd3fc;border-color:#7dd3fc">${gates.length}</span></div>${body}</div>`;
    }

    function airportCardHTML(data) {
        if (!data) {
            return `<div class="emb-empty">Loading airport…</div>`;
        }
        const icao = data.icao || '----';
        if (data.error) {
            return `<div class="emb-apt"><div class="emb-apt-head"><div style="min-width:0">
                <div class="emb-apt-icao">${esc(icao)}</div>
                <div class="emb-apt-name">Couldn’t load airport data.</div></div></div></div>`;
        }
        const metar = data.metar, atis = data.atis, traffic = data.traffic || {};
        const name = data.name || icao;
        const cc = String(data.cc || '').toLowerCase();
        const flag = /^[a-z]{2}$/.test(cc)
            ? `<img class="emb-apt-flag" src="https://flagcdn.com/w40/${cc}.png" alt="" onerror="this.style.display='none'">`
            : '';
        const loc = [data.city, cc.toUpperCase()].filter(Boolean).join(', ');
        const elev = (data.elevation != null && data.elevation !== '') ? `${Math.round(data.elevation)} ft` : '';
        const sub = [loc, elev].filter(Boolean).join(' · ');

        const metarMod = metar ? `
            <div class="emb-apt-mod">
                <div class="emb-apt-mod-h"><span>METAR</span><span class="emb-apt-pill" style="color:${esc(metar.color)};border-color:${esc(metar.color)}">${esc(metar.cat)}</span></div>
                <div class="emb-apt-grid">
                    <div class="emb-apt-cell"><span class="l">Wind</span><span class="v">${esc(metar.wind)}</span></div>
                    <div class="emb-apt-cell"><span class="l">Vis</span><span class="v">${esc(metar.vis)}</span></div>
                    <div class="emb-apt-cell"><span class="l">Temp</span><span class="v">${esc(metar.temp)}</span></div>
                    <div class="emb-apt-cell"><span class="l">QNH</span><span class="v">${esc(metar.qnh)}</span></div>
                </div>
                ${metar.raw ? `<div class="emb-apt-metar-raw">${esc(metar.raw)}</div>` : ''}
            </div>` : `
            <div class="emb-apt-mod"><div class="emb-apt-mod-h"><span>METAR</span></div>
                <div class="emb-apt-sub" style="margin:0">Weather unavailable.</div></div>`;

        const opsMod = `
            <div class="emb-apt-mod">
                <div class="emb-apt-mod-h"><span>Operations</span>${atis
                    ? `<span class="emb-apt-pill" style="color:#fbbf24;border-color:#fbbf24">ATIS ${esc(atis.info)}</span>`
                    : `<span class="emb-apt-pill" style="color:#94a3b8;border-color:#475569">NO ATIS</span>`}</div>
                ${atis ? `<div class="emb-apt-grid" style="grid-template-columns:repeat(3,1fr)">
                    <div class="emb-apt-cell"><span class="l">Arr Rwy</span><span class="v" style="color:#4ade80">${esc(atis.landing)}</span></div>
                    <div class="emb-apt-cell"><span class="l">Dep Rwy</span><span class="v" style="color:#38bdf8">${esc(atis.departing)}</span></div>
                    <div class="emb-apt-cell"><span class="l">Appr</span><span class="v">${esc(atis.appr)}</span></div>
                </div>` : `<div class="emb-apt-sub" style="margin:0">No live ATIS broadcasting.</div>`}
            </div>`;

        const trafficMod = `
            <div class="emb-apt-mod">
                <div class="emb-apt-mod-h"><span>Traffic</span></div>
                <div class="emb-apt-grid" style="grid-template-columns:repeat(2,1fr)">
                    <div class="emb-apt-cell"><span class="l">Inbound</span><span class="v" style="color:#4ade80">${traffic.inbound || 0}</span></div>
                    <div class="emb-apt-cell"><span class="l">Outbound</span><span class="v" style="color:#38bdf8">${traffic.outbound || 0}</span></div>
                </div>
            </div>`;

        const heroMod = data.heroUrl
            ? `<div class="emb-apt-hero"><img src="${esc(data.heroUrl)}" alt="" loading="lazy" decoding="async" onerror="this.closest('.emb-apt-hero').remove()"><div class="emb-apt-hero-fade"></div></div>`
            : '';

        return `
            <div class="emb-apt">
                ${heroMod}
                <div class="emb-apt-head">${flag}<div style="min-width:0">
                    <div class="emb-apt-icao">${esc(icao)}</div>
                    <div class="emb-apt-name">${esc(name)}</div>
                    ${sub ? `<div class="emb-apt-sub">${esc(sub)}</div>` : ''}
                </div></div>
                ${metarMod}
                ${opsMod}
                ${trafficMod}
                ${gatesModHTML(data.gates, data.occupants)}
            </div>`;
    }

    // Report our rendered height so the host can size the iframe to fit.
    function reportHeight() {
        const h = document.body.scrollHeight;
        try { window.parent.postMessage({ type: 'EMBED_AIRPORT_HEIGHT', height: h }, '*'); } catch (_) {}
    }

    function render(data) {
        document.getElementById('card').innerHTML = airportCardHTML(data);
        // Height can change as the hero image loads or terminals expand.
        requestAnimationFrame(reportHeight);
        setTimeout(reportHeight, 400);
        document.querySelectorAll('.emb-gate-term').forEach(d =>
            d.addEventListener('toggle', () => setTimeout(reportHeight, 30)));
        const hero = document.querySelector('.emb-apt-hero img');
        if (hero) { hero.addEventListener('load', reportHeight); hero.addEventListener('error', () => setTimeout(reportHeight, 30)); }
    }

    window.addEventListener('message', (event) => {
        const d = event.data;
        if (!d || typeof d !== 'object') return;
        if (d.type === 'AIRPORT_DATA_UPDATE') render(d.payload);
    });
    window.addEventListener('resize', reportHeight);

    try { window.parent.postMessage({ type: 'EMBED_AIRPORT_READY' }, '*'); } catch (_) {}
    </script>
</body>
</html>
