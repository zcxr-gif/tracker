<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Air Canada Virtual banner">
  <!--
    Full-bleed demo banner for the fictional example VA "Air Canada Virtual",
    used to preview the Crew Center login's background (the modal sits on top,
    under a scrim). Placeholder artwork only — a real VA uploads their own.
  -->
