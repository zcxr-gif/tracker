    <linearGradient id="acv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e23140"/>
      <stop offset="1" stop-color="#9e1620"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#acv-bg)"/>
