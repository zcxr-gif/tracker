<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Privacy &amp; Conditions — Inflight Crew Center</title>
    <meta name="description" content="What a Crew Center holds about a pilot, where it lives, who can see it, and what is expected of you while you use it.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { screens: { xs: '400px' } } } };</script>
    <!-- The crew center's own theme key, so a pilot who reads this from their
         crew center does not get flashed the opposite colour scheme. -->
    <script>(function(){try{var t=localStorage.getItem('crew-theme');document.documentElement.classList.toggle('dark', t?t==='dark':window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);}catch(e){}})();</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        :root { color-scheme: light dark; }
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        [data-lucide] { width: 1.15em; height: 1.15em; }
        svg.lucide { stroke-width: 1.75; }
        .surface { background: #fff; border: 1px solid rgba(0,0,0,.06); box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 1px 1px rgba(0,0,0,.02); }
        .dark .surface { background: #18181b; border-color: rgba(255,255,255,.07); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
        .btn { background: #18181b; color: #fff; padding: .55rem .95rem; border-radius: .75rem; font-size: .8125rem; font-weight: 600; transition: .15s; display: inline-flex; align-items: center; gap: .45rem; }
        .dark .btn { background: #fafafa; color: #18181b; }
        .btn:hover { opacity: .9; } .btn:active { transform: scale(.98); }
        .clause p { margin-top: .5rem; line-height: 1.65; }
        .clause ul { margin-top: .5rem; }
        .clause li { position: relative; padding-left: 1.15rem; margin-top: .4rem; line-height: 1.6; }
        .clause li::before { content: ''; position: absolute; left: .1rem; top: .62em; width: .32rem; height: .32rem; border-radius: 999px; background: #6366f1; }
        .fade-in { animation: fade .4s cubic-bezier(.2,.8,.2,1) forwards; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased min-h-screen transition-colors duration-300">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
        <header class="flex items-start justify-between gap-4 mb-6">
            <div>
                <h1 id="title" class="text-2xl sm:text-3xl font-extrabold tracking-tight">Inflight Crew Center</h1>
                <p id="subtitle" class="text-indigo-600 dark:text-indigo-400 font-bold text-lg mt-0.5">Privacy Notice &amp; Conditions for Pilots</p>
                <p id="meta" class="text-xs text-zinc-500 dark:text-zinc-400 mt-2">Loading…</p>
            </div>
            <button onclick="toggleTheme()" title="Toggle theme" class="shrink-0 w-9 h-9 grid place-items-center rounded-full surface"><span id="themeIcon"></span></button>
        </header>

        <!-- The short version. Most people read this and nothing else, which is
             why it is written to be true on its own rather than as a teaser. -->
        <section id="summaryWrap" class="hidden surface rounded-2xl p-5 mb-6 fade-in border-l-4 border-l-indigo-500">
            <h2 class="text-sm font-bold flex items-center gap-2 mb-2"><i data-lucide="list" class="w-4 h-4 text-indigo-500"></i> The short version</h2>
            <ul id="summaryList" class="text-sm text-zinc-600 dark:text-zinc-300 space-y-1.5"></ul>
        </section>

        <section class="surface rounded-2xl p-5 sm:p-6 mb-6">
            <p id="intro" class="text-sm text-zinc-600 dark:text-zinc-300 leading-relaxed"></p>
        </section>

        <main id="clauses" class="surface rounded-2xl p-5 sm:p-7 space-y-6 text-sm text-zinc-600 dark:text-zinc-300"></main>

        <footer class="mt-8 text-center text-xs text-zinc-400 dark:text-zinc-500">
            <p id="footerMeta"></p>
            <p class="mt-2">
                <a href="privacy.html" class="underline hover:text-zinc-600 dark:hover:text-zinc-300">Inflight privacy policy</a>
                <span class="mx-1.5">•</span>
                <a href="terms.html" class="underline hover:text-zinc-600 dark:hover:text-zinc-300">Inflight terms of use</a>
            </p>
            <p class="mt-1">© <span id="year"></span> Inflight</p>
        </footer>
    </div>

    <script>
        /* The words come from the API, not from this file. One source
           (crewTermsContent.js on the backend) feeds this page, the prompt in
           the crew center, and the version an account records agreeing to — so
           there is no way for the document somebody agreed to and the document
           they can read to drift apart. */
        const BACKEND = 'https://site--indgo-backend--6dmjph8ltlhv.code.run';
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        const drawIcons = () => { if (window.lucide) lucide.createIcons(); };

        function setThemeIcon() {
            const dark = document.documentElement.classList.contains('dark');
            $('themeIcon').innerHTML = `<i data-lucide="${dark ? 'sun' : 'moon'}" class="w-[18px] h-[18px]"></i>`;
            drawIcons();
        }
        function toggleTheme() {
            const dark = !document.documentElement.classList.contains('dark');
            document.documentElement.classList.toggle('dark', dark);
            try { localStorage.setItem('crew-theme', dark ? 'dark' : 'light'); } catch (e) {}
            setThemeIcon();
        }

        function renderBlocks(blocks) {
            return (blocks || []).map(b => {
                if (b.p) return `<p>${esc(b.p)}</p>`;
                if (Array.isArray(b.list)) return `<ul>${b.list.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
                return '';
            }).join('');
        }

        async function load() {
            setThemeIcon();
            $('year').textContent = new Date().getFullYear();
            try {
                const res = await fetch(`${BACKEND}/api/crew-terms`, { headers: { Accept: 'application/json' } });
                const d = await res.json();
                $('title').textContent = d.title;
                $('subtitle').textContent = d.subtitle;
                $('meta').textContent = `Version ${d.version} • Effective ${d.effectiveDate}`;
                $('footerMeta').textContent = `Crew Center privacy notice & conditions ${d.version}. Effective ${d.effectiveDate}.`;
                $('intro').textContent = d.intro;
                if (Array.isArray(d.summary) && d.summary.length) {
                    $('summaryList').innerHTML = d.summary.map(n =>
                        `<li class="flex gap-2"><i data-lucide="check" class="w-4 h-4 text-indigo-500 shrink-0 mt-0.5"></i><span>${esc(n)}</span></li>`).join('');
                    $('summaryWrap').classList.remove('hidden');
                }
                $('clauses').innerHTML = (d.clauses || []).map(c =>
                    `<section class="clause"><h2 class="text-[15px] font-bold text-zinc-900 dark:text-zinc-100">${esc(c.heading)}</h2>${renderBlocks(c.blocks)}</section>`
                ).join('');
                drawIcons();
            } catch (err) {
                // Deliberately not a blank page: somebody who followed this link
                // to find out what is held about them should be told the page
                // failed, not shown nothing and left to assume.
                $('clauses').innerHTML = `<p class="text-rose-500">Could not load the notice just now. Please refresh, or try again in a moment.</p>`;
            }
        }
        load();
    </script>
</body>
</html>
