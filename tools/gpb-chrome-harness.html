<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global playback chrome harness</title>
<!-- Same icon set the app loads. On a sandbox with no egress this 403s and the
     icons come out as empty circles; the layout is unaffected, so a screenshot
     with blank glyphs means no network, not a broken build. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #16324a; font-family: 'Inter', system-ui, sans-serif; }
  /* stand-in for the live map underneath */
  body { background:
      radial-gradient(70% 50% at 20% 20%, #1d4a63, transparent),
      radial-gradient(60% 60% at 80% 70%, #234f3d, transparent),
      #10202c; }
</style>
</head>
<body>
<script type="module">
import { GlobalPlayback } from '../globalPlayback.js';
window.GlobalPlayback = GlobalPlayback;

const HOUR = 3600e3;
const now = Date.now();
const { normalizePath, measureTrack } = GlobalPlayback._internals;

// __mountChromeForTest takes flights in the shape the loader leaves them —
// points normalized, track measured — not the packed wire shape.
function makeFlights(n, windowStart) {
  const out = [];
  for (let i = 0; i < n; i++) {
    // [dt seconds, lat, lon, alt, gs, hdg], as the API packs them.
    const packed = [];
    for (let s = 0; s <= 60; s++) {
      packed.push([s * 60, 40 + i * 0.1 + s * 0.02, -70 + i * 0.1 + s * 0.16,
                   1000 + s * 600, 250 + s * 4, 80 + s * 0.2]);
    }
    const f = {
      flightId: 'f' + i,
      callsign: ['BAW117', 'UAL42', 'FDX88', 'N512JT', 'N90AB', 'RCH471'][i % 6],
      username: i % 3 === 0 ? 'PilotOne' : '',
      aircraftName: ['Boeing 777-300ER', 'Airbus A320', 'Boeing 747-8F',
                     'Cessna Citation X', 'Cessna 172', 'C-130'][i % 6],
      pilotRelation: i === 3 ? 'user' : 'none',
      classMask: 0xff,
      points: normalizePath(packed, windowStart),
      cursor: 0
    };
    out.push(measureTrack(f));
  }
  return out;
}

const windowMeta = { start: now - 2 * HOUR, end: now - HOUR };
window.mount = (opts) => GlobalPlayback._internals.__mountChromeForTest({
  serverName: 'Expert',
  flights: makeFlights(40, windowMeta.start),
  windowMeta,
  ...opts
});
window.__ready = true;
</script>
</body>
</html>
