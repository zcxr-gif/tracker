<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events · InFlight</title>
    <link rel="icon" type="image/x-icon" href="Images/inflightIcon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] },
                colors: { background:'#020617', surface:'#0f172a', pro:'#fbbf24', accent:'#38bdf8' } } }
        }
    </script>
    <style>
        body { background:#020617; color:#f8fafc; font-family:Inter,sans-serif; }
        .card { background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:18px; transition:border-color 120ms; }
        .card:hover { border-color:rgba(255,255,255,0.18); }
        .chip { padding:6px 12px; border-radius:999px; font-size:0.8rem; font-weight:600;
                background:rgba(15,23,42,0.7); border:1px solid rgba(255,255,255,0.1); color:#94a3b8; cursor:pointer; }
        .chip.active { background:rgba(56,189,248,0.12); color:#38bdf8; border-color:rgba(56,189,248,0.3); }
        .badge { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:0.72rem; font-weight:600; }
        .badge-trusted { background:rgba(56,189,248,0.15); color:#38bdf8; }
        .badge-server { background:rgba(15,23,42,0.8); color:#cbd5e1; border:1px solid rgba(255,255,255,0.1); font-family:ui-monospace,monospace; text-transform:uppercase; }
        .badge-live { background:rgba(74,222,128,0.15); color:#4ade80; }
        .live-dot { position:relative; display:inline-flex; height:8px; width:8px; }
        .live-dot::after { content:''; position:absolute; inset:0; border-radius:9999px; background:#4ade80; animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite; opacity:.75; }
        .live-dot::before { content:''; position:relative; display:inline-flex; border-radius:9999px; height:8px; width:8px; background:#22c55e; }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body class="min-h-screen">
    <header class="border-b border-white/5 bg-slate-950/70 backdrop-blur sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="home.html" class="flex items-center gap-3">
                <img src="Images/inflight.png" alt="InFlight" class="h-8 w-8 rounded-md">
                <span class="font-extrabold tracking-tight">InFlight <span class="text-slate-400 font-medium">· Events</span></span>
            </a>
            <nav class="flex items-center gap-4 text-sm">
                <a href="va-apply.html" class="text-slate-400 hover:text-white">Apply your VA</a>
                <a href="home.html" class="text-slate-400 hover:text-white">Home</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div class="mb-8 flex items-start justify-between gap-4 flex-wrap">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight">Group flights & VA events</h1>
                <p class="mt-2 text-slate-400">Curated events from partner virtual airlines. Hand-reviewed by our staff.</p>
            </div>
            <a href="va-apply.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-pro text-background font-bold hover:brightness-110 transition self-center"><i class="fa-solid fa-plus"></i> Host your VA's events</a>
        </div>

        <section id="live-banner" class="hidden mb-8"></section>

        <div class="flex items-center gap-3 mb-6 flex-wrap">
            <span class="text-xs font-bold uppercase tracking-widest text-slate-500 mr-1">Server</span>
            <button class="chip active" data-server="">All</button>
            <button class="chip" data-server="expert">Expert</button>
            <button class="chip" data-server="training">Training</button>
            <button class="chip" data-server="casual">Casual</button>
            <span class="text-xs font-bold uppercase tracking-widest text-slate-500 mx-1 ml-4">Region</span>
            <select id="region" class="chip cursor-pointer bg-slate-900">
                <option value="">All regions</option>
                <option>North America</option><option>South America</option><option>Europe</option>
                <option>Africa</option><option>Middle East</option><option>Asia</option>
                <option>Oceania</option><option>Worldwide</option>
            </select>
        </div>

        <div id="events" class="space-y-4"></div>
    </main>

    <script type="module">
        import { listUpcomingApprovedEvents, formatEventTime, isLive } from './vaService.js';

        let serverFilter = '';
        let regionFilter = '';

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        async function load() {
            const events = await listUpcomingApprovedEvents({ server: serverFilter || null, region: regionFilter || null });
            const live = events.filter(isLive);
            const upcoming = events.filter(e => !isLive(e));
            const banner = document.getElementById('live-banner');
            const list = document.getElementById('events');

            if (live.length) {
                banner.classList.remove('hidden');
                banner.innerHTML = `
                    <div class="card border-emerald-500/40 bg-emerald-500/5">
                        <div class="flex items-center gap-3 mb-3"><span class="live-dot"></span><span class="font-bold text-emerald-300">Happening now</span></div>
                        <div class="grid sm:grid-cols-2 gap-3">
                            ${live.map(ev => renderCard(ev)).join('')}
                        </div>
                    </div>`;
            } else {
                banner.classList.add('hidden');
                banner.innerHTML = '';
            }

            if (!upcoming.length && !live.length) {
                list.innerHTML = `<div class="card text-center text-slate-400">No upcoming events match. Check back soon, or <a class="text-accent hover:underline" href="va-apply.html">host your VA's events here</a>.</div>`;
                return;
            }
            list.innerHTML = upcoming.map(renderCard).join('');
        }

        function renderCard(ev) {
            const va = ev.vas || {};
            const live = isLive(ev);
            return `
                <article class="card" id="${escapeHtml(ev.id)}">
                    <div class="flex items-start gap-4">
                        ${va.logo_url
                            ? `<a href="va.html?slug=${encodeURIComponent(va.slug || '')}"><img src="${escapeHtml(va.logo_url)}" alt="" class="h-12 w-12 rounded-lg object-cover border border-white/10"></a>`
                            : `<a href="va.html?slug=${encodeURIComponent(va.slug || '')}" class="h-12 w-12 rounded-lg bg-slate-800 border border-white/10 flex items-center justify-center text-slate-500"><i class="fa-solid fa-plane"></i></a>`}
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="font-bold text-lg truncate">${escapeHtml(ev.name)}</h3>
                                <span class="badge badge-server">${escapeHtml(ev.server)}</span>
                                ${live ? `<span class="badge badge-live"><span class="live-dot"></span> Live</span>` : ''}
                                ${va.trusted ? `<span class="badge badge-trusted" title="Trusted partner"><i class="fa-solid fa-shield-check"></i></span>` : ''}
                            </div>
                            <div class="mt-1 text-sm text-slate-400">
                                <a href="va.html?slug=${encodeURIComponent(va.slug || '')}" class="hover:text-white">${escapeHtml(va.name || '—')}</a>
                                · ${escapeHtml(ev.origin_icao || '')} → ${escapeHtml(ev.destination_icao || '')}
                            </div>
                            <div class="text-xs text-slate-500 mt-1">${formatEventTime(ev.start_at)}${ev.aircraft ? ' · '+escapeHtml(ev.aircraft) : ''}</div>
                            ${ev.briefing ? `<p class="mt-3 text-sm text-slate-300 whitespace-pre-wrap line-clamp-3">${escapeHtml(ev.briefing)}</p>` : ''}
                            <div class="mt-3 flex flex-wrap gap-3 text-sm">
                                ${ev.signup_url ? `<a class="inline-flex items-center gap-2 text-accent hover:underline" href="${escapeHtml(ev.signup_url)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Sign up</a>` : ''}
                                <a class="inline-flex items-center gap-2 text-slate-400 hover:text-white" href="va.html?slug=${encodeURIComponent(va.slug || '')}"><i class="fa-solid fa-building"></i> ${escapeHtml(va.name || 'VA page')}</a>
                            </div>
                        </div>
                    </div>
                </article>`;
        }

        document.querySelectorAll('.chip[data-server]').forEach(b => {
            b.addEventListener('click', () => {
                document.querySelectorAll('.chip[data-server]').forEach(c => c.classList.remove('active'));
                b.classList.add('active');
                serverFilter = b.dataset.server;
                load();
            });
        });

        document.getElementById('region').addEventListener('change', (e) => {
            regionFilter = e.target.value;
            load();
        });

        load();
    </script>
</body>
</html>
