<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Center — Inflight embed</title>
<!--
  Inflight — Crew Center widget.

  A self-contained, dependency-free embed a VA drops on their own website to
  show what their crew center already holds: the noticeboard, the published
  events, the week's schedule, the route network, the pilots on the roster or
  the airline's headline figures. One file, six views, because they are the
  same shape — a heading, a list of rows, a footer — and six near-identical
  pages would drift apart by the second change.

    /embed-crew.html?va=<slug>&view=notices
    /embed-crew.html?va=<slug>&view=events
    /embed-crew.html?va=<slug>&view=schedule
    /embed-crew.html?va=<slug>&view=routes
    /embed-crew.html?va=<slug>&view=pilots
    /embed-crew.html?va=<slug>&view=stats

  THE SAME ROWS THE CREW CENTER SHOWS

  Every view reads the endpoint the crew center itself reads, and applies the
  crew center's own publication rule to what comes back — a route is on the
  network unless it has been parked as a draft (`active === false`), an event
  or a departure is on the board unless it is a draft. That is what keeps a
  VA's own website and their crew center telling their pilots the same thing.
  Where the two could differ, they are wrong; this page is not allowed to
  invent a rule of its own.

  WHY IT NEEDS NO TOKEN

  Unlike embed.html, this reads nothing that costs anybody money and nothing
  that is not already public. The endpoints it calls are the same ones a
  visitor to the crew center reads:

    GET /api/crew/<slug>/announcements    the noticeboard
    GET /api/crew/<slug>/events           published + cancelled events
    GET /api/crew/<slug>/schedules        published + cancelled departures
    GET /api/crew/<slug>/routes           the published route network
    GET /api/crew/<slug>/roster           the pilots
    GET /api/crew/<slug>/stats            the airline's headline figures

  Drafts never appear in any of them for an unauthenticated caller — that is
  enforced by row-level security in the VA's own database, not by this page —
  and no session is sent, so this widget cannot see more than the public can.
  A VA's slug is already in the URL of their crew center; there is nothing to
  protect by making them carry a token to show their own noticeboard.

  WHAT IT WILL NOT DO

  Invent a figure, or fill a gap with a plausible row. A view whose fetch fails
  says so. A VA with nothing published shows an empty state that says nothing is
  published — not a sample event, not a placeholder notice. This widget sits on
  a real airline's homepage; a fabricated row there is read by their pilots as
  a fact about their airline.

  Every colour is themeable from the URL so it can be made to match the site it
  is pasted into, and it renders light or dark on request. It never loads a
  font, a framework or an image from anywhere — the only network call it makes
  is the one to the API above.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --accent: #2563eb;
    --radius: 14px;
    --bg: #0b0f19;
    --surface: #131a2a;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --faint: #64748b;
    --border: rgba(255,255,255,.10);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body[data-theme="light"] {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --border: rgba(15,23,42,.10);
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
    font-size: 14px;
  }
  .wrap { max-width: var(--maxw, 720px); margin: 0 auto; padding: 12px; }

  .head {
    display: flex; align-items: center; gap: 10px;
    background: var(--accent); color: #fff;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 12px 14px;
  }
  .head h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .head .count { margin-left: auto; font-size: 12px; font-weight: 600; opacity: .85; }
  .head img { height: 22px; width: auto; border-radius: 4px; }
  body[data-header="off"] .head { display: none; }
  body[data-header="off"] .panel { border-radius: var(--radius); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 0;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }
  body[data-header="off"] .panel { border-top: 1px solid var(--border); }

  .row { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start; }
  .row + .row { border-top: 1px solid var(--border); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-weight: 700; font-size: 14px; margin: 0 0 2px; }
  .row-sub { color: var(--muted); font-size: 12.5px; margin: 0; white-space: pre-wrap; }
  .row-when { color: var(--faint); font-size: 11.5px; white-space: nowrap; flex-shrink: 0; }

  .ports { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; }
  .arrow { color: var(--faint); font-weight: 400; }
  .fno {
    font-size: 11px; font-weight: 800; letter-spacing: .05em;
    padding: 1px 5px; border-radius: 4px;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
  }
  body[data-theme="dark"] .fno { color: #fff; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; }
  .meta span { color: var(--muted); font-size: 12px; }
  .tag {
    display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .04em;
    text-transform: uppercase; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--border); color: var(--muted); margin-right: 4px;
  }
  .tag-ok   { background: #16a34a; color: #fff; border-color: transparent; }
  .tag-warn { background: #d97706; color: #fff; border-color: transparent; }
  .tag-bad  { background: #dc2626; color: #fff; border-color: transparent; }
  .tag-pin  { background: var(--accent); color: #fff; border-color: transparent; }

  .day {
    padding: 8px 14px; font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .06em; color: var(--faint);
    background: color-mix(in srgb, var(--text) 4%, transparent);
    border-top: 1px solid var(--border);
  }
  .panel > .day:first-child { border-top: 0; }

  /* A pilot's initials, so the roster reads as people rather than as a table.
     Never an avatar image: the roster endpoint carries no photograph, and a
     silhouette per row would be six identical grey circles. */
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 800; letter-spacing: .02em;
  }

  /* The figures view. A grid of tiles rather than rows, because four numbers
     read as a scoreboard and four rows read as a list of settings. */
  /* Every tile carries its own top and left rule and the grid is pulled a
     pixel up and left, so the outer edges slide under the panel's own border
     instead of doubling it. Which tile starts a row is not knowable here —
     the columns auto-fit to whatever width the VA's page gives us — so no
     :first-child rule could do this job. */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin: -1px 0 0 -1px; }
  .tile { padding: 16px 14px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
  .tile-lbl {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .06em; color: var(--faint);
  }
  .tile-num { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
  .tile-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .state { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 13px; }

  .powered {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 0 2px; color: var(--faint); font-size: 11px;
    text-decoration: none;
  }
  .powered:hover { color: var(--muted); }

  /* Mobile. This widget is pasted into somebody else's page, so it cannot
     assume a viewport — it may be 320px wide in a sidebar on a phone. The row
     stops being a flex line (title and timestamp fighting over the same
     inches) and becomes two stacked lines. */
  @media (max-width: 30rem) {
    .wrap { padding: 8px; }
    .head { padding: 10px 12px; }
    .head h1 { font-size: 14px; }
    .row { padding: 10px 12px; flex-wrap: wrap; gap: 6px; }
    .row-when { width: 100%; order: 3; }
    .ports { font-size: 14px; }
    .day { padding: 7px 12px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .tile { padding: 13px 12px; }
    .tile-num { font-size: 21px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="state">Loading…</div></div>

<script>
(function () {
  "use strict";

  var qs = new URLSearchParams(location.search);

  // The backend that answers for crew centers. Overridable only so this page
  // can be pointed at a staging API during development — never at a value that
  // came from a VA's own site, because whatever it names gets to decide what
  // this widget displays under their brand.
  var BACKEND = qs.get("backend") || "https://site--indgo-backend--6dmjph8ltlhv.code.run";

  var SLUG = (qs.get("va") || qs.get("slug") || "").trim().toLowerCase();
  var VIEW = (qs.get("view") || "notices").trim().toLowerCase();
  var LIMIT = Math.max(1, Math.min(50, parseInt(qs.get("limit"), 10) || 8));

  // `roster` and `network` are accepted as aliases because they are what the
  // crew center calls these two panels, and a VA copying a view name out of
  // their own crew center should not land on the noticeboard.
  var ALIAS = { roster: "pilots", network: "routes", figures: "stats", numbers: "stats" };
  if (ALIAS[VIEW]) VIEW = ALIAS[VIEW];

  // `single` marks a view whose endpoint answers with ONE object rather than a
  // list — the figures. It is wrapped into a one-row list so the rest of this
  // file has exactly one shape to deal with.
  var VIEWS = {
    notices:  { path: "/announcements", key: "announcements", title: "Noticeboard" },
    events:   { path: "/events",        key: "events",        title: "Events" },
    schedule: { path: "/schedules",     key: "schedules",     title: "Schedule" },
    routes:   { path: "/routes",        key: "routes",        title: "Route network" },
    pilots:   { path: "/roster",        key: "roster",        title: "Pilots" },
    stats:    { path: "/stats",         key: "stats",         title: "By the numbers", single: true }
  };
  if (!VIEWS[VIEW]) VIEW = "notices";

  // How the pilots view is ordered. "roster" is the order the crew center's
  // own roster is in, which is the default because a website that disagrees
  // with the crew center about who is at the top of the list is the drift this
  // widget exists to avoid. "hours" is the leaderboard a VA usually wants on a
  // public page, and is opt-in.
  var SORT = (qs.get("sort") || "").trim().toLowerCase();

  var wrap = document.getElementById("wrap");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // An https image, or nothing. A logo is the one field here that renders as
  // something other than text.
  function safeImg(u) {
    try { return new URL(u, location.href).protocol === "https:" ? u : ""; } catch (e) { return ""; }
  }

  function clampHex(c) {
    return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(c || "").trim()) ? String(c).trim() : "";
  }

  // Dates are always rendered in the VIEWER's timezone. A VA's website is read
  // from everywhere, and a departure time in someone else's zone is the single
  // most misread thing an airline publishes.
  function dateTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleString(undefined, {
      weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
    });
  }
  function clock(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }
  function dayName(iso) {
    if (!iso) return "No date yet";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "No date yet";
    return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  }
  function dayKey(iso) {
    if (!iso) return "none";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "none";
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function ago(iso) {
    if (!iso) return "";
    var diff = Date.now() - new Date(iso).getTime();
    if (isNaN(diff)) return "";
    var mins = Math.round(Math.abs(diff) / 60000);
    var ahead = diff < 0;
    if (mins < 60) return ahead ? "in " + mins + " min" : mins + " min ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return ahead ? "in " + hrs + "h" : hrs + "h ago";
    var days = Math.round(hrs / 24);
    if (days < 30) return ahead ? "in " + days + "d" : days + "d ago";
    return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  // A figure, grouped for the reader's locale. Returns "" for anything that is
  // not a number, which is what stops a missing field rendering as "0" or as
  // "NaN" — see the note about invented figures at the top of this file.
  function num(v) {
    return v == null || !isFinite(Number(v)) ? "" : Number(v).toLocaleString();
  }
  // Hours come back to one decimal. That precision is right for a pilot's own
  // total against a rank threshold and wrong for a headline: "3,984.4" reads as
  // a measurement, "3,984" as a figure. Same rounding the crew center uses.
  function hours(v) {
    return v == null || !isFinite(Number(v)) ? "" : Math.round(Number(v)).toLocaleString();
  }
  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : "")).toUpperCase();
  }
  // A rank or a role arrives either as a plain name or as the badge object the
  // crew center draws (name + colour + icon). Only the name is of use here.
  function label(v) {
    if (!v) return "";
    return String(typeof v === "object" ? (v.name || "") : v);
  }

  // ==== Renderers, one per view ====

  function renderNotices(rows) {
    return rows.slice(0, LIMIT).map(function (n) {
      return '<div class="row"><div class="row-main">' +
        (n.pinned ? '<span class="tag tag-pin">Pinned</span>' : "") +
        '<p class="row-title">' + esc(n.title) + "</p>" +
        (n.body ? '<p class="row-sub">' + esc(n.body) + "</p>" : "") +
        "</div>" +
        '<span class="row-when">' + esc(ago(n.createdAt)) + "</span></div>";
    }).join("");
  }

  function renderEvents(rows) {
    // Cancelled events stay on the board — a pilot who signed up for something
    // that has been called off is owed the notice, which is why the API returns
    // them at all.
    return rows.slice(0, LIMIT).map(function (e) {
      var leg = [e.origin, e.destination].filter(Boolean).join(" → ");
      var tags = [];
      if (e.status === "cancelled") tags.push('<span class="tag tag-bad">Cancelled</span>');
      if (e.going != null) tags.push('<span class="tag">' + e.going + " going</span>");
      if (e.minRank) tags.push('<span class="tag">' + esc(e.minRank) + "+</span>");
      return '<div class="row"><div class="row-main">' +
        (tags.length ? "<div>" + tags.join("") + "</div>" : "") +
        '<p class="row-title">' + esc(e.title || leg || "Event") + "</p>" +
        '<div class="meta">' +
          (e.startsAt ? "<span>🕑 " + esc(dateTime(e.startsAt)) + "</span>" : "") +
          (leg ? "<span>" + esc(leg) + "</span>" : "") +
          (e.aircraft ? "<span>" + esc(e.aircraft) + "</span>" : "") +
        "</div>" +
        (e.description ? '<p class="row-sub">' + esc(e.description) + "</p>" : "") +
        "</div></div>";
    }).join("");
  }

  function renderSchedule(rows) {
    // Grouped into days, because that is how a schedule is read. Undated
    // departures fall into their own group rather than being dropped — staff
    // sketching next month still published them.
    var out = "";
    var lastDay = null;
    rows.slice(0, LIMIT).forEach(function (s) {
      var key = dayKey(s.departsAt);
      if (key !== lastDay) {
        out += '<div class="day">' + esc(dayName(s.departsAt)) + "</div>";
        lastDay = key;
      }
      var tags = [];
      if (s.status === "cancelled") tags.push('<span class="tag tag-bad">Cancelled</span>');
      else if (s.full) tags.push('<span class="tag tag-warn">Full</span>');
      else if (s.seatsLeft != null) tags.push('<span class="tag tag-ok">' + s.seatsLeft + " open</span>");
      if (s.minRank) tags.push('<span class="tag">' + esc(s.minRank) + "+</span>");

      out += '<div class="row"><div class="row-main">' +
        '<div class="ports">' +
          (s.flightNumber ? '<span class="fno">' + esc(s.flightNumber) + "</span>" : "") +
          esc(s.origin || "???") + ' <span class="arrow">→</span> ' + esc(s.destination || "???") +
        "</div>" +
        '<div class="meta">' +
          (s.departsAt ? "<span>🕑 " + esc(clock(s.departsAt)) +
            (s.arrivesAt ? " → " + esc(clock(s.arrivesAt)) : "") + "</span>" : "") +
          (s.aircraft ? "<span>" + esc(s.aircraft) + "</span>" : "") +
        "</div>" +
        (tags.length ? "<div>" + tags.join("") + "</div>" : "") +
        "</div></div>";
    });
    return out;
  }

  function renderRoutes(rows) {
    // Ordered exactly as the crew center's route panel orders them — the
    // server's order — so a pilot reading the network on the VA's website and
    // a pilot reading it in the crew center are looking at the same list.
    return rows.slice(0, LIMIT).map(function (r) {
      var tags = [];
      // A codeshare is somebody else's aeroplane. Marked plainly, for the same
      // reason the crew center marks it: a route list that renders a partner's
      // metal identically to your own overstates the airline.
      if (r.kind === "codeshare") {
        tags.push('<span class="tag">Codeshare' + (r.partnerName ? " · " + esc(r.partnerName) : "") + "</span>");
      }
      // The rank gate, as a fact about the route. Never "locked" — that is a
      // fact about one signed-in pilot, and this page has no pilot.
      if (r.minRank) tags.push('<span class="tag">' + esc(r.minRank) + "+</span>");

      return '<div class="row"><div class="row-main">' +
        '<div class="ports">' +
          (r.flightNumber ? '<span class="fno">' + esc(r.flightNumber) + "</span>" : "") +
          esc(r.origin || "???") + ' <span class="arrow">→</span> ' + esc(r.destination || "???") +
        "</div>" +
        '<div class="meta">' +
          (r.aircraft ? "<span>" + esc(r.aircraft) + "</span>" : "") +
          (isFinite(Number(r.distanceNm)) && Number(r.distanceNm) > 0
            ? "<span>" + num(Math.round(r.distanceNm)) + " nm</span>" : "") +
        "</div>" +
        (tags.length ? "<div>" + tags.join("") + "</div>" : "") +
        (r.notes ? '<p class="row-sub">' + esc(r.notes) + "</p>" : "") +
        "</div></div>";
    }).join("");
  }

  function renderPilots(rows) {
    var list = rows.slice();
    // Only when asked for. Left alone, the order is the roster's own.
    if (SORT === "hours") {
      list.sort(function (a, b) { return (Number(b.hours) || 0) - (Number(a.hours) || 0); });
    }
    return list.slice(0, LIMIT).map(function (m) {
      var name = m.name || m.callsign || "Unnamed";
      var rank = label(m.rank), role = label(m.role);
      var tags = [];
      if (rank) tags.push('<span class="tag">' + esc(rank) + "</span>");
      if (role && role !== rank) tags.push('<span class="tag">' + esc(role) + "</span>");
      // "active" is the ordinary case and says nothing; leave and inactive are
      // the states a visitor to the VA's website is owed.
      if (m.status && m.status !== "active") tags.push('<span class="tag">' + esc(m.status) + "</span>");
      var h = hours(m.hours);
      var fleet = Array.isArray(m.aircraft) ? m.aircraft.filter(Boolean) : [];

      return '<div class="row">' +
        '<div class="avatar">' + esc(initials(name)) + "</div>" +
        '<div class="row-main">' +
          '<p class="row-title">' + esc(name) +
            (m.callsign ? ' <span style="color:var(--faint);font-weight:600;font-size:12px">' + esc(m.callsign) + "</span>" : "") +
          "</p>" +
          (tags.length ? "<div>" + tags.join("") + "</div>" : "") +
          (fleet.length ? '<div class="meta"><span>' + esc(fleet.join(" · ")) + "</span></div>" : "") +
        "</div>" +
        (h ? '<span class="row-when">' + esc(h) + " h</span>" : "") +
        "</div>";
    }).join("");
  }

  // The figures, in the order the crew center's own stat strip puts them, and
  // reading the same fields off the same endpoint.
  //
  // What is NOT here is deliberate: `pirepsPending` and `applicationsPending`
  // are staff to-do counts, not achievements, and "3 applications awaiting
  // review" on an airline's public homepage is a fact about the staff's inbox.
  // They stay in the crew center, and are documented in docs/CREW-EMBEDS.md for
  // a VA who wants to build something of their own with them.
  var TILES = [
    { key: "pilots",         label: "Pilots",         sub: "pilotsActive",   subText: " active",                fmt: num },
    { key: "flights30d",     label: "Flights · 30d",  sub: "flightHours30d", subText: " hours",                 fmt: num,  subFmt: hours },
    { key: "hours",          label: "Hours logged",   sub: "flightHours",    subText: " from flight reports",   fmt: hours, subFmt: hours },
    { key: "routes",         label: "Routes",         sub: "destinations",   subText: " destinations",          fmt: num },
    { key: "pirepsApproved", label: "Flight reports", sub: null,             subText: "",                       fmt: num }
  ];

  function renderStats(rows) {
    var s = rows[0] || {};
    var tiles = TILES.map(function (t) {
      var v = t.fmt(s[t.key]);
      // A tile with no figure behind it is not drawn. An em dash would be
      // honest in the crew center, where staff know the airline; on a public
      // page it is a gap a visitor reads as a broken widget.
      if (!v) return "";
      var sv = t.sub ? (t.subFmt || num)(s[t.sub]) : "";
      return '<div class="tile">' +
        '<div class="tile-lbl">' + esc(t.label) + "</div>" +
        '<div class="tile-num">' + esc(v) + "</div>" +
        (sv ? '<div class="tile-sub">' + esc(sv + t.subText) + "</div>" : "") +
        "</div>";
    }).join("");
    return tiles ? '<div class="tiles">' + tiles + "</div>" : "";
  }

  var RENDER = {
    notices: renderNotices, events: renderEvents, schedule: renderSchedule,
    routes: renderRoutes, pilots: renderPilots, stats: renderStats
  };

  var EMPTY = {
    notices: "Nothing on the noticeboard yet.",
    events: "No events published yet.",
    schedule: "Nothing scheduled yet.",
    routes: "This airline hasn’t published any routes yet.",
    pilots: "No pilots on the roster yet.",
    stats: "This airline hasn’t published any figures yet."
  };

  function paint(rows) {
    var cfg = VIEWS[VIEW];
    var name = qs.get("name") || "";
    var logo = safeImg(qs.get("logo") || "");
    var title = qs.get("title") || (name ? name + " · " + cfg.title : cfg.title);

    // The count is how many rows are on screen. The figures view has one row —
    // the stats object — and "1" beside "By the numbers" means nothing.
    var count = cfg.single ? "" : (rows.length ? String(Math.min(rows.length, LIMIT)) : "");

    var head = '<div class="head">' +
      (logo ? '<img src="' + esc(logo) + '" alt="">' : "") +
      "<h1>" + esc(title) + "</h1>" +
      (count ? '<span class="count">' + esc(count) + "</span>" : "") +
      "</div>";

    var body = (rows.length && RENDER[VIEW](rows))
      || '<div class="state">' + esc(EMPTY[VIEW]) + "</div>";

    var powered = qs.get("powered") === "off" ? "" :
      '<a class="powered" href="https://inflight.info" target="_blank" rel="noopener">Powered by Inflight</a>';

    wrap.innerHTML = head + '<div class="panel">' + body + "</div>" + powered;
  }

  function fail(msg) {
    wrap.innerHTML = '<div class="state">' + esc(msg) + "</div>";
  }

  function applyAppearance() {
    var body = document.body;
    body.setAttribute("data-theme", qs.get("theme") === "light" ? "light" : "dark");
    body.setAttribute("data-header", qs.get("header") === "off" ? "off" : "on");

    var root = document.documentElement.style;
    var accent = clampHex(qs.get("accent") || qs.get("color"));
    if (accent) root.setProperty("--accent", accent);
    var radius = parseInt(qs.get("radius"), 10);
    if (isFinite(radius)) root.setProperty("--radius", Math.max(0, Math.min(32, radius)) + "px");
    var maxw = parseInt(qs.get("width"), 10);
    if (isFinite(maxw)) root.setProperty("--maxw", Math.max(240, Math.min(1600, maxw)) + "px");
  }

  function boot() {
    applyAppearance();
    if (!SLUG) return fail("Add ?va=<your crew center slug> to this embed’s URL.");

    var cfg = VIEWS[VIEW];
    fetch(BACKEND + "/api/crew/" + encodeURIComponent(SLUG) + cfg.path, { credentials: "omit" })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status === 404
          ? "That crew center could not be found."
          : "This crew center isn’t sharing that yet.");
        return r.json();
      })
      .then(function (d) {
        var rows;
        if (cfg.single) {
          // One object, wrapped. A `stats` that came back as anything but an
          // object is no figures at all, not an empty one.
          rows = d && d[cfg.key] && typeof d[cfg.key] === "object" ? [d[cfg.key]] : [];
        } else {
          rows = Array.isArray(d[cfg.key]) ? d[cfg.key] : [];
        }
        // The API returns drafts only to a signed-in manager, and this page
        // sends no session — but filtering here too means a future change to
        // that endpoint cannot quietly publish somebody's working copy onto
        // their own homepage.
        //
        // Two rules, because the crew center has two: an announcement, an event
        // and a departure carry `status`, and a route is parked with
        // `active: false` instead. Both are "this is not published yet", and
        // this page has to honour whichever one the row uses — the crew center's
        // rule, not a rule of its own.
        rows = rows.filter(function (r) {
          return r.status !== "draft" && r.active !== false;
        });
        paint(rows);
      })
      .catch(function (err) {
        fail(err && err.message ? err.message : "Could not load this crew center.");
      });
  }

  boot();
})();
</script>
</body>
</html>
