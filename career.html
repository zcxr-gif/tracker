<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyOps — Virtual Airline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden}
body{background:#07090e;background-image:radial-gradient(rgba(79,142,247,0.025) 1px,transparent 1px);background-size:28px 28px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.12);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,0.22)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.fade{animation:fadeUp .28s cubic-bezier(.2,.8,.2,1) both}
.blink{animation:blink 2.4s infinite}
.nav-item{cursor:pointer;transition:all .14s;border:none;background:transparent;width:100%;
  text-align:left;padding:8px 12px;display:flex;align-items:center;font-family:'Figtree',sans-serif;
  font-size:13px;font-weight:400;color:#64748b;border-radius:8px;margin-bottom:1px}
.nav-item:hover{background:rgba(79,142,247,0.07);color:#c4d0e8}
.nav-item.on{background:rgba(79,142,247,0.12);color:#4f8ef7;font-weight:600}
.btn{cursor:pointer;transition:all .12s cubic-bezier(.2,.8,.2,1);border:none;font-family:'Figtree',sans-serif}
.btn:hover:not(:disabled){opacity:.84;transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0);opacity:.92}
.card-h{transition:border-color .2s,box-shadow .2s}
.card-h:hover{border-color:rgba(148,163,184,0.15)!important}
.tr:hover>td{background:rgba(255,255,255,0.02)}
.clickable{cursor:pointer;transition:all .12s}
.clickable:hover{border-color:rgba(79,142,247,0.4)!important}
input,select,textarea{outline:none;font-family:'Figtree',sans-serif;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:rgba(79,142,247,0.45)!important;box-shadow:0 0 0 3px rgba(79,142,247,0.08)}
input[type="range"]{cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─────────────────────────── THEME ─── */
const C = {
  bg:'#07090e', sur:'#0d1117', card:'#12181f', card2:'#171f29',
  bor:'rgba(148,163,184,0.08)', bor2:'rgba(148,163,184,0.14)',
  acc:'#4f8ef7',
  txt:'#dde6f4', mut:'#566b84', dim:'rgba(148,163,184,0.05)',

const HEAD = "'Syne', sans-serif";
const MONO = "'IBM Plex Mono', monospace";
const BODY = "'Figtree', sans-serif";

/* ─────────────────────────── DATA ─── */
const INIT = {

  ],

    {id:7,name:"Carlos Ruiz",role:"Capt. (Trainee)",rating:"B737",exp:1200,morale:95,fatigue:15,salary:72000,status:"Training"},
  ],
  loans:[
    {id:1,desc:"B777-300ER Purchase",principal:12000000,remaining:8400000,rate:4.2,weekly:45000,collateral:"N-SE004"},
    {id:2,desc:"A320neo Acquisition",principal:6000000,remaining:4200000,rate:3.8,weekly:28000,collateral:"N-SE003"},

  ],
  alliance:{name:"Star Pacific Alliance",type:"Founding Member",members:["SkyEmpire","Pacific Air","Trans-Asian","Nordic Wings","Aegean Sky"],hubs:12,routes:340,pax:"42M/yr",codeShares:["Pacific Air","Trans-Asian"]},
  market:[
    {id:1,type:"Boeing 737-800",year:2015,hours:28000,price:18500000,seller:"Atlas Airlines",cond:72,note:"C-Check Due",delivery:"Immediate"},
    {id:2,type:"Airbus A321neo",year:2024,hours:0,price:44000000,seller:"Airbus (New)",cond:100,note:"Brand New",delivery:"3 days"},
    {id:3,type:"Boeing 777F",year:2018,hours:19500,price:78000000,seller:"FreightKing",cond:81,note:"Good",delivery:"Immediate"},
    {id:4,type:"Embraer E175",year:2017,hours:22100,price:12000000,seller:"RegionAir",cond:76,note:"B-Check Due",delivery:"Immediate"},
    {id:5,type:"Airbus A380-800",year:2014,hours:48200,price:85000000,seller:"GlobalAir",cond:65,note:"D-Check Due",delivery:"Immediate"},
    {id:6,type:"Boeing 787-9",year:2022,hours:6200,price:68000000,seller:"SkyBridge",cond:97,note:"Excellent",delivery:"5 days"},
  ],
  leases:[
    {type:"Boeing 737-800",source:"AerCap",weekly:95000,avail:3,min:"6 months"},
    {type:"Airbus A320neo",source:"GECAS",weekly:85000,avail:5,min:"3 months"},
    {type:"Boeing 777-200LR",source:"Air Lease Corp",weekly:210000,avail:1,min:"12 months"},
    {type:"Embraer E190",source:"Nordic Capital",weekly:48000,avail:4,min:"6 months"},
    {type:"ATR 72-600",source:"Regional Sky",weekly:22000,avail:6,min:"3 months"},
  ],
  stockMarket:[
    {ticker:"SKYE",name:"SkyEmpire Airways",price:42.50,chg:1.25,vol:125000,mine:250000},
    {ticker:"PACA",name:"Pacific Air",price:31.80,chg:-0.45,vol:89000,mine:0},
    {ticker:"NRDW",name:"Nordic Wings",price:18.20,chg:0.10,vol:42000,mine:0},
    {ticker:"GLBX",name:"GlobalFreight Air",price:67.40,chg:2.10,vol:201000,mine:0},
    {ticker:"TXAS",name:"Trans-Asian",price:24.60,chg:-1.30,vol:67000,mine:0},
    {ticker:"AGES",name:"Aegean Sky",price:11.85,chg:0.55,vol:28000,mine:0},
  ],
  news:[
    "Fuel prices up 4.2% — OPEC+ reduces output amid geopolitical tensions",
    "SkyEmpire (SKYE) hits 52-week high at $42.50 on strong Q3 results",
    "Hurricane advisory: Caribbean routes may face 12hr disruption — monitor JFK→SJU",
    "Star Pacific Alliance adds Aegean Sky as new founding member",
    "Boeing: MAX 8 deliveries delayed 3 weeks due to production line rework",
    "Transatlantic demand forecast +12% YoY — analysts: best season in 5 years",
    "Global Aviation Bank cuts prime lending rate to 3.5% — good time to refinance",
    "Oktoberfest demand spike: Munich routes up 38% — consider adding MUC service",
  ],
  fuelPrice:2.85,
  globalMorale:77,
  events:[
    {type:"weather",title:"Storm Front — KJFK",desc:"Expect 2–4hr delays. Divert buffer recommended.",color:"#fbbf24"},
    {type:"demand",title:"Peak Season Alert",desc:"Caribbean routes up 22% this week.",color:"#34d399"},
    {type:"alert",title:"Union Morale Warning",desc:"Staff morale at 77% — below 70% triggers strike risk.",color:"#f87171"},
  ],
};

/* ─────────────────────────── UTILS ─── */
const M = n => n>=1000000?`$${(n/1000000).toFixed(2)}M`:n>=1000?`$${(n/1000).toFixed(0)}K`:`$${n.toLocaleString()}`;
const crdC = s=>({AAA:C.ok,'AA+':C.ok,AA:'#86efac','A+':'#86efac',A:'#86efac',BBB:C.wrn,BB:C.wrn,B:'#fb923c',C:C.err}[s]||C.mut);
const condC = c=>c>=90?C.ok:c>=70?C.wrn:C.err;
const fatC  = f=>f<40?C.ok:f<70?C.wrn:C.err;
const morC  = m=>m>=80?C.ok:m>=60?C.wrn:C.err;
const diffC = d=>({Easy:C.ok,Medium:C.wrn,Hard:'#fb923c',Expert:C.err}[d]||C.mut);
const typeC = t=>({'VIP Charter':C.purp,'Heavy Cargo':C.wrn,'Humanitarian':C.teal,'Cargo Run':'#fb923c'}[t]||C.mut);
const statC = s=>({Active:C.ok,Maintenance:C.wrn,Rest:C.blue,'On Duty':C.teal,Available:C.ok,Training:C.purp}[s]||C.mut);
const rng   = (mn,mx)=>Math.floor(Math.random()*(mx-mn+1))+mn;

/* ─────────────────────────── PRIMITIVES ─── */
const Card = ({children,style={},onClick,hover=true})=>(
  <div className={hover?"card-h":""} onClick={onClick}
    style={{background:C.card,border:`1px solid ${C.bor}`,borderRadius:12,padding:20,
      transition:'border-color .2s',...style}}>
    {children}
  </div>
);

const Btn = ({children,onClick,color,outline,small,disabled,full,style={}})=>(
  <button className="btn" onClick={disabled?undefined:onClick} disabled={disabled}
    style={{background:outline?'transparent':(color||C.acc),
      color:outline?(color||C.acc):'#fff',
      border:`1px solid ${outline?(color||C.acc):(color||C.acc)}`,
      borderRadius:8,padding:small?'4px 12px':'7px 18px',
      fontSize:small?11:13,fontWeight:500,fontFamily:BODY,
      letterSpacing:'0.01em',cursor:disabled?'not-allowed':'pointer',
      opacity:disabled?.4:1,width:full?'100%':'auto',...style}}>
    {children}
  </button>
);

const Bar = ({val,max=100,color,h=4})=>(
  <div style={{background:'rgba(148,163,184,0.08)',borderRadius:99,height:h,overflow:'hidden'}}>
    <div style={{width:`${Math.min((val/max)*100,100)}%`,height:'100%',
      background:color||C.acc,borderRadius:99,transition:'width .5s ease'}}/>
  </div>
);

const Badge = ({label,color})=>(
  <span style={{fontSize:10,fontWeight:600,color,background:`${color}18`,
    borderRadius:5,padding:'2px 8px',letterSpacing:'0.02em',whiteSpace:'nowrap',display:'inline-block'}}>
    {label}
  </span>
);

const Stat = ({label,value,color,sub,mono})=>(
  <div style={{display:'flex',flexDirection:'column',gap:3}}>
    <span style={{fontSize:10,color:C.mut,textTransform:'uppercase',letterSpacing:'0.08em',fontWeight:500}}>{label}</span>
    <span style={{fontSize:28,fontWeight:700,color:color||C.txt,fontFamily:mono?MONO:HEAD,
      letterSpacing:'-0.02em',lineHeight:1}}>
      {value}
    </span>
    {sub&&<span style={{fontSize:11,color:C.mut,marginTop:1}}>{sub}</span>}
  </div>
);

const TabBar = ({tabs,active,set})=>(
  <div style={{display:'flex',borderBottom:`1px solid ${C.bor}`,marginBottom:24}}>
    {tabs.map(t=>(
      <button key={t} className="btn" onClick={()=>set(t)}
        style={{background:'transparent',color:active===t?C.acc:C.mut,
          border:'none',borderBottom:active===t?`2px solid ${C.acc}`:'2px solid transparent',
          padding:'8px 20px',fontSize:13,fontWeight:active===t?600:400,
          fontFamily:BODY,cursor:'pointer',marginBottom:-1,borderRadius:0}}>
        {t}
      </button>
    ))}
  </div>
);

const SH = ({title,sub})=>(
  <div style={{marginBottom:28}}>
    <h2 style={{fontFamily:HEAD,fontSize:26,fontWeight:700,color:C.txt,
      letterSpacing:'-0.02em',margin:0,lineHeight:1.1}}>{title}</h2>
    {sub&&<p style={{color:C.mut,fontSize:13,marginTop:5}}>{sub}</p>}
  </div>
);

const CardLabel = ({children})=>(
  <div style={{fontSize:11,fontWeight:600,color:C.mut,textTransform:'uppercase',
    letterSpacing:'0.07em',marginBottom:14}}>{children}</div>
);

const TH = ({children,style={}})=>(
  <th style={{textAlign:'left',padding:'9px 16px',fontSize:10,fontWeight:600,color:C.mut,
    textTransform:'uppercase',letterSpacing:'0.08em',borderBottom:`1px solid ${C.bor}`,
    whiteSpace:'nowrap',...style}}>
    {children}
  </th>
);
const TD = ({children,style={}})=>(
  <td style={{padding:'11px 16px',fontSize:13,color:C.txt,...style}}>
    {children}
  </td>
);

const Notif = ({msg,ok})=>(
  <div style={{position:'fixed',top:22,right:22,zIndex:9999,
    background:C.card2,border:`1px solid ${ok?`${C.ok}40`:`${C.err}40`}`,
    color:C.txt,borderRadius:10,padding:'12px 18px',fontSize:13,fontWeight:500,
    animation:'slidein .22s ease',fontFamily:BODY,
    boxShadow:`0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px ${ok?`${C.ok}20`:`${C.err}20`}`,
    display:'flex',alignItems:'center',gap:10,maxWidth:320}}>
    <span style={{color:ok?C.ok:C.err,fontSize:15,flexShrink:0}}>{ok?'✓':'⚠'}</span>
    <span>{msg}</span>
  </div>
);

/* ─────────────────────────── SIDEBAR ─── */
const NAV = [
  {id:'dashboard',label:'Dashboard'},
  {id:'dispatch',label:'Flight Dispatch'},
  {id:'finance',label:'Finance'},
  {id:'hangar',label:'Fleet & Market'},
  {id:'crew',label:'Crew & HR'},
  {id:'contracts',label:'Contracts'},
  {id:'alliances',label:'Alliances'},
  {id:'fbo',label:'FBO Management'},
  {id:'maintenance',label:'Maintenance'},
  {id:'map',label:'World Map'},
  {id:'settings',label:'Settings'},
];

function Sidebar({nav,setNav,d}){
  return(
    <div style={{width:214,background:C.sur,borderRight:`1px solid ${C.bor}`,
      display:'flex',flexDirection:'column',flexShrink:0,overflow:'hidden'}}>
      {/* Airline brand */}
      <div style={{padding:'18px 16px 16px',borderBottom:`1px solid ${C.bor}`}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:36,height:36,borderRadius:9,background:d.airline.primaryColor,
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:12,fontWeight:700,color:d.airline.accentColor,fontFamily:HEAD,flexShrink:0}}>
            {d.airline.iata}
          </div>
          <div style={{overflow:'hidden',flex:1}}>
            <div style={{fontSize:12,fontWeight:600,color:C.txt,fontFamily:HEAD,
              whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
              {d.airline.name}
            </div>
            <div style={{fontSize:10,color:C.mut,marginTop:2}}>Day {d.airline.day} · {d.pilot.rank}</div>
          </div>
        </div>
      </div>
      {/* Nav */}
      <nav style={{flex:1,overflow:'auto',padding:'8px 8px'}}>
        {NAV.map(n=>(
          <button key={n.id} className={`nav-item${nav===n.id?' on':''}`} onClick={()=>setNav(n.id)}>
            {n.label}
          </button>
        ))}
      </nav>
      {/* Pilot status */}
      <div style={{padding:'12px 14px',borderTop:`1px solid ${C.bor}`}}>
        <div style={{fontSize:12,fontWeight:600,color:C.txt}}>{d.pilot.name}</div>
        <div style={{fontSize:11,color:C.mut,marginBottom:8}}>{d.pilot.hours.toLocaleString()} hrs · {d.pilot.license}</div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:C.mut,marginBottom:4}}>
          <span>Pilot fatigue</span>
          <span style={{color:fatC(d.pilot.fatigue)}}>{d.pilot.fatigue}%</span>
        </div>
        <Bar val={d.pilot.fatigue} color={fatC(d.pilot.fatigue)} h={3}/>
      </div>
    </div>
  );
}

/* ─────────────────────────── HEADER ─── */
function Header({d}){
  return(
    <div style={{background:C.sur,borderBottom:`1px solid ${C.bor}`,padding:'0 24px',
      display:'flex',alignItems:'center',height:52,flexShrink:0,gap:32}}>
      <div style={{fontFamily:HEAD,fontSize:17,fontWeight:700,color:C.acc,letterSpacing:'0.1em'}}>
        Inflight
      </div>
      <div style={{flex:1}}/>
      {[
        {label:'Balance',val:M(d.airline.balance),c:C.ok,m:true},
        {label:'Credit',val:d.airline.creditScore,c:crdC(d.airline.creditScore)},
        {label:'Reputation',val:`${d.airline.reputation}`,c:morC(d.airline.reputation)},
        {label:'Fuel',val:`$${d.fuelPrice}/gal`,c:C.mut},
      ].map(({label,val,c,m})=>(
        <div key={label} style={{display:'flex',flexDirection:'column',gap:1,alignItems:'flex-end'}}>
          <span style={{fontSize:9,color:C.mut,letterSpacing:'0.09em',textTransform:'uppercase'}}>{label}</span>
          <span style={{fontSize:13,fontWeight:600,color:c,fontFamily:m?MONO:BODY}}>{val}</span>
        </div>
      ))}
      <div style={{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',
        background:'rgba(52,211,153,0.07)',borderRadius:6,border:`1px solid rgba(52,211,153,0.14)`}}>
        <div className="blink" style={{width:5,height:5,borderRadius:'50%',background:C.ok,flexShrink:0}}/>

/* ─────────────────────────── APP ─── */
function App(){
  const [nav,setNav]   = useState('dashboard');
  const [d,setD]       = useState(INIT);
  const [notif,setNotif] = useState(null);
  const [tickN,setTickN] = useState(0);

  const [finTab,setFinTab]   = useState('Bank');
  const [hanTab,setHanTab]   = useState('Fleet');
  const [cFilter,setCFilter] = useState('All');
  const [dispAc,setDispAc]   = useState('');
  const [dispFrom,setDispFrom] = useState('');
  const [dispTo,setDispTo]   = useState('');
  const [dispResult,setDispResult] = useState(null);
  const [loanAmt,setLoanAmt] = useState(1000000);
  const [selectedAc,setSelectedAc] = useState(null);
  const [fuelEdit,setFuelEdit] = useState({});
  const [settingsForm,setSettingsForm] = useState({
    name:INIT.airline.name,iata:INIT.airline.iata,hub:INIT.airline.hub,
    primary:INIT.airline.primaryColor,accent:INIT.airline.accentColor
  });

  useEffect(()=>{
    const t=setInterval(()=>setTickN(i=>(i+1)%d.news.length),5000);
    return()=>clearInterval(t);
  },[d.news.length]);

  const notify=(msg,ok=true)=>{setNotif({msg,ok});setTimeout(()=>setNotif(null),3200)};
  const upd=(u)=>setD(p=>({...p,...u}));
  const updAirline=(u)=>setD(p=>({...p,airline:{...p.airline,...u}}));

  /* ── HANDLERS ── */
  const fileFlightReport = ()=>{
    const ac=d.fleet.find(f=>f.reg===dispAc);
    const crew=d.staff.find(s=>s.status==='Available'&&s.rating.includes('B'))||d.staff[0];
    if(!ac||!dispFrom||!dispTo){notify('Select aircraft and route first',false);return;}
    const success=ac.cond>50&&crew.fatigue<80;
    const profit=success?rng(8000,52000):rng(-5000,2000);
    const outcome=success
      ?{title:'Flight Completed',msg:`${dispFrom}→${dispTo} completed. Revenue: ${M(profit)}`,ok:true}
      :{title:'Flight Incident',msg:`Rough flight due to crew fatigue. Passenger refunds issued.`,ok:false};
    setDispResult(outcome);
    updAirline({balance:d.airline.balance+profit});
    setD(p=>({...p,transactions:[
      {id:Date.now(),type:profit>0?'credit':'debit',desc:`${dispFrom}→${dispTo} Flight`,amount:Math.abs(profit),date:`Day ${p.airline.day}`},
      ...p.transactions.slice(0,19)
    ]}));
    notify(outcome.ok?`+${M(profit)} earned!`:'Incident filed — check report',outcome.ok);
  };

  const takeLoan=()=>{
    if(loanAmt<100000){notify('Minimum loan: $100K',false);return;}
    const nl={id:Date.now(),desc:"Working Capital",principal:loanAmt,remaining:loanAmt,rate:5.5,weekly:Math.round(loanAmt/52),collateral:"Cash"};
    setD(p=>({...p,loans:[...p.loans,nl],airline:{...p.airline,balance:p.airline.balance+loanAmt}}));
    notify(`Loan of ${M(loanAmt)} approved!`);
  };
  const repayLoan=(loan)=>{
    if(d.airline.balance<loan.weekly){notify('Insufficient funds',false);return;}
    setD(p=>({...p,
      loans:p.loans.map(l=>l.id===loan.id?{...l,remaining:Math.max(0,l.remaining-l.weekly*4)}:l).filter(l=>l.remaining>0),
      airline:{...p.airline,balance:p.airline.balance-loan.weekly*4}}));
    notify(`Payment of ${M(loan.weekly*4)} processed`);
  };
  const acceptContract=(cid)=>{
    setD(p=>({...p,contracts:p.contracts.map(c=>c.id===cid?{...c,accepted:true}:c)}));
    notify('Contract accepted — assign aircraft to complete');
  };
  const completeContract=(c)=>{
    setD(p=>({...p,
      contracts:p.contracts.filter(x=>x.id!==c.id),
      airline:{...p.airline,balance:p.airline.balance+c.pay,reputation:Math.min(100,p.airline.reputation+1)}}));
    notify(`Contract completed — +${M(c.pay)} earned`);
  };
  const saveSettings=()=>{
    setD(p=>({...p,airline:{...p.airline,
      name:settingsForm.name,iata:settingsForm.iata.toUpperCase().slice(0,2),
      hub:settingsForm.hub.toUpperCase(),primaryColor:settingsForm.primary,accentColor:settingsForm.accent}}));
    notify('Airline settings saved');
  };
  const saveFuelPrice=(fboId,price)=>{
    setD(p=>({...p,fbos:p.fbos.map(f=>f.id===fboId?{...f,fuelPrice:parseFloat(price)||f.fuelPrice}:f)}));
    notify('Fuel price updated');
  };

  /* ═══════════════════════════════════════════════
     RENDER SECTIONS
  ═══════════════════════════════════════════════ */

  /* ── DASHBOARD ── */
  const renderDashboard=()=>(
    <div className="fade">
      <SH title="Operations Dashboard" sub={`${d.airline.name} · Day ${d.airline.day}`}/>
      {/* Hero stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:24}}>
        <Card>
          <Stat label="Cash Balance" value={M(d.airline.balance)} color={C.ok} mono sub="Available capital"/>
        </Card>
        <Card>
          <Stat label="Daily Revenue" value={M(d.routes.reduce((a,r)=>a+r.rev,0))} color={C.acc} mono sub="All routes combined"/>
        </Card>
        <Card>
          <Stat label="Reputation" value={`${d.airline.reputation}`} color={morC(d.airline.reputation)} sub="Global score"/>
          <div style={{marginTop:12}}><Bar val={d.airline.reputation} color={morC(d.airline.reputation)}/></div>
        </Card>
        <Card>
          <Stat label="Fleet" value={String(d.fleet.length)} sub={`${d.fleet.filter(f=>f.status==='Active').length} active · ${d.fleet.filter(f=>f.status==='Maintenance').length} in maintenance`}/>

      <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:16}}>

            <span style={{fontSize:13,fontWeight:600,color:C.txt}}>Active Routes</span>

        </Card>

        {/* Right panel */}
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <Card>

            {d.events.map((ev,i)=>(
              <div key={i} style={{paddingLeft:12,borderLeft:`2px solid ${ev.color}`,marginBottom:i<d.events.length-1?14:0}}>
                <div style={{fontSize:13,fontWeight:600,color:C.txt}}>{ev.title}</div>
                <div style={{fontSize:12,color:C.mut,marginTop:3,lineHeight:1.5}}>{ev.desc}</div>

          </Card>
          <Card>
            <CardLabel>Active Loans</CardLabel>

              </div>

        </div>
      </div>
    </div>
  );

          </div>
          <div style={{borderTop:`1px solid ${C.bor}`,marginTop:14,paddingTop:14,display:'flex',gap:8}}>
            {fbo.level<5&&<Btn small onClick={()=>notify(`Upgrading ${fbo.name} to Level ${fbo.level+1}`)} color={C.teal}>
              Upgrade to L{fbo.level+1} ({M(fbo.level*250000)})
            </Btn>}
            <Btn small outline onClick={()=>notify('Maintenance hangar added')}>Add Hangar ({M(150000)})</Btn>
            <Btn small outline onClick={()=>notify('Passenger lounge added')}>Add Lounge ({M(80000)})</Btn>
          </div>
        </Card>
      ))}
      <Card style={{border:`1px dashed ${C.bor2}`,background:'transparent',textAlign:'center',padding:28}}>
        <div style={{fontSize:13,color:C.mut,marginBottom:12}}>Expand your ground network — bid for FBO rights at new airports</div>
        <Btn onClick={()=>notify('FBO auction browser opened. Bidding opens in 2 days.')}>Browse Available Airports</Btn>
      </Card>
    </div>
  );

  /* ── MAINTENANCE ── */
  const renderMaintenance=()=>(
    <div className="fade">
      <SH title="Maintenance & Salvage" sub="Component wear tracking, scheduled checks, and the boneyard"/>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
        <Card><Stat label="In Maintenance" value={String(d.fleet.filter(f=>f.status==='Maintenance').length)} color={C.wrn}/></Card>
        <Card><Stat label="Next Scheduled Check" value="Jul 30" sub="N-SE005 — C-Check"/></Card>
        <Card><Stat label="Maintenance Reserve" value={M(320000)} mono color={C.ok} sub="Escrowed funds"/></Card>
      </div>

      <Card style={{padding:0,marginBottom:16}}>
        <div style={{padding:'14px 20px',borderBottom:`1px solid ${C.bor}`,fontSize:13,fontWeight:600,color:C.txt}}>Component Wear by Aircraft</div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>{['Aircraft','Type','Engines','Tires','Brakes','Airframe','Next Check','Action'].map(h=><TH key={h}>{h}</TH>)}</tr></thead>
          <tbody>{d.fleet.map(ac=>(
            <tr key={ac.id} className="tr">
              <TD><span style={{fontFamily:MONO,color:C.acc,fontWeight:600}}>{ac.reg}</span></TD>
              <TD><span style={{fontSize:12,color:C.mut}}>{ac.type.split(' ').slice(0,2).join(' ')}</span></TD>
              {[{v:Math.max(0,ac.cond-5)},{v:ac.tires},{v:ac.brakes},{v:ac.cond}].map((comp,i)=>(
                <TD key={i}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:48}}><Bar val={comp.v} color={condC(comp.v)}/></div>
                    <span style={{fontSize:11,fontFamily:MONO,color:condC(comp.v)}}>{comp.v}%</span>
                  </div>
                </TD>
              ))}
              <TD><span style={{fontSize:11,color:C.wrn,fontFamily:MONO}}>{ac.maint}</span></TD>
              <TD>
                <Btn small color={ac.status==='Maintenance'?C.wrn:C.acc}
                  onClick={()=>notify(`Maintenance scheduled for ${ac.reg}. Est: ${M(rng(15000,80000))}. 2–5 days downtime.`)}>
                  {ac.status==='Maintenance'?'In Shop':'Schedule'}
                </Btn>
              </TD>
            </tr>
          ))}</tbody>
        </table>
      </Card>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}}>
        {[
          {type:'A-Check',freq:'Every 400–600 hrs',cost:'$5K–25K',time:'1 day',color:C.ok},
          {type:'B-Check',freq:'Every 6–8 months',cost:'$50K–150K',time:'3–5 days',color:C.wrn},
          {type:'C-Check',freq:'Every 18–24 months',cost:'$150K–500K',time:'1–2 weeks',color:'#fb923c'},
          {type:'D-Check',freq:'Every 6–10 years',cost:'$1M–5M',time:'2 months',color:C.err},
        ].map(c=>(
          <Card key={c.type} style={{borderTop:`2px solid ${c.color}`}}>
            <div style={{fontSize:15,fontWeight:700,color:c.color,fontFamily:HEAD,marginBottom:4}}>{c.type}</div>
            <div style={{fontSize:11,color:C.mut}}>{c.freq}</div>
            <div style={{fontSize:14,fontFamily:MONO,color:C.txt,marginTop:8}}>{c.cost}</div>
            <div style={{fontSize:10,color:C.mut,marginTop:2}}>Downtime: {c.time}</div>
          </Card>
        ))}
      </div>

      <Card style={{borderColor:`${C.err}25`}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
          <div style={{fontSize:15,fontWeight:700,color:C.txt}}>Boneyard — Victorville, CA</div>
          <Badge label="Storage Facility" color={C.mut}/>
        </div>
        <div style={{fontSize:12,color:C.mut,marginBottom:14,lineHeight:1.7}}>
          Retire aging aircraft to the boneyard. Scrap for immediate cash payout, or strip for valuable spare parts to maintain your active fleet at lower cost.
        </div>
        <div style={{display:'flex',gap:10}}>
          {d.fleet.filter(f=>f.cond<75||f.age>15).map(ac=>(
            <Card key={ac.id} style={{padding:12,flex:1}}>
              <div style={{fontSize:11,fontFamily:MONO,color:C.acc}}>{ac.reg}</div>
              <div style={{fontSize:12,color:C.txt,marginTop:2}}>{ac.type.split(' ').slice(0,2).join(' ')}</div>
              <div style={{fontSize:10,color:C.err,marginTop:4}}>Cond: {ac.cond}% · Age: {ac.age}yr</div>
              <div style={{display:'flex',gap:6,marginTop:8}}>
                <Btn small color={C.wrn} onClick={()=>notify(`${ac.reg} scrapped for ${M(rng(200000,800000))}`)}>Scrap</Btn>
                <Btn small outline onClick={()=>notify(`${ac.reg} stripped — saves 30% on future maintenance`)}>Parts</Btn>
              </div>
            </Card>
          ))}
          {d.fleet.filter(f=>f.cond<75||f.age>15).length===0&&(
            <div style={{color:C.mut,fontSize:12}}>No aircraft currently qualify for the boneyard.</div>
          )}
        </div>
      </Card>
    </div>
  );

  /* ── WORLD MAP ── */
  const renderWorldMap=()=>{
    const W=820,H=400;
    const toXY=(lat,lon)=>[(((lon+180)/360)*W),(((90-lat)/180)*H)];
    const AP={
      JFK:toXY(40.6,-73.8),LHR:toXY(51.5,-0.1),LAX:toXY(33.9,-118.4),
      NRT:toXY(35.7,140.4),ORD:toXY(41.9,-87.9),BOS:toXY(42.4,-71.0),
      MIA:toXY(25.8,-80.3),CDG:toXY(49.0,2.5),DXB:toXY(25.3,55.4),
      ICN:toXY(37.5,126.5),ANC:toXY(61.2,-149.9),ADD:toXY(8.9,38.8),
      SEA:toXY(47.5,-122.3),MEM:toXY(35.0,-89.9),SJC:toXY(37.3,-121.9),
    };
    const FBOS=['JFK','LAX','ORD'];
    const ROUTES=d.routes.map(r=>({from:r.from,to:r.to}));
    return(
      <div className="fade">
        <SH title="World Map" sub="Active routes, owned FBOs, and high-demand airports"/>
        <div style={{display:'flex',gap:20,marginBottom:12}}>
          {[{color:C.acc,label:'Your hub'},{color:C.ok,label:'FBO owned'},{color:C.teal,label:'Active route'},{color:C.mut,label:'Other airport'}].map(l=>(
            <div key={l.label} style={{display:'flex',alignItems:'center',gap:6}}>
              <div style={{width:8,height:8,borderRadius:'50%',background:l.color}}/>
              <span style={{fontSize:11,color:C.mut}}>{l.label}</span>
            </div>
          ))}
        </div>
        <Card style={{padding:8,marginBottom:14}}>
          <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block',background:'#0a0f1a',borderRadius:8}}>
            {[...Array(13)].map((_,i)=>(
              <line key={`v${i}`} x1={i*(W/12)} y1={0} x2={i*(W/12)} y2={H} stroke="rgba(148,163,184,0.07)" strokeWidth={0.5}/>
            ))}
            {[...Array(7)].map((_,i)=>(
              <line key={`h${i}`} x1={0} y1={i*(H/6)} x2={W} y2={i*(H/6)} stroke="rgba(148,163,184,0.07)" strokeWidth={0.5}/>
            ))}
            <path d="M 55,40 L 250,38 L 300,68 L 315,115 L 290,200 L 255,248 L 205,255 L 152,225 L 98,185 L 60,138 Z" fill="rgba(148,163,184,0.06)" stroke="rgba(148,163,184,0.12)" strokeWidth={0.7}/>
            <path d="M 178,248 L 268,248 L 295,318 L 275,388 L 222,398 L 178,358 L 158,295 Z" fill="rgba(148,163,184,0.06)" stroke="rgba(148,163,184,0.12)" strokeWidth={0.7}/>
            <path d="M 348,35 L 462,35 L 478,90 L 448,122 L 385,122 L 348,90 Z" fill="rgba(148,163,184,0.06)" stroke="rgba(148,163,184,0.12)" strokeWidth={0.7}/>
            <path d="M 382,122 L 498,122 L 516,222 L 495,328 L 442,348 L 382,308 L 358,222 Z" fill="rgba(148,163,184,0.06)" stroke="rgba(148,163,184,0.12)" strokeWidth={0.7}/>
            <path d="M 452,28 L 762,28 L 778,122 L 758,205 L 688,225 L 582,205 L 502,172 L 452,122 Z" fill="rgba(148,163,184,0.06)" stroke="rgba(148,163,184,0.12)" strokeWidth={0.7}/>
            <path d="M 682,265 L 788,265 L 798,325 L 748,358 L 692,338 Z" fill="rgba(148,163,184,0.06)" stroke="rgba(148,163,184,0.12)" strokeWidth={0.7}/>
            {ROUTES.map((r,i)=>{
              const a=AP[r.from],b=AP[r.to];
              if(!a||!b)return null;
              const mx=(a[0]+b[0])/2,my=Math.min(a[1],b[1])-32;
              return(
                <path key={i} d={`M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}`}
                  fill="none" stroke={C.teal} strokeWidth={1.2} strokeDasharray="5 4" opacity={0.6}/>
              );
            })}
            {Object.entries(AP).map(([code,[x,y]])=>{
              const isFBO=FBOS.includes(code);
              const isHub=d.airline.hub.replace('K','')===code;
              const isRoute=ROUTES.some(r=>r.from===code||r.to===code);
              return(
                <g key={code}>
                  {isFBO&&<circle cx={x} cy={y} r={9} fill="none" stroke={C.ok} strokeWidth={1} opacity={0.4}/>}
                  <circle cx={x} cy={y} r={isHub?6:isFBO?5:isRoute?4:2.5}
                    fill={isHub?C.acc:isFBO?C.ok:isRoute?C.teal:C.mut} opacity={isRoute||isHub?1:0.6}/>
                  <text x={x+7} y={y+4} fontSize={8} fill={C.mut} fontFamily={MONO} fontWeight={500}>{code}</text>
                </g>
              );
            })}
          </svg>
        </Card>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
          {d.fbos.map(f=>(
            <Card key={f.id} style={{padding:12}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:C.ok,flexShrink:0}}/>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:C.txt}}>{f.name} <span style={{color:C.mut,fontFamily:MONO,fontSize:10}}>({f.airport})</span></div>
                  <div style={{fontSize:10,color:C.mut}}>Level {f.level} FBO · ${f.dailyRev.toLocaleString()}/day</div>
                </div>
              </div>
            </Card>
          ))}
        </div>
      </div>
    );
  };

  /* ── SETTINGS ── */
  const renderSettings=()=>(
    <div className="fade">
      <SH title="Airline Settings" sub="Customize your airline identity and livery"/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
        <div>
          <Card style={{marginBottom:16}}>
            <CardLabel>Airline Identity</CardLabel>
            {[
              {label:'Airline Name',key:'name',type:'text',placeholder:'e.g. SkyEmpire Airways'},
              {label:'IATA Code (2 letters)',key:'iata',type:'text',placeholder:'SE',max:2},
              {label:'ICAO Hub Airport',key:'hub',type:'text',placeholder:'KJFK',max:4},
            ].map(f=>(
              <div key={f.key} style={{marginBottom:14}}>
                <div style={{fontSize:11,color:C.mut,marginBottom:5}}>{f.label}</div>
                <input type={f.type} value={settingsForm[f.key]} maxLength={f.max}
                  onChange={e=>setSettingsForm(p=>({...p,[f.key]:e.target.value}))}
                  placeholder={f.placeholder}
                  style={{width:'100%',background:C.card2,border:`1px solid ${C.bor}`,borderRadius:8,
                    padding:'9px 12px',color:C.txt,fontSize:14,fontFamily:f.key==='iata'||f.key==='hub'?MONO:BODY}}/>
              </div>
            ))}
          </Card>
          <Card>
            <CardLabel>Livery Colors</CardLabel>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
              {[{label:'Primary (Fuselage)',key:'primary'},{label:'Accent (Tailfin)',key:'accent'}].map(f=>(
                <div key={f.key}>
                  <div style={{fontSize:11,color:C.mut,marginBottom:6}}>{f.label}</div>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <div style={{width:40,height:40,borderRadius:8,background:settingsForm[f.key],border:`1px solid ${C.bor}`,flexShrink:0}}/>
                    <input type="color" value={settingsForm[f.key]}
                      onChange={e=>setSettingsForm(p=>({...p,[f.key]:e.target.value}))}
                      style={{width:80,height:40,background:'none',border:`1px solid ${C.bor}`,borderRadius:8,cursor:'pointer',padding:2}}/>
                  </div>
                </div>
              ))}
            </div>
            <div style={{fontSize:10,color:C.mut,marginTop:12}}>Colors apply to your airline logo and fleet livery simulation</div>
          </Card>
        </div>

        <div>
          <Card style={{marginBottom:16}}>
            <CardLabel>Preview</CardLabel>
            <div style={{background:C.card2,borderRadius:10,padding:20,textAlign:'center',marginBottom:16}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,marginBottom:16}}>
                <div style={{width:56,height:56,borderRadius:10,background:settingsForm.primary,
                  display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,
                  fontWeight:700,fontFamily:HEAD,letterSpacing:'0.04em',color:settingsForm.accent}}>
                  {settingsForm.iata.toUpperCase().slice(0,2)||'??'}
                </div>
                <div style={{textAlign:'left'}}>
                  <div style={{fontSize:18,fontWeight:700,fontFamily:HEAD,color:settingsForm.primary}}>{settingsForm.name||'Airline Name'}</div>
                  <div style={{fontSize:11,color:C.mut,marginTop:2}}>Hub: {settingsForm.hub.toUpperCase()||'????'}</div>
                </div>
              </div>
              <svg viewBox="0 0 200 80" width={200} height={80}>
                <rect x={20} y={35} width={160} height={12} rx={6} fill={settingsForm.primary}/>
                <polygon points="155,35 185,25 185,35" fill={settingsForm.accent}/>
                <rect x={60} y={22} width={80} height={13} rx={4} fill={settingsForm.primary}/>
                <rect x={80} y={47} width={40} height={6} rx={3} fill={settingsForm.accent}/>
                <circle cx={30} cy={47} r={5} fill={C.card} stroke={settingsForm.primary} strokeWidth={2}/>
                <circle cx={170} cy={47} r={5} fill={C.card} stroke={settingsForm.primary} strokeWidth={2}/>
                <text x={100} y={42} textAnchor="middle" fontSize={8} fill={settingsForm.accent} fontFamily={HEAD} fontWeight={700}>{settingsForm.iata.toUpperCase().slice(0,2)||'  '}</text>
              </svg>
            </div>
            <Btn onClick={saveSettings} full>Save Settings</Btn>
          </Card>
          <Card>
            <CardLabel>Airline Stats</CardLabel>
            {[
              {label:'IATA Code',val:d.airline.iata},
              {label:'Callsign',val:d.airline.callsign},
              {label:'Fleet size',val:`${d.fleet.length} aircraft`},
              {label:'Active routes',val:`${d.routes.length} routes`},
              {label:'Total staff',val:`${d.staff.length} employees`},
              {label:'Public / Private',val:d.airline.isPublic?`Public — SKYE ($${d.airline.stockPrice})`:'Private'},
              {label:'Market cap',val:d.airline.isPublic?M(d.airline.stockPrice*d.airline.totalShares):'N/A'},
            ].map(r=>(
              <div key={r.label} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:`1px solid ${C.bor}`}}>
                <span style={{fontSize:12,color:C.mut}}>{r.label}</span>
                <span style={{fontSize:12,fontFamily:MONO,color:C.txt}}>{r.val}</span>
              </div>
            ))}
          </Card>
        </div>
      </div>
    </div>
  );

  /* ── SECTION ROUTER ── */
  const SECTIONS={
    dashboard:renderDashboard,dispatch:renderDispatch,finance:renderFinance,
    hangar:renderHangar,crew:renderCrew,contracts:renderContracts,
    alliances:renderAlliances,fbo:renderFBO,maintenance:renderMaintenance,
    map:renderWorldMap,settings:renderSettings,
  };

  return(
    <div style={{fontFamily:BODY,background:C.bg,color:C.txt,height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {notif&&<Notif msg={notif.msg} ok={notif.ok}/>}
      <Header d={d}/>
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <Sidebar nav={nav} setNav={setNav} d={d}/>
        <main style={{flex:1,overflow:'auto',padding:'28px 32px',background:C.bg}}>
          {(SECTIONS[nav]||renderDashboard)()}
        </main>
      </div>
      {/* News feed */}
      <div style={{background:C.sur,borderTop:`1px solid ${C.bor}`,padding:'0 20px',
        display:'flex',alignItems:'center',gap:14,flexShrink:0,height:34,overflow:'hidden'}}>
        <span style={{fontSize:9,fontWeight:600,color:C.acc,letterSpacing:'0.1em',whiteSpace:'nowrap',flexShrink:0,textTransform:'uppercase'}}>News</span>
        <div style={{width:1,height:14,background:C.bor2,flexShrink:0}}/>
        <div style={{flex:1,overflow:'hidden'}}>
          <div style={{fontSize:11,color:C.mut,whiteSpace:'nowrap',transition:'opacity .4s',padding:'0 4px'}}>
            {d.news[tickN]}
          </div>
        </div>
        <div style={{width:1,height:14,background:C.bor2,flexShrink:0}}/>
        <span style={{fontSize:10,color:C.mut,whiteSpace:'nowrap',flexShrink:0,fontFamily:MONO}}>
          Day {d.airline.day} · ${d.fuelPrice}/gal
        </span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
