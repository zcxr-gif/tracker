<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Avionics Interface</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    /* --- DESIGN TOKENS --- */
    :root {
        /* Palette: "Stratosphere" */
        --bg-glass: rgba(15, 23, 42, 0.65); /* Deep Navy Slate */
        --bg-panel: rgba(30, 41, 59, 0.4); /* Lighter panel bg */
        --border-glass: rgba(255, 255, 255, 0.08);
        --border-highlight: rgba(255, 255, 255, 0.15);
        
        /* Typography Colors */
        --text-primary: #f8fafc; /* Titanium White */
        --text-secondary: #94a3b8; /* Instrument Grey */
        --text-dim: #475569;
        
        /* Functional Colors */
        --color-accent: #38bdf8; /* Sky Blue - Information */
        --color-success: #10b981; /* Emerald - Normal Ops */
        --color-warning: #f59e0b; /* Amber - Caution/Transition */
        --color-danger: #ef4444; /* Red - Alert */
        --color-active: #ffffff; /* Active State */

        /* Dimensions */
        --gap-xs: 4px;
        --gap-sm: 8px;
        --gap-md: 16px;
        --radius-sm: 8px;
        --radius-lg: 16px;
        
        /* Fonts */
        --font-ui: 'Inter', -apple-system, sans-serif;
        --font-data: 'JetBrains Mono', monospace;

        /* Motion */
        --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    /* --- RESET & BASE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
        background: transparent; /* Allows parent transparency */
        height: 100vh;
        font-family: var(--font-ui);
        overflow: hidden;
        color: var(--text-primary);
        perspective: 1000px;
    }

    /* --- MAIN CONTAINER (The Glass Slice) --- */
    .avionics-window {
        width: 100%;
        height: 100%;
        background: var(--bg-glass);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        display: flex;
        flex-direction: column;
        position: relative;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* --- HEADER: IDENTITY (REDESIGNED) --- */
    .header-section {
        padding: 16px 20px; /* Tighter padding */
        flex-shrink: 0;
        z-index: 10;
        background: rgba(15, 23, 42, 0.85); /* Darker background for contrast */
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border-glass);
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .pilot-info-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .pilot-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--color-accent);
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        opacity: 0.8;
        transition: opacity 0.2s;
    }
    .pilot-label:hover { opacity: 1; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }

    .main-callsign {
        font-family: var(--font-ui);
        font-weight: 800;
        font-size: 26px; /* Slightly smaller for balance */
        line-height: 1;
        letter-spacing: -0.5px;
        color: #fff;
        background: linear-gradient(180deg, #fff, #e2e8f0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    /* NEW: Status Badge Styles */
    .flight-state-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        transition: all 0.3s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Dynamic State Colors */
    .state-climb { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #34d399; }
    .state-descend { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.3); color: #fbbf24; }
    .state-cruise { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8; }
    .state-ground { background: rgba(148, 163, 184, 0.1); border-color: rgba(148, 163, 184, 0.3); color: #cbd5e1; }
    
    .state-icon { font-size: 10px; opacity: 0.9; }

    /* --- SCROLL AREA --- */
    .scroll-viewport {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px 16px; /* Added top padding back */
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    
    .scroll-viewport::-webkit-scrollbar { width: 4px; }
    .scroll-viewport::-webkit-scrollbar-track { background: transparent; }
    .scroll-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    /* --- HERO CARD (Image + Aircraft) --- */
    .hero-card {
        position: relative;
        /* FIXED: Locked height and disabled flex-grow */
        width: 100%;
        height: 260px; /* Fixed height to keep it consistent */
        flex: 0 0 auto; /* Don't stretch */
        
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--border-glass);
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    .hero-img {
        width: 100%; height: 100%;
        object-fit: cover; /* Ensures image fills the box */
        object-position: center; /* Centers the plane */
        transition: transform 5s ease;
    }
    .hero-card:hover .hero-img { transform: scale(1.05); }

    .hero-overlay {
        position: absolute; bottom: 0; left: 0; right: 0;
        background: linear-gradient(to top, rgba(15,23,42,0.95), transparent);
        padding: 40px 16px 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .photo-credit {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 9px;
        color: rgba(255, 255, 255, 0.7);
        background: rgba(0, 0, 0, 0.4);
        padding: 3px 8px;
        border-radius: 6px;
        backdrop-filter: blur(4px);
        pointer-events: none;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-transform: uppercase;
    }

    .ac-info h2 {
        font-size: 16px; font-weight: 700; color: #fff;
        margin-bottom: 2px;
    }
    .ac-info span {
        font-size: 12px; color: var(--text-secondary);
        display: block; font-weight: 500;
    }

    .ac-reg-badge {
        font-family: var(--font-data);
        font-size: 12px;
        background: rgba(255,255,255,0.1);
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--border-glass);
        backdrop-filter: blur(4px);
    }

    /* --- BENTO GRID (Telemetry) --- */
    .grid-section-label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-dim);
        letter-spacing: 1px;
        margin-bottom: 8px;
        font-weight: 700;
        padding-left: 4px;
    }

    .telemetry-bento {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    .bento-cell {
        background: var(--bg-panel);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-sm);
        padding: 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 80px;
        transition: background 0.2s, border-color 0.2s;
    }
    
    .bento-cell:hover {
        background: rgba(255,255,255,0.05);
        border-color: var(--border-highlight);
    }

    .cell-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 4px;
    }
    
    .cell-label {
        font-size: 10px; text-transform: uppercase; color: var(--text-secondary);
        font-weight: 600; letter-spacing: 0.05em;
    }
    
    .cell-icon { font-size: 10px; color: var(--text-dim); }

    .cell-data {
        font-family: var(--font-data);
        font-size: 22px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.5px;
        display: flex;
        align-items: baseline;
        gap: 4px;
    }
    
    .cell-unit { font-size: 12px; color: var(--text-dim); font-weight: 500; }

    .cell-vs-graphic {
        display: flex; align-items: center; gap: 8px;
        font-size: 16px;
    }
    .vs-arrow { transition: transform 0.3s; color: var(--text-dim); }
    .vs-arrow.climbing { color: var(--color-success); transform: rotate(-45deg); }
    .vs-arrow.descending { color: var(--color-warning); transform: rotate(45deg); }

    /* --- ROUTE TIMELINE --- */
    .route-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-lg);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .route-card:hover {
        border-color: var(--border-highlight);
    }

    .route-visual-header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.02);
        cursor: pointer; /* Interaction */
        position: relative;
    }
    
    /* Hover effect for the clickable header */
    .route-visual-header:hover {
        background: rgba(255,255,255,0.05);
    }
    
    /* Toggle Icon styling */
    .route-toggle-icon {
        position: absolute;
        top: 8px;
        right: 8px; /* Position in corner */
        font-size: 10px;
        color: var(--text-dim);
        transition: transform 0.3s var(--ease-out), color 0.3s;
    }
    .route-card.expanded .route-toggle-icon {
        transform: rotate(180deg);
        color: var(--color-accent);
    }
    
    .route-airport { text-align: center; }
    
    /* --- NEW: Route Airport Layout with Flags --- */
    .route-airport-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .country-flag {
        height: 14px;
        width: auto;
        border-radius: 2px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        display: none; /* Hidden by default if no src */
    }

    .route-icao { 
        display: block; font-family: var(--font-data); 
        font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2;
    }
    .route-time { 
        display: block; font-size: 11px; color: var(--text-secondary); margin-top: 2px;
    }

    .route-graphic {
        flex: 1; margin: 0 16px; position: relative; height: 30px; display: flex; align-items: center;
    }
    .track-line {
        width: 100%; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px;
    }
    .track-progress {
        position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        height: 2px; background: var(--color-accent); width: 0%;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        transition: width 0.5s linear;
    }
    
    /* FIXED: Changed rotation from 90deg to 0deg to face East/Right */
    .track-plane {
        position: absolute; top: 50%; left: 0%;
        transform: translate(-50%, -50%) rotate(0deg); 
        color: #fff; font-size: 14px;
        transition: left 0.5s linear;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
    }

    /* --- DROPDOWN WRAPPER --- */
    .waypoint-dropdown-wrapper {
        max-height: 0; /* Hidden by default */
        overflow: hidden;
        transition: max-height 0.4s var(--ease-out);
        border-top: 1px solid transparent;
    }
    
    .route-card.expanded .waypoint-dropdown-wrapper {
        max-height: 350px; /* Max expand height */
        border-top: 1px solid var(--border-glass);
    }

    .waypoint-list {
        padding: 0;
        max-height: 350px; 
        overflow-y: auto;
    }
    
    /* --- NICE SCROLLBAR FOR FLIGHT PLAN --- */
    .waypoint-list::-webkit-scrollbar {
        width: 5px;
    }
    .waypoint-list::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.2);
    }
    .waypoint-list::-webkit-scrollbar-thumb {
        background: var(--bg-panel); 
        border: 1px solid var(--border-glass);
        border-radius: 10px;
    }
    .waypoint-list::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent);
    }
    
    /* --- NEW: SECTION HEADERS --- */
    .wp-group-header {
        position: sticky;
        top: 0;
        padding: 6px 16px;
        background: rgba(15, 23, 42, 0.95); /* Dark background to cover scroll */
        color: var(--color-accent);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid var(--border-glass);
        border-top: 1px solid var(--border-glass);
        z-index: 5;
        backdrop-filter: blur(4px);
    }

    .wp-row {
        display: flex; align-items: center;
        padding: 10px 16px;
        position: relative;
    }
    .wp-row:not(:last-child)::after {
        content: ''; position: absolute; bottom: 0; left: 40px; right: 0;
        height: 1px; background: var(--border-glass);
    }

    .wp-status {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--text-dim); margin-right: 16px;
        position: relative; z-index: 2;
    }
    .wp-row.passed .wp-status { background: var(--color-success); opacity: 0.5; }
    
    .wp-row.active {
        background: rgba(56, 189, 248, 0.05); /* Highlight active row */
    }
    .wp-row.active .wp-status { 
        background: var(--color-accent); 
        box-shadow: 0 0 8px var(--color-accent);
        transform: scale(1.3);
    }

    .wp-line-connect {
        position: absolute; left: 18px; top: -50%; bottom: -50%;
        width: 2px; background: rgba(255,255,255,0.05); z-index: 1;
    }
    .wp-row:first-child .wp-line-connect { top: 50%; }
    .wp-row:last-child .wp-line-connect { bottom: 50%; }

    .wp-data { flex: 1; }
    .wp-ident { font-size: 13px; font-weight: 600; color: var(--text-primary); display: block; }
    .wp-name { font-size: 11px; color: var(--text-secondary); display: block; }
    .wp-ete { font-family: var(--font-data); font-size: 12px; color: var(--text-dim); }
    .wp-row.active .wp-ete { color: var(--color-accent); font-weight: 600; }

    /* --- NEW: LOCATION CARD STYLES --- */
    .location-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: border-color 0.2s;
    }
    .location-card:hover { border-color: var(--border-highlight); }
    
    .loc-icon-box {
        width: 32px; height: 32px;
        border-radius: 8px;
        background: rgba(56, 189, 248, 0.1);
        display: flex; align-items: center; justify-content: center;
        color: var(--color-accent);
        font-size: 14px;
        flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    .loc-content { display: flex; flex-direction: column; }
    .loc-main { 
        font-size: 14px; 
        font-weight: 600; 
        color: var(--text-primary); 
        letter-spacing: -0.2px;
    }
    .loc-sub { 
        font-size: 11px; 
        color: var(--text-secondary); 
        margin-top: 2px; 
        font-weight: 500;
    }

    /* --- FOOTER: ESSENTIALS --- */
    .footer-bar {
        margin-top: auto;
        padding: 12px 16px;
        background: rgba(0,0,0,0.2);
        border-top: 1px solid var(--border-glass);
        display: flex;
        justify-content: space-around;
        backdrop-filter: blur(10px);
    }

    .footer-stat { text-align: center; }
    .f-label { font-size: 9px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 2px; }
    .f-value { font-family: var(--font-data); font-size: 14px; font-weight: 600; color: var(--text-primary); }

    /* --- LOADING SKELETON --- */
    .skeleton {
        background: rgba(255,255,255,0.05);
        border-radius: 4px;
        color: transparent !important;
        animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.6; }
        100% { opacity: 0.3; }
    }

    </style>
</head>
<body>

    <div class="avionics-window">
        
        <header class="header-section">
            <div class="pilot-info-group">
                <div class="pilot-label" onclick="parent.postMessage({type: 'OPEN_PROFILE'}, '*')">
                    <i class="fa-solid fa-user-astronaut"></i>
                    <span id="username">Pilot</span>
                </div>
                <div class="main-callsign skeleton" id="callsign">WAITING</div>
            </div>
            
            <div class="flight-state-badge" id="state-badge">
                <i class="fa-solid fa-circle-notch state-icon" id="state-icon"></i>
                <span class="state-text" id="status-text">Standby</span>
            </div>
        </header>

        <div class="scroll-viewport">
            
            <div class="hero-card skeleton" id="hero-container">
                <img id="ac-photo" class="hero-img" src="" style="display:none;" onload="this.style.display='block'; this.parentElement.classList.remove('skeleton');">
                <div id="ac-credit" class="photo-credit" style="display: none;"></div>
                
                <div class="hero-overlay">
                    <div class="ac-info">
                        <h2 id="ac-name">---</h2>
                        <span id="ac-livery">---</span>
                    </div>
                    <div class="ac-reg-badge" id="ac-reg">---</div>
                </div>
            </div>

            <div>
                <div class="grid-section-label">Flight Progress</div>
                <div class="route-card" id="route-card-container">
                    <div class="route-visual-header" id="route-toggle-btn">
                        <i class="fa-solid fa-chevron-down route-toggle-icon"></i> <div class="route-airport">
                            <div class="route-airport-row">
                                <img id="dep-flag" class="country-flag" src="" alt="Origin Flag">
                                <span class="route-icao" id="dep-icao">---</span>
                            </div>
                            <span class="route-time" id="dep-time">--:--</span>
                        </div>
                        
                        <div class="route-graphic">
                            <div class="track-line"></div>
                            <div class="track-progress" id="route-progress"></div>
                            <i class="fa-solid fa-plane track-plane" id="route-plane"></i>
                        </div>

                        <div class="route-airport">
                            <div class="route-airport-row">
                                <span class="route-icao" id="arr-icao">---</span>
                                <img id="arr-flag" class="country-flag" src="" alt="Dest Flag">
                            </div>
                            <span class="route-time" id="arr-time">--:--</span>
                        </div>
                    </div>
                    
                    <div class="waypoint-dropdown-wrapper">
                        <div class="waypoint-list" id="wp-list">
                            <div style="padding: 20px; text-align: center; color: var(--text-secondary); font-size: 12px;">
                                No Active Route
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="grid-section-label">Currently Over</div>
                <div class="location-card">
                    <div class="loc-icon-box">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </div>
                    <div class="loc-content">
                        <span class="loc-main" id="loc-main">Unknown Region</span>
                        <span class="loc-sub" id="loc-sub">Waiting for GPS data...</span>
                    </div>
                </div>
            </div>

            <div>
                <div class="grid-section-label">Telemetry</div>
                <div class="telemetry-bento">
                    
                    <div class="bento-cell">
                        <div class="cell-header">
                            <span class="cell-label">Altitude</span>
                            <i class="fa-solid fa-layer-group cell-icon"></i>
                        </div>
                        <div class="cell-data">
                            <span id="val-alt">---</span>
                            <span class="cell-unit">ft</span>
                        </div>
                    </div>

                    <div class="bento-cell">
                        <div class="cell-header">
                            <span class="cell-label">GND Speed</span>
                            <i class="fa-solid fa-gauge-high cell-icon"></i>
                        </div>
                        <div class="cell-data">
                            <span id="val-spd">---</span>
                            <span class="cell-unit">kts</span>
                        </div>
                    </div>

                    <div class="bento-cell">
                        <div class="cell-header">
                            <span class="cell-label">Vertical</span>
                            <i class="fa-solid fa-arrows-up-down cell-icon"></i>
                        </div>
                        <div class="cell-data cell-vs-graphic">
                            <i id="val-vs-arrow" class="fa-solid fa-minus vs-arrow"></i>
                            <span id="val-vs">0</span>
                            <span class="cell-unit">fpm</span>
                        </div>
                    </div>

                    <div class="bento-cell">
                        <div class="cell-header">
                            <span class="cell-label">Heading</span>
                            <i class="fa-solid fa-compass cell-icon"></i>
                        </div>
                        <div class="cell-data">
                            <span id="val-hdg">---</span>
                            <span class="cell-unit">°</span>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <footer class="footer-bar">
            <div class="footer-stat">
                <div class="f-label">Elapsed</div>
                <div class="f-value" id="val-ete">--:--</div>
            </div>
            <div class="footer-stat">
                <div class="f-label">Estimate</div>
                <div class="f-value" id="val-eta">--:--</div>
            </div>
            <div class="footer-stat">
                <div class="f-label">Remaining</div>
                <div class="f-value" id="val-rem">--:--</div>
            </div>
        </footer>

    </div>

    <script>
        // --- UI LOGIC ---
        const scrollViewport = document.querySelector('.scroll-viewport');
        const mainWindow = document.querySelector('.avionics-window');

        // Scroll Shadow Effect
        scrollViewport.addEventListener('scroll', () => {
            if (scrollViewport.scrollTop > 10) {
                mainWindow.classList.add('scrolled');
            } else {
                mainWindow.classList.remove('scrolled');
            }
        });

        // Dropdown Logic
        const routeToggleBtn = document.getElementById('route-toggle-btn');
        const routeCardContainer = document.getElementById('route-card-container');
        
        routeToggleBtn.addEventListener('click', () => {
            routeCardContainer.classList.toggle('expanded');
        });

        // --- DATA BINDING ---
        window.updateFlightInterface = function(data) {
            if (!data) return;

            // 1. Identity & State
            updateText('username', data.username || 'Pilot');
            updateText('callsign', data.callsign || 'N/A');
            document.getElementById('callsign').classList.remove('skeleton');

            // --- UPDATED STATE LOGIC (Pill Badge) ---
            const phase = data.phase ? data.phase.toUpperCase() : 'STANDBY';
            updateText('status-text', phase);
            
            const badge = document.getElementById('state-badge');
            const icon = document.getElementById('state-icon');
            
            // Reset base classes
            badge.className = 'flight-state-badge'; 
            icon.className = 'fa-solid'; 

            // Apply dynamic classes
            if (phase.includes('CLIMB') || phase.includes('TAKEOFF')) {
                badge.classList.add('state-climb');
                icon.classList.add('fa-arrow-trend-up');
            } else if (phase.includes('DESCENT') || phase.includes('APPROACH')) {
                badge.classList.add('state-descend');
                icon.classList.add('fa-arrow-trend-down');
            } else if (phase.includes('CRUISE')) {
                badge.classList.add('state-cruise');
                icon.classList.add('fa-plane');
            } else {
                badge.classList.add('state-ground'); // Ground/Standby
                icon.classList.add('fa-parking');
            }

            // 2. Aircraft
            if (data.aircraft) {
                updateText('ac-name', data.aircraft.aircraftName || 'Unknown Aircraft');
                updateText('ac-livery', data.aircraft.liveryName || 'Unknown Livery');
                updateText('ac-reg', data.aircraft.registration || '---');
            }
            if (data.images) {
                if (data.images.url) {
                    const img = document.getElementById('ac-photo');
                    if (img.src !== data.images.url) {
                        img.src = data.images.url;
                    }
                }
                
                // Photo Credit
                const creditEl = document.getElementById('ac-credit');
                if (creditEl) {
                    if (data.images.credit) {
                        creditEl.textContent = '© ' + data.images.credit;
                        creditEl.style.display = 'block';
                    } else {
                        creditEl.style.display = 'none';
                    }
                }
            }

            // NEW 2.5: LOCATION
            if (data.location) {
                updateText('loc-main', data.location.main || 'Unknown Region');
                updateText('loc-sub', data.location.sub || 'GPS tracking active');
            }

            // 3. Telemetry
            if (data.telemetry) {
                // Altitude
                updateText('val-alt', formatNumber(data.telemetry.altitude));
                
                // Speed
                updateText('val-spd', Math.round(data.telemetry.groundSpeed || 0));
                
                // Vertical Speed Logic
                const vs = Math.round(data.telemetry.verticalSpeed || 0);
                updateText('val-vs', Math.abs(vs));
                const vsArrow = document.getElementById('val-vs-arrow');
                vsArrow.className = 'fa-solid fa-arrow-right vs-arrow'; // Reset base
                if (vs > 50) vsArrow.classList.add('climbing');
                else if (vs < -50) vsArrow.classList.add('descending');
                else vsArrow.className = 'fa-solid fa-minus vs-arrow'; // Level

                // Heading
                const hdg = Math.round(data.telemetry.heading || 0);
                updateText('val-hdg', String(hdg).padStart(3, '0'));
            }

            // 4. Route
            if (data.route) {
                updateText('dep-icao', data.route.originIcao || '---');
                updateText('dep-time', data.route.originTime || '--:--');
                updateText('arr-icao', data.route.destIcao || '---');
                updateText('arr-time', data.route.destTime || '--:--');

                // --- NEW: Update Flags ---
                updateFlag('dep-flag', data.route.originCountry);
                updateFlag('arr-flag', data.route.destCountry);

                // Progress
                const pct = Math.min(100, Math.max(0, data.route.progress || 0));
                document.getElementById('route-progress').style.width = `${pct}%`;
                document.getElementById('route-plane').style.left = `${pct}%`;

                // Footer
                updateText('val-ete', data.route.elapsed || '--:--');
                updateText('val-eta', data.route.eta || '--:--');
                updateText('val-rem', data.route.ete || '--:--');
            }

            // 5. Waypoints (UPDATED LOGIC for Groups)
            if (data.waypoints && Array.isArray(data.waypoints)) {
                renderWaypoints(data.waypoints);
            }
        };

        function renderWaypoints(waypoints) {
            const container = document.getElementById('wp-list');
            if (!waypoints.length) return;

            let html = '';
            let lastGroup = null;

            waypoints.forEach((wp, index) => {
                // --- INSERT HEADER IF GROUP CHANGES ---
                if (wp.group && wp.group !== lastGroup) {
                    html += `<div class="wp-group-header">${wp.group}</div>`;
                    lastGroup = wp.group;
                }

                // Render normal row
                const isPassed = wp.passed ? 'passed' : '';
                const isActive = wp.active ? 'active' : '';
                
                // Only show time/distance if not passed (optional clean up)
                const displayInfo = isPassed ? 'PASSED' : (wp.time || '--:--');

                html += `
                <div class="wp-row ${isPassed} ${isActive}">
                    <div class="wp-line-connect"></div>
                    <div class="wp-status"></div>
                    <div class="wp-data">
                        <span class="wp-ident">${wp.ident}</span>
                        <span class="wp-name">${wp.name || ''}</span>
                    </div>
                    <span class="wp-ete">${displayInfo}</span>
                </div>`;
            });
            container.innerHTML = html;
            
            // Scroll to active waypoint if present (first load only to be nice)
            if (container.dataset.scrolled !== 'true') {
                const activeEl = container.querySelector('.active');
                if (activeEl) {
                    setTimeout(() => {
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        container.dataset.scrolled = 'true';
                    }, 500);
                }
            }
        }

        // Helper
        function updateText(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }
        function formatNumber(num) {
            return num ? Math.round(num).toLocaleString() : '---';
        }

        // --- NEW: Helper for Flags ---
        function updateFlag(id, countryCode) {
            const el = document.getElementById(id);
            if (!el) return;
            if (countryCode) {
                // Convert country code to lowercase for flagcdn
                el.src = `https://flagcdn.com/w40/${countryCode.toLowerCase()}.png`;
                el.style.display = 'block';
            } else {
                el.style.display = 'none';
            }
        }

        // Listener
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'FLIGHT_DATA_UPDATE') {
                window.updateFlightInterface(event.data.payload);
            }
        });
    </script>
</body>
</html>
