<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InFlight | Aviation Gallery</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        background: '#020617', 
                        surface: '#0f172a',
                        surfaceLight: '#1e293b',
                        primary: '#6366f1',
                        accent: '#38bdf8',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav-blur {
            background: rgba(2, 6, 23, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .text-gradient {
            background: linear-gradient(to bottom, #fff 30%, rgba(255, 255, 255, 0.4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Cinematic Cards */
        .glow-card {
            position: relative;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .glow-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(99, 102, 241, 0.4) 0%, transparent 60%);
            border-radius: inherit;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .glow-card:hover::before { opacity: 1; }
        .glow-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8);
        }

        /* Upgraded Image & Overlay Handling */
        .glow-card img.main-img {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }
        .glow-card:hover img.main-img {
            transform: scale(1.08);
        }
        
        .card-gradient-overlay {
            background: linear-gradient(to top, rgba(2,6,23,0.95) 0%, rgba(2,6,23,0.5) 40%, transparent 100%);
            opacity: 0.85;
            transition: opacity 0.5s ease;
        }
        .glow-card:hover .card-gradient-overlay {
            opacity: 1;
        }

        /* Stacked Card Effect for Groups */
        .stack-effect::after {
            content: '';
            position: absolute;
            top: 6px; left: 12px; right: 12px; bottom: -6px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            z-index: -1;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .stack-effect::before {
            content: '';
            position: absolute;
            top: 12px; left: 24px; right: 24px; bottom: -12px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 1.5rem;
            z-index: -2;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glow-card:hover.stack-effect::after { transform: translateY(6px) scale(0.97); }
        .glow-card:hover.stack-effect::before { transform: translateY(12px) scale(0.94); }

        /* Premium Folder Expansion */
        .folder-expansion {
            grid-column: 1 / -1;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 2rem;
            padding: 2.5rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
            box-shadow: inset 0 2px 20px rgba(255,255,255,0.02), 0 30px 60px -10px rgba(0,0,0,0.8);
            position: relative;
            transform-origin: top;
            animation: expandIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        .folder-expansion::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.8), transparent);
        }

        @keyframes expandIn {
            from { opacity: 0; transform: scaleY(0.95); height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: 0; border-width: 0; }
            to { opacity: 1; transform: scaleY(1); height: auto; }
        }

        .folder-expansion.closing {
            animation: collapseOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes collapseOut {
            from { opacity: 1; transform: scaleY(1); height: auto; }
            to { opacity: 0; transform: scaleY(0.95); height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: 0; border-width: 0; }
        }

        .variant-card {
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .variant-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.8);
        }

        /* Custom Scrollbar */
        .horizontal-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .horizontal-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            margin: 0 2rem;
        }
        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 10px;
        }
        .horizontal-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }

        /* Segmented Control */
        .segmented-control {
            position: relative;
            display: inline-flex;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            padding: 6px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .segment-btn {
            position: relative;
            z-index: 10;
            padding: 0.75rem 2.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #94a3b8;
            transition: color 0.4s ease;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .segment-btn.active { color: #ffffff; }
        #tab-indicator {
            position: absolute;
            top: 6px; bottom: 6px; width: calc(50% - 6px);
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 9999px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .grid-container { transition: opacity 0.3s ease; }
        .grid-container.loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="antialiased selection:bg-primary/30">

    <nav class="fixed top-0 w-full z-50 nav-blur">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="home.html" class="flex items-center gap-3 group">
                <img src="Images/inflight.png" alt="InFlight Logo" class="size-10 rounded-full object-cover transition-all duration-300 group-hover:scale-110 ring-2 ring-primary/20 shadow-lg shadow-primary/10" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=In+Flight&background=6366f1&color=fff';">
                <span class="text-xl font-bold tracking-tight text-white">InFlight</span>
            </a>
            <div class="hidden md:flex items-center gap-10">
                <a href="home.html#features" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Capabilities</a>
                <a href="gallery.html" class="text-sm font-medium text-white transition-colors">Gallery</a>
                <a href="https://discord.gg/cNSkZtdJ" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Discord</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex flex-col pt-32 pb-20 max-w-[1600px] mx-auto px-6 w-full">
        
        <header class="text-center mb-12 max-w-4xl mx-auto space-y-8">
            <h1 class="text-4xl md:text-6xl font-black tracking-tighter text-gradient leading-tight">
                Aviation Gallery
            </h1>
            
            <div class="flex justify-center">
                <div class="segmented-control">
                    <div id="tab-indicator"></div>
                    <button class="segment-btn active" id="btn-aircraft" onclick="setTab('aircraft')">
                        <i data-lucide="plane" class="size-4"></i> Directory
                    </button>
                    <button class="segment-btn" id="btn-airports" onclick="setTab('airports')">
                        <i data-lucide="building-2" class="size-4"></i> Terminals
                    </button>
                </div>
            </div>
        </header>

        <div class="mb-10 bg-surface/40 border border-white/5 rounded-3xl p-6 backdrop-blur-md shadow-2xl flex flex-col lg:flex-row gap-8 justify-between items-center z-20 relative">
            
            <div class="flex-1 w-full">
                <h3 class="text-xs font-mono text-slate-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <i data-lucide="award" class="size-3.5 text-accent"></i> Top Contributors
                </h3>
                <div id="contributors-container" class="flex flex-wrap gap-4 items-center">
                    <div class="animate-pulse h-10 w-32 bg-white/5 rounded-full"></div>
                </div>
            </div>

            <div class="hidden lg:block w-px h-16 bg-white/10"></div>

            <div class="w-full lg:w-auto flex flex-col sm:flex-row gap-4 items-center shrink-0">
                <div class="relative w-full sm:w-64">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search" class="size-4 text-slate-400"></i>
                    </div>
                    <input type="text" id="search-input" placeholder="Filter by type or livery..." 
                        class="w-full bg-black/50 border border-white/10 rounded-full py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all">
                </div>
                <div class="text-right w-full sm:w-auto">
                    <div class="text-2xl font-bold text-white" id="stat-total">--</div>
                    <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest" id="stat-label">Total Assets</div>
                </div>
            </div>
        </div>

        <div id="gallery-grid" class="grid-container grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-8 md:gap-10">
            </div>

    </main>

    <footer class="py-10 border-t border-white/5 bg-background text-center mt-auto">
        <div class="text-[10px] font-mono text-slate-700 tracking-widest uppercase">
            <span>© 2026 InFlight Tracker</span>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        const API_BASE_URL = 'https://site--indgo-backend--6dmjph8ltlhv.code.run'; 
        
        // State Management
        let currentMode = 'aircraft';
        let rawAircraftData = [];
        let rawAirportData = [];
        let groupedAircraft = {};

        // DOM Elements
        const galleryGrid = document.getElementById('gallery-grid');
        const searchInput = document.getElementById('search-input');
        const tabIndicator = document.getElementById('tab-indicator');
        const btnAircraft = document.getElementById('btn-aircraft');
        const btnAirports = document.getElementById('btn-airports');

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });

        // Mouse glow effect delegation
        galleryGrid.addEventListener('mousemove', e => {
            const card = e.target.closest('.glow-card');
            if (!card) return;
            const rect = card.getBoundingClientRect();
            card.style.setProperty('--x', `${e.clientX - rect.left}px`);
            card.style.setProperty('--y', `${e.clientY - rect.top}px`);
        });

        // Search Filter Engine
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            if (currentMode === 'aircraft') {
                renderAircraftGroups(term);
            } else {
                renderAirports(term);
            }
        });

        function setTab(type) {
            currentMode = type;
            searchInput.value = ''; // clear search on switch
            
            if (type === 'aircraft') {
                tabIndicator.style.transform = 'translateX(0)';
                btnAircraft.classList.add('active');
                btnAirports.classList.remove('active');
                document.getElementById('stat-label').innerText = 'Aircraft Fleets';
                renderAircraftGroups();
                updateLeaderboard(rawAircraftData);
            } else {
                tabIndicator.style.transform = 'translateX(100%)';
                btnAirports.classList.add('active');
                btnAircraft.classList.remove('active');
                document.getElementById('stat-label').innerText = 'Terminals';
                renderAirports();
                updateLeaderboard(rawAirportData);
            }
        }

        async function loadData() {
            galleryGrid.classList.add('loading');
            galleryGrid.innerHTML = Array(6).fill(0).map(() => `
                <div class="animate-pulse bg-surfaceLight rounded-3xl aspect-[16/10] border border-white/5"></div>
            `).join('');

            try {
                const [acRes, apRes] = await Promise.all([
                    fetch(`${API_BASE_URL}/api/aircraft`),
                    fetch(`${API_BASE_URL}/api/airports`)
                ]);

                const acData = await acRes.json();
                const apData = await apRes.json();

                // Filter out entries without images
                rawAircraftData = acData.filter(item => item.imageUrl && item.imageUrl !== null);
                rawAirportData = apData.filter(item => item.imageUrl && item.imageUrl !== null);

                // Build Fleet Groups
                groupedAircraft = {};
                rawAircraftData.forEach(ac => {
                    const type = ac.aircraftType || 'Unknown Type';
                    if (!groupedAircraft[type]) groupedAircraft[type] = [];
                    groupedAircraft[type].push(ac);
                });

                // Initial Render
                setTab('aircraft');

            } catch (error) {
                console.error("API Error:", error);
                galleryGrid.innerHTML = `
                    <div class="col-span-full py-20 text-center text-red-400 border border-red-500/10 bg-red-500/5 rounded-3xl">
                        <i data-lucide="server-crash" class="size-10 mx-auto mb-4 opacity-80"></i>
                        <p class="font-mono text-sm tracking-widest uppercase">Telemetry Sync Failed</p>
                    </div>
                `;
                lucide.createIcons();
            } finally {
                galleryGrid.classList.remove('loading');
            }
        }

        function updateLeaderboard(dataset) {
            const container = document.getElementById('contributors-container');
            if (!dataset || dataset.length === 0) {
                container.innerHTML = `<span class="text-sm text-slate-500">No data available</span>`;
                return;
            }

            const counts = {};
            dataset.forEach(item => {
                const name = item.contributorName || 'Anonymous';
                counts[name] = (counts[name] || 0) + 1;
            });

            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 4);

            container.innerHTML = sorted.map(([name, count], index) => {
                const badgeColor = index === 0 ? 'ring-yellow-500/50 text-yellow-500' : 'ring-white/10 text-slate-300';
                const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1e293b&color=fff`;
                
                return `
                <div class="flex items-center gap-3 bg-black/40 pr-4 pl-1.5 py-1.5 rounded-full border border-white/5 transition-all hover:bg-black/60">
                    <img src="${avatarUrl}" class="size-8 rounded-full ring-2 ${badgeColor}" alt="${name}">
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-white leading-none">${name}</span>
                        <span class="text-[10px] text-slate-400 font-mono mt-0.5">${count} Uploads</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Render the main grid of grouped Aircraft
        function renderAircraftGroups(searchTerm = '') {
            let groupsToRender = Object.keys(groupedAircraft);
            
            if (searchTerm) {
                groupsToRender = groupsToRender.filter(type => {
                    const typeMatch = type.toLowerCase().includes(searchTerm);
                    const liveryMatch = groupedAircraft[type].some(ac => 
                        (ac.liveryName || '').toLowerCase().includes(searchTerm)
                    );
                    return typeMatch || liveryMatch;
                });
            }

            document.getElementById('stat-total').innerText = groupsToRender.length;

            if (groupsToRender.length === 0) {
                galleryGrid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-500">No fleets match your filters.</div>`;
                return;
            }

            const cardsHtml = groupsToRender.map(type => {
                const fleet = groupedAircraft[type];
                let coverAc = fleet.find(ac => ac.liveryName && (ac.liveryName.toLowerCase().includes('generic') || ac.liveryName.toLowerCase().includes('default')));
                if (!coverAc) coverAc = fleet[0];
                
                const safeId = type.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();

                return `
                <div id="card-${safeId}" onclick="toggleFolder('${type}', this)" class="glow-card stack-effect group rounded-[2rem] aspect-[16/10] cursor-pointer bg-surface overflow-hidden relative z-10">
                    <img src="${coverAc.imageUrl}" class="absolute inset-0 w-full h-full object-cover opacity-10 blur-2xl scale-125 z-0 pointer-events-none" alt="">
                    
                    <div class="absolute inset-0 z-10 p-4 sm:p-8 flex items-center justify-center">
                        <img src="${coverAc.imageUrl}" alt="${type}" loading="lazy" 
                            class="main-img w-full h-full object-contain drop-shadow-[0_20px_40px_rgba(0,0,0,0.9)]">
                    </div>
                    
                    <div class="card-gradient-overlay absolute inset-0 z-20 pointer-events-none"></div>
                    
                    <div class="absolute bottom-0 left-0 right-0 z-30 p-6 sm:p-8 flex justify-between items-end transform translate-y-2 group-hover:translate-y-0 transition-transform duration-500">
                        <div class="flex flex-col gap-2">
                            <h3 class="text-3xl font-black text-white tracking-tight leading-none drop-shadow-lg">${type}</h3>
                            <span class="text-sm text-slate-300 font-medium flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-100">
                                <i data-lucide="image" class="size-3.5 text-accent"></i> ${coverAc.liveryName}
                            </span>
                        </div>
                        
                        <div class="flex flex-col items-end gap-2">
                            <div class="flex items-center gap-2 bg-white/10 backdrop-blur-md text-white px-4 py-2 rounded-full border border-white/20 shadow-lg group-hover:bg-primary group-hover:border-primary transition-all duration-300">
                                <i data-lucide="layers" class="size-4"></i>
                                <span class="text-xs font-bold uppercase tracking-widest">${fleet.length} Variants</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            galleryGrid.innerHTML = cardsHtml;
            lucide.createIcons();
        }

        // Render Airports
        function renderAirports(searchTerm = '') {
            let dataToRender = rawAirportData;
            
            if (searchTerm) {
                dataToRender = dataToRender.filter(ap => 
                    (ap.icao || '').toLowerCase().includes(searchTerm)
                );
            }

            document.getElementById('stat-total').innerText = dataToRender.length;

            if (dataToRender.length === 0) {
                galleryGrid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-500">No terminals match your filters.</div>`;
                return;
            }

            const cardsHtml = dataToRender.map(ap => {
                const dateObj = new Date(ap.lastUpdated);
                const formattedDate = dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                
                return `
                <div class="glow-card group rounded-[2rem] aspect-[16/10] cursor-pointer bg-surface overflow-hidden relative z-10">
                    <img src="${ap.imageUrl}" class="absolute inset-0 w-full h-full object-cover opacity-10 blur-2xl scale-125 z-0 pointer-events-none" alt="">
                    
                    <div class="absolute inset-0 z-10 p-4 sm:p-8 flex items-center justify-center">
                        <img src="${ap.imageUrl}" alt="${ap.icao}" loading="lazy" 
                            class="main-img w-full h-full object-contain drop-shadow-[0_20px_40px_rgba(0,0,0,0.9)]">
                    </div>
                    
                    <div class="card-gradient-overlay absolute inset-0 z-20 pointer-events-none"></div>
                    
                    <div class="absolute bottom-0 left-0 right-0 z-30 p-6 sm:p-8 flex justify-between items-end transform translate-y-2 group-hover:translate-y-0 transition-transform duration-500">
                        <div class="flex flex-col gap-2">
                            <h3 class="text-4xl font-black text-white tracking-widest leading-none drop-shadow-lg">${ap.icao}</h3>
                            <div class="flex items-center gap-2 text-sm text-slate-300 font-mono opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-100">
                                <i data-lucide="clock" class="size-3.5 text-accent"></i>
                                <span>Updated: ${formattedDate}</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            galleryGrid.innerHTML = cardsHtml;
            lucide.createIcons();
        }

        // Inline Folder Expansion Logic
        function toggleFolder(aircraftType, cardElement) {
            const safeId = aircraftType.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
            const folderId = `folder-${safeId}`;
            const existingFolder = document.getElementById(folderId);

            // Close any currently open folders smoothly
            document.querySelectorAll('.folder-expansion').forEach(el => {
                if (el.id !== folderId) {
                    el.classList.add('closing');
                    setTimeout(() => el.remove(), 400);
                }
            });

            // Handle dimming/highlighting main cards
            document.querySelectorAll('.glow-card').forEach(el => {
                if (el !== cardElement) {
                    el.classList.remove('ring-2', 'ring-primary', 'ring-offset-4', 'ring-offset-background');
                    el.style.opacity = existingFolder ? '1' : '0.4';
                    el.style.filter = existingFolder ? 'none' : 'grayscale(30%)';
                }
            });

            if (existingFolder) {
                // If clicking the active folder, just close it and restore standard view
                existingFolder.classList.add('closing');
                setTimeout(() => existingFolder.remove(), 400);
                cardElement.classList.remove('ring-2', 'ring-primary', 'ring-offset-4', 'ring-offset-background');
                document.querySelectorAll('.glow-card').forEach(el => {
                    el.style.opacity = '1';
                    el.style.filter = 'none';
                });
                return;
            }

            // Highlight the clicked card
            cardElement.style.opacity = '1';
            cardElement.style.filter = 'none';
            cardElement.classList.add('ring-2', 'ring-primary', 'ring-offset-4', 'ring-offset-background');
            
            const fleet = groupedAircraft[aircraftType];
            
            // Build the massive, high-quality showcase cards for the variants
            const folderHtml = `
                <div id="${folderId}" class="folder-expansion">
                    <div class="flex justify-between items-end mb-8 px-2">
                        <div>
                            <div class="flex items-center gap-3 mb-2">
                                <h4 class="text-3xl font-black text-white tracking-tight">${aircraftType}</h4>
                                <span class="bg-primary/20 text-primary border border-primary/30 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest">Directory</span>
                            </div>
                            <p class="text-sm text-slate-400 font-mono">Viewing ${fleet.length} active high-res configurations</p>
                        </div>
                        <button onclick="toggleFolder('${aircraftType}', document.getElementById('card-${safeId}'))" class="p-3 rounded-full bg-white/5 hover:bg-white/10 hover:text-red-400 text-white transition-all border border-white/10 hover:border-red-400/30">
                            <i data-lucide="x" class="size-5"></i>
                        </button>
                    </div>
                    
                    <div class="flex gap-8 overflow-x-auto horizontal-scroll pb-6 pt-2 px-2 snap-x snap-mandatory">
                        ${fleet.map(ac => `
                            <div class="variant-card shrink-0 w-[85vw] sm:w-[600px] aspect-[16/10] snap-center group">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/20 to-transparent z-10 pointer-events-none"></div>
                                <img src="${ac.imageUrl}" class="absolute inset-0 w-full h-full object-cover opacity-10 blur-xl z-0 pointer-events-none" alt="">
                                
                                <div class="absolute inset-0 z-10 p-6 flex items-center justify-center">
                                    <img src="${ac.imageUrl}" alt="${ac.liveryName}" class="w-full h-full object-contain drop-shadow-[0_25px_35px_rgba(0,0,0,0.9)] transition-transform duration-700 ease-out group-hover:scale-105 group-hover:-translate-y-2">
                                </div>

                                <div class="absolute bottom-0 left-0 w-full p-8 z-20 flex justify-between items-end">
                                    <div class="flex flex-col gap-2">
                                        <h5 class="text-4xl font-black text-white leading-none drop-shadow-xl">${ac.tailNumber || 'No Tail Data'}</h5>
                                        <div class="flex items-center gap-2 text-accent bg-black/50 w-fit px-3 py-1.5 rounded-lg backdrop-blur-md border border-white/10">
                                            <i data-lucide="paint-bucket" class="size-4"></i>
                                            <span class="text-sm font-bold tracking-wide">${ac.liveryName}</span>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-end gap-1.5">
                                        <span class="text-[10px] text-slate-400 font-mono uppercase tracking-widest">Spotted By</span>
                                        <div class="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full border border-white/10 backdrop-blur-md">
                                            <i data-lucide="camera" class="size-3.5 text-white"></i>
                                            <span class="text-sm font-bold text-white">@${ac.contributorName || 'System'}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // Insert directly after the clicked card
            cardElement.insertAdjacentHTML('afterend', folderHtml);
            lucide.createIcons();
            
            // Smooth scroll so the newly opened folder is nicely centered in the user's view
            setTimeout(() => {
                const newFolder = document.getElementById(folderId);
                const offset = 100; // Account for the sticky navbar
                const bodyRect = document.body.getBoundingClientRect().top;
                const elementRect = newFolder.getBoundingClientRect().top;
                const elementPosition = elementRect - bodyRect;
                const offsetPosition = elementPosition - offset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }, 50);
        }
    </script>
</body>
</html>
