<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InFlight | Aviation Gallery</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        background: '#020617', 
                        surface: '#0f172a',
                        primary: '#6366f1',
                        accent: '#38bdf8',
                        border: 'rgba(255, 255, 255, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Premium Nav Blur */
        .nav-blur {
            background: rgba(2, 6, 23, 0.75);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Cinematic Glow Cards */
        .glow-card {
            position: relative;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            border-radius: 1.5rem;
        }

        .glow-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(99, 102, 241, 0.3) 0%, transparent 60%);
            border-radius: inherit;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .glow-card:hover::before {
            opacity: 1;
        }

        .glow-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-6px);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8);
        }

        /* Stacked Card Effect for Groups */
        .stack-effect::after {
            content: '';
            position: absolute;
            top: -8px; left: 4%; right: 4%; height: 100%;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            z-index: -1;
            transition: all 0.4s ease;
        }
        .stack-effect::before {
            content: '';
            position: absolute;
            top: -16px; left: 8%; right: 8%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 1.5rem;
            z-index: -2;
            transition: all 0.4s ease;
        }
        .glow-card:hover.stack-effect::after { top: -12px; }
        .glow-card:hover.stack-effect::before { top: -24px; }

        /* Segmented Control Switch */
        .segmented-control {
            position: relative;
            display: inline-flex;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            padding: 6px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .segment-btn {
            position: relative;
            z-index: 10;
            padding: 0.75rem 2.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: color 0.4s ease;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            outline: none;
        }

        .segment-btn.active { color: #ffffff; }

        #tab-indicator {
            position: absolute;
            top: 6px; bottom: 6px;
            width: calc(50% - 6px);
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 9999px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        /* Search Input */
        .search-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        /* Skeleton Animation */
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .skeleton-loader {
            position: relative;
            overflow: hidden;
            background-color: rgba(30, 41, 59, 0.3);
            border-radius: 1.5rem;
        }
        .skeleton-loader::after {
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg, transparent 0, rgba(255, 255, 255, 0.02) 20%, rgba(255, 255, 255, 0.05) 60%, transparent);
            animation: shimmer 2s infinite;
            content: '';
        }

        /* Hide Scrollbar for horizontal scrolling elements */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Grid transitions */
        #gallery-grid { transition: opacity 0.3s ease; }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="antialiased selection:bg-primary/30">

    <nav class="fixed top-0 w-full z-50 nav-blur">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="home.html" class="flex items-center gap-3 group">
                <img src="Images/inflight.png" alt="InFlight Logo" class="size-10 rounded-full object-cover transition-all duration-300 group-hover:scale-110 ring-2 ring-primary/20 shadow-lg shadow-primary/10" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=In+Flight&background=6366f1&color=fff';">
                <span class="text-xl font-bold tracking-tight text-white">InFlight</span>
            </a>

            <div class="hidden md:flex items-center gap-10">
                <a href="home.html#features" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Capabilities</a>
                <a href="gallery.html" class="text-sm font-medium text-white transition-colors">Gallery</a>
                <a href="https://discord.gg/cNSkZtdJ" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Discord</a>
                <a href="index.html" class="relative p-[1px] rounded-full bg-gradient-to-b from-white/20 to-transparent inline-block">
                    <div class="bg-black text-white px-6 py-2.5 rounded-full flex items-center gap-2 font-semibold transition-colors hover:bg-slate-900">
                        Launch Tracker <i data-lucide="arrow-right" class="size-4"></i>
                    </div>
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex flex-col pt-32 pb-20">
        
        <header class="px-6 mb-12 max-w-5xl mx-auto w-full flex flex-col items-center space-y-8">
            
            <div class="text-center space-y-4">
                <h1 class="text-4xl md:text-6xl font-black tracking-tighter text-gradient leading-tight">
                    Aviation Database
                </h1>
                <p class="text-lg text-slate-400 max-w-2xl mx-auto">
                    Explore the community's high-fidelity aircraft telemetry and terminal captures.
                </p>
            </div>

            <div id="contributors-container" class="w-full max-w-3xl opacity-0 transition-opacity duration-1000 hidden md:block">
                <div class="flex items-center gap-4 bg-white/5 border border-white/10 rounded-2xl p-2 pl-4 backdrop-blur-md">
                    <div class="flex items-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-widest shrink-0 border-r border-white/10 pr-4">
                        <i data-lucide="trophy" class="size-4 text-yellow-500"></i> Lead Spotters
                    </div>
                    <div id="contributors-list" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                        </div>
                </div>
            </div>
            
            <div class="w-full flex flex-col md:flex-row items-center justify-between gap-6 pt-6">
                <div class="segmented-control shrink-0">
                    <div id="tab-indicator"></div>
                    <button class="segment-btn active" id="btn-aircraft" onclick="appState.switchTab('aircraft')">
                        <i data-lucide="plane" class="size-4"></i> Aircraft Models
                    </button>
                    <button class="segment-btn" id="btn-airports" onclick="appState.switchTab('airports')">
                        <i data-lucide="building-2" class="size-4"></i> Terminals
                    </button>
                </div>

                <div class="relative w-full max-w-md">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 size-4 text-slate-400"></i>
                    <input type="text" id="search-bar" placeholder="Filter by type, livery, or tail number..." 
                        class="search-input w-full pl-11 pr-4 py-3 rounded-full text-sm backdrop-blur-md"
                        oninput="appState.handleSearch(this.value)">
                </div>
            </div>
        </header>

        <div class="max-w-[1600px] mx-auto px-6 w-full flex-1">
            
            <div id="drilldown-nav" class="mb-6 hidden items-center gap-4">
                <button onclick="appState.closeDrilldown()" class="flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white transition-colors bg-white/5 px-4 py-2 rounded-full border border-white/10 hover:bg-white/10">
                    <i data-lucide="arrow-left" class="size-4"></i> Back to Fleet Directory
                </button>
                <div class="h-4 w-[1px] bg-white/10"></div>
                <h2 id="drilldown-title" class="text-xl font-bold text-white tracking-tight">Viewing All</h2>
            </div>

            <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                </div>
        </div>
    </main>

    <footer class="py-10 border-t border-white/5 bg-background text-center mt-auto">
        <div class="text-[10px] font-mono text-slate-700 tracking-widest uppercase">
            <span>© 2026 InFlight Tracker Data Systems</span>
        </div>
    </footer>

    <script>
        // API Configuration
        const API_BASE_URL = 'https://site--indgo-backend--6dmjph8ltlhv.code.run'; 

        // Application State Management
        const appState = {
            activeTab: 'aircraft',
            activeGroup: null, // null means showing groups, string means showing details for a specific aircraft type
            searchQuery: '',
            rawAircraft: [],
            rawAirports: [],
            
            async init() {
                lucide.createIcons();
                this.renderSkeletons();
                await this.fetchData();
                this.processContributors();
                this.render();
                this.setupMouseTracking();
            },

            async fetchData() {
                try {
                    const [acRes, apRes] = await Promise.all([
                        fetch(`${API_BASE_URL}/api/aircraft`).catch(() => ({ ok: false })),
                        fetch(`${API_BASE_URL}/api/airports`).catch(() => ({ ok: false }))
                    ]);

                    if (acRes.ok) {
                        const raw = await acRes.json();
                        this.rawAircraft = raw.filter(item => item.imageUrl && item.imageUrl !== null);
                    }
                    if (apRes.ok) {
                        this.rawAirports = await apRes.json();
                    }
                } catch (e) {
                    console.error("Data fetch error", e);
                }
            },

            processContributors() {
                const counts = {};
                this.rawAircraft.forEach(ac => {
                    const name = ac.contributorName || 'System';
                    counts[name] = (counts[name] || 0) + 1;
                });
                
                const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
                
                const container = document.getElementById('contributors-container');
                const list = document.getElementById('contributors-list');
                
                if (sorted.length > 0) {
                    list.innerHTML = sorted.map((c, i) => {
                        const medals = ['🥇', '🥈', '🥉'];
                        const rank = i < 3 ? medals[i] : '';
                        return `
                            <div class="flex items-center gap-1.5 bg-background border border-white/5 px-3 py-1.5 rounded-full text-xs font-mono whitespace-nowrap">
                                <span>${rank}</span>
                                <span class="text-slate-300">@${c[0]}</span>
                                <span class="text-primary font-bold bg-primary/10 px-1.5 rounded">${c[1]}</span>
                            </div>
                        `;
                    }).join('');
                    container.classList.remove('opacity-0');
                }
            },

            switchTab(type) {
                this.activeTab = type;
                this.activeGroup = null; // Reset drilldown
                this.searchQuery = document.getElementById('search-bar').value = ''; // Reset search
                
                // Animate Toggle
                const indicator = document.getElementById('tab-indicator');
                const btnAc = document.getElementById('btn-aircraft');
                const btnAp = document.getElementById('btn-airports');
                
                if (type === 'aircraft') {
                    indicator.style.transform = 'translateX(0)';
                    btnAc.classList.add('active');
                    btnAp.classList.remove('active');
                } else {
                    indicator.style.transform = 'translateX(100%)';
                    btnAp.classList.add('active');
                    btnAc.classList.remove('active');
                }

                this.transitionRender();
            },

            handleSearch(query) {
                this.searchQuery = query.toLowerCase();
                this.render();
            },

            openDrilldown(aircraftType) {
                this.activeGroup = aircraftType;
                this.searchQuery = document.getElementById('search-bar').value = '';
                this.transitionRender();
            },

            closeDrilldown() {
                this.activeGroup = null;
                this.transitionRender();
            },

            transitionRender() {
                const grid = document.getElementById('gallery-grid');
                grid.classList.add('fade-out');
                setTimeout(() => {
                    this.render();
                    grid.classList.remove('fade-out');
                }, 300);
            },

            renderSkeletons() {
                const grid = document.getElementById('gallery-grid');
                grid.innerHTML = Array(6).fill(0).map(() => `
                    <div class="skeleton-loader aspect-video"></div>
                `).join('');
            },

            render() {
                const grid = document.getElementById('gallery-grid');
                const drillNav = document.getElementById('drilldown-nav');
                const drillTitle = document.getElementById('drilldown-title');

                if (this.activeTab === 'airports') {
                    drillNav.classList.add('hidden');
                    this.renderAirports(grid);
                } else {
                    if (this.activeGroup) {
                        drillNav.classList.remove('hidden');
                        drillNav.classList.add('flex');
                        drillTitle.innerText = `${this.activeGroup} Fleet`;
                        this.renderAircraftDetails(grid);
                    } else {
                        drillNav.classList.add('hidden');
                        drillNav.classList.remove('flex');
                        this.renderAircraftGroups(grid);
                    }
                }
                lucide.createIcons();
            },

            renderAircraftGroups(grid) {
                let filtered = this.rawAircraft.filter(ac => {
                    if (!this.searchQuery) return true;
                    return (ac.aircraftType?.toLowerCase().includes(this.searchQuery) ||
                            ac.liveryName?.toLowerCase().includes(this.searchQuery) ||
                            ac.tailNumber?.toLowerCase().includes(this.searchQuery));
                });

                if (filtered.length === 0) {
                    grid.innerHTML = this.getEmptyState('No aircraft matched your search parameters.');
                    return;
                }

                // Group by type
                const groups = {};
                filtered.forEach(ac => {
                    const type = ac.aircraftType || 'Unknown Type';
                    if (!groups[type]) groups[type] = [];
                    groups[type].push(ac);
                });

                grid.innerHTML = Object.entries(groups).map(([type, fleet]) => {
                    const heroImage = fleet[0].imageUrl;
                    return `
                        <div onclick="appState.openDrilldown('${type}')" class="glow-card stack-effect group aspect-video cursor-pointer bg-surface overflow-hidden relative mt-4">
                            
                            <img src="${heroImage}" class="absolute inset-0 w-full h-full object-cover opacity-30 blur-xl scale-125 z-0" alt="">
                            
                            <div class="absolute inset-0 z-10 p-5">
                                <img src="${heroImage}" loading="lazy" class="w-full h-full object-cover rounded-[2rem] border border-white/10 drop-shadow-[0_20px_40px_rgba(0,0,0,0.8)] transition-transform duration-700 ease-out group-hover:scale-[1.03]">
                            </div>

                            <div class="absolute inset-0 z-20 bg-gradient-to-t from-background/90 via-background/20 to-transparent rounded-1.5xl pointer-events-none"></div>
                            
                            <div class="absolute bottom-6 left-8 right-8 z-30 flex justify-between items-end">
                                <div>
                                    <h3 class="text-3xl font-black text-white tracking-tight leading-none drop-shadow-lg">${type}</h3>
                                    <p class="text-sm text-slate-300 mt-2 font-medium bg-black/40 inline-block px-3 py-1 rounded-full backdrop-blur-md border border-white/5">
                                        Tap to expand folder
                                    </p>
                                </div>
                                <div class="bg-primary/90 text-white border border-white/20 px-4 py-2 rounded-xl flex flex-col items-center backdrop-blur-md shadow-xl transition-transform group-hover:scale-110 group-hover:-translate-y-2">
                                    <span class="text-2xl font-black leading-none">${fleet.length}</span>
                                    <span class="text-[9px] font-bold uppercase tracking-widest opacity-80">Images</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            renderAircraftDetails(grid) {
                const fleet = this.rawAircraft.filter(ac => ac.aircraftType === this.activeGroup);
                
                let filtered = fleet.filter(ac => {
                    if (!this.searchQuery) return true;
                    return (ac.liveryName?.toLowerCase().includes(this.searchQuery) ||
                            ac.tailNumber?.toLowerCase().includes(this.searchQuery));
                });

                if (filtered.length === 0) {
                    grid.innerHTML = this.getEmptyState('No specific aircraft match your search in this folder.');
                    return;
                }

                grid.innerHTML = filtered.map(ac => `
                    <div class="glow-card group aspect-video cursor-pointer bg-surface overflow-hidden relative">
                        <img src="${ac.imageUrl}" class="absolute inset-0 w-full h-full object-cover opacity-20 blur-2xl scale-125 z-0" alt="">
                        
                        <div class="absolute inset-0 z-10 p-4">
                            <img src="${ac.imageUrl}" loading="lazy" class="w-full h-full object-contain rounded-[2rem] drop-shadow-[0_15px_25px_rgba(0,0,0,0.6)] transition-transform duration-700 ease-out group-hover:scale-[1.04]">
                        </div>
                        
                        <div class="absolute bottom-4 left-4 right-4 z-20 flex justify-between items-end bg-slate-900/80 backdrop-blur-2xl border border-white/10 rounded-2xl p-5 translate-y-8 opacity-0 transition-all duration-500 ease-out group-hover:translate-y-0 group-hover:opacity-100 shadow-2xl">
                            <div class="flex flex-col gap-2">
                                <h3 class="text-2xl font-bold text-white tracking-tight leading-none">${ac.tailNumber || 'UNKNOWN'}</h3>
                                <div class="flex items-center gap-2 text-sm text-slate-300">
                                    <span class="px-2 py-0.5 bg-white/10 rounded-md text-xs font-mono border border-white/5">LIVERY</span>
                                    <span class="font-medium text-accent">${ac.liveryName}</span>
                                </div>
                            </div>
                            
                            <div class="flex flex-col items-end gap-3">
                                <span class="bg-primary/20 text-primary border border-primary/30 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest shadow-sm">
                                    ${ac.aircraftType}
                                </span>
                                <div class="flex items-center gap-1.5 text-xs text-slate-400 font-mono bg-black/40 px-2 py-1 rounded-md">
                                    <i data-lucide="camera" class="size-3"></i>
                                    <span>${ac.contributorName || 'System'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            renderAirports(grid) {
                let filtered = this.rawAirports.filter(ap => {
                    if (!this.searchQuery) return true;
                    return ap.icao?.toLowerCase().includes(this.searchQuery);
                });

                if (filtered.length === 0) {
                    grid.innerHTML = this.getEmptyState('No terminal captures found matching criteria.');
                    return;
                }

                grid.innerHTML = filtered.map(ap => {
                    const dateObj = new Date(ap.lastUpdated);
                    const formattedDate = dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                    
                    return `
                    <div class="glow-card group aspect-video cursor-pointer bg-surface overflow-hidden relative">
                        <img src="${ap.imageUrl}" class="absolute inset-0 w-full h-full object-cover opacity-20 blur-2xl scale-125 z-0" alt="">
                        
                        <div class="absolute inset-0 z-10 p-4">
                            <img src="${ap.imageUrl}" loading="lazy" class="w-full h-full object-cover rounded-[2rem] border border-white/10 drop-shadow-[0_15px_25px_rgba(0,0,0,0.6)] transition-transform duration-700 ease-out group-hover:scale-[1.04]">
                        </div>
                        
                        <div class="absolute bottom-4 left-4 right-4 z-20 flex justify-between items-end bg-slate-900/80 backdrop-blur-2xl border border-white/10 rounded-2xl p-5 translate-y-8 opacity-0 transition-all duration-500 ease-out group-hover:translate-y-0 group-hover:opacity-100 shadow-2xl">
                            <div class="flex flex-col gap-2">
                                <h3 class="text-3xl font-black text-white tracking-widest leading-none drop-shadow-md">${ap.icao}</h3>
                                <div class="flex items-center gap-2 text-sm text-slate-400 font-mono">
                                    <i data-lucide="clock" class="size-3.5 text-accent"></i>
                                    <span>${formattedDate}</span>
                                </div>
                            </div>
                            
                            <div class="flex flex-col items-end gap-2.5">
                                <span class="bg-accent/20 text-accent border border-accent/30 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest shadow-sm">
                                    TERMINAL
                                </span>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            },

            getEmptyState(message) {
                return `
                    <div class="col-span-full py-32 text-center text-slate-500 border border-dashed border-white/10 rounded-3xl bg-white/[0.02]">
                        <i data-lucide="radar" class="size-10 mx-auto mb-4 opacity-40"></i>
                        <p class="font-mono text-sm tracking-widest uppercase">${message}</p>
                    </div>
                `;
            },

            setupMouseTracking() {
                document.getElementById('gallery-grid').addEventListener('mousemove', e => {
                    const card = e.target.closest('.glow-card');
                    if (!card) return;
                    const rect = card.getBoundingClientRect();
                    card.style.setProperty('--x', `${e.clientX - rect.left}px`);
                    card.style.setProperty('--y', `${e.clientY - rect.top}px`);
                });
            }
        };

        // Boot App
        document.addEventListener('DOMContentLoaded', () => {
            appState.init();
        });
    </script>
</body>
</html>
