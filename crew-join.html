<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join — Crew Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        :root{ --bg:#F6F3ED; --surface:#FFFFFF; --line:#E7E2D8; --line-soft:#F0ECE4; --ink:#1C1A16; --muted:#736E64; --faint:#A8A296; --accent:#4f46e5; color-scheme: light dark; }
        .dark{ --bg:#121110; --surface:#1A1815; --line:#2A2721; --line-soft:#211E1A; --ink:#F3EFE7; --muted:#A49E92; --faint:#6E685D; }
        *{ -webkit-tap-highlight-color: transparent; }
        body{ font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; background:var(--bg); color:var(--ink); }
        body.embed{ background:transparent; }
        [data-lucide]{ width:1.15em; height:1.15em; } svg.lucide{ stroke-width:1.6; }
        .surface{ background:var(--surface); border:1px solid var(--line); }
        .hair{ border-color:var(--line); } .hair-soft{ border-color:var(--line-soft); }
        .muted{ color:var(--muted); } .faint{ color:var(--faint); }
        .accent-bg{ background:var(--accent); } .accent-text{ color:var(--accent); }
        input, select, textarea{ font-family:inherit; } ::placeholder{ color:var(--faint); }
        .step{ animation:slide .35s cubic-bezier(.2,.8,.2,1); }
        @keyframes slide{ from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:translateX(0);} }
        .field{ width:100%; background:var(--surface); border:1px solid var(--line); border-radius:.75rem; padding:.7rem .9rem; font-size:.95rem; }
        .field:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
        a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
    </style>
</head>
<body class="min-h-screen antialiased">

    <!--
      Crew Center — applicant JOIN flow. Standalone AND embeddable:
        · full page:  inflight.info/crew/<slug>/join
        · iframe:     …/join?embed=1  (posts its height so the host can resize)
      Branding + the staff-built form come from by-slug; submits to /apply.
    -->

    <div id="wrap" class="min-h-screen flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-5">
                <img id="logo" alt="" class="hidden mx-auto mb-3 max-h-14 w-auto object-contain">
                <div id="mono" class="accent-bg w-14 h-14 rounded-2xl grid place-items-center text-white text-xl font-black mx-auto mb-3">VA</div>
                <h1 class="text-lg font-bold tracking-tight">Join <span id="vaName">the crew</span></h1>
                <p id="joinSub" class="text-sm muted mt-0.5"></p>
            </div>

            <div class="surface rounded-2xl overflow-hidden shadow-sm">
                <!-- Progress -->
                <div class="h-1 bg-[var(--line)]"><div id="bar" class="h-full accent-bg transition-all duration-300" style="width:0%"></div></div>

                <div class="p-5 sm:p-6">
                    <div id="stepBody"><div class="flex justify-center py-10"><i data-lucide="loader" class="w-6 h-6 muted animate-spin"></i></div></div>
                </div>

                <!-- Footer nav -->
                <div id="nav" class="hidden flex items-center justify-between px-5 sm:px-6 py-4 border-t hair-soft">
                    <button id="backBtn" onclick="back()" class="text-sm font-semibold muted hover:text-[var(--ink)] transition inline-flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back</button>
                    <button id="nextBtn" onclick="next()" class="accent-bg text-white text-sm font-semibold px-5 py-2.5 rounded-lg hover:opacity-90 active:scale-[.99] transition inline-flex items-center gap-1.5">Continue <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                </div>
            </div>

            <div class="mt-5 flex items-center justify-center gap-2 opacity-80">
                <span class="text-[11px] font-medium tracking-wide faint">Powered by</span>
                <img src="/Images/inflight.png" alt="Inflight" class="h-[16px] w-auto dark:hidden">
                <img src="/Images/inflight-light.png" alt="Inflight" class="h-[16px] w-auto hidden dark:block">
            </div>
        </div>
    </div>

    <script>
        const BACKEND = 'https://site--indgo-backend--6dmjph8ltlhv.code.run';
        const EMBED = new URLSearchParams(location.search).get('embed')==='1';
        let CFG = { mode:'application', minGrade:0, callsignPrefix:'', form:[], reqs:[] };
        let VA = { name:'', code:'' };
        let STEPS = [], cur = 0;
        const DATA = { ifcName:'', prefix:'', number:'', grade:0, answers:[], verified:false, vGrade:null, stats:null, agreed:[] };
        // Tracks the last IF verification so we can badge the field, skip the
        // self-report grade step when we already know the true grade, and block
        // a name our lookup says doesn't exist.
        let verifyState = { name:'', status:'idle' }; // idle|checking|found|notfound|down

        // ---- Theme (follow the host / OS) ----
        (function(){ let p=null; try{p=localStorage.getItem('crew-theme');}catch{} const d=p?p==='dark':window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.classList.toggle('dark',d); })();
        if(EMBED){ document.body.classList.add('embed'); document.getElementById('wrap').classList.remove('min-h-screen'); }

        function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        function isSafeImageUrl(u){try{const url=new URL(u,location.href);if(url.origin===location.origin)return true;return url.protocol==='https:'||url.protocol==='data:';}catch{return false;}}
        function isHex(c){return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c||'');}
        function initials(name,code){const s=(name||code||'VA').trim();const w=s.split(/\s+/).filter(Boolean);return (w.length>=2?(w[0][0]+w[1][0]):s.slice(0,2)).toUpperCase();}
        function getSlug(){const m=location.pathname.match(/\/crew\/([^\/?#]+)/i);if(m&&m[1]&&m[1].toLowerCase()!=='join')return decodeURIComponent(m[1]).trim().toLowerCase();const q=new URLSearchParams(location.search).get('va');return q?q.trim().toLowerCase():'';}
        function postHeight(){ if(EMBED){ try{ parent.postMessage({ ifcrewHeight: document.documentElement.scrollHeight }, '*'); }catch{} } }

        // ---- Steps ----
        function buildSteps(){
            STEPS = ['intro','ifc','callsign'];
            // Only ask the pilot for their grade if the VA gates on it AND our
            // own lookup hasn't already confirmed a grade for them.
            if(CFG.minGrade>0 && !(DATA.verified && DATA.vGrade!=null)) STEPS.push('grade');
            if(CFG.reqs && CFG.reqs.length) STEPS.push('requirements');
            if(CFG.form && CFG.form.length) STEPS.push('questions');
            STEPS.push('review');
        }
        function setNav(showBack, nextLabel){
            document.getElementById('nav').classList.remove('hidden');
            document.getElementById('backBtn').style.visibility = showBack ? 'visible':'hidden';
            document.getElementById('nextBtn').innerHTML = nextLabel + ' <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        }
        function fullCallsign(){ return (DATA.prefix + DATA.number).replace(/\s+/g,''); }

        // ---- Infinite Flight verification (uses our own IF tooling) ----
        function renderIfcStatus(){
            const el=document.getElementById('ifcStatus'); if(!el) return;
            const S=verifyState.status;
            if(S==='checking'){ el.innerHTML=`<span class="muted inline-flex items-center gap-1.5"><i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Checking Infinite Flight…</span>`; }
            else if(S==='found'){ const g=DATA.vGrade!=null?` · Grade ${DATA.vGrade}`:''; el.innerHTML=`<span class="inline-flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-medium"><i data-lucide="badge-check" class="w-4 h-4"></i> Verified as ${escapeHtml(DATA.ifcName)}${escapeHtml(g)}</span>`; }
            else if(S==='notfound'){ el.innerHTML=`<span class="inline-flex items-center gap-1.5 text-red-500 font-medium"><i data-lucide="alert-circle" class="w-4 h-4"></i> No Infinite Flight account with that name. Check the spelling.</span>`; }
            else if(S==='down'){ el.innerHTML=`<span class="muted inline-flex items-center gap-1.5"><i data-lucide="info" class="w-4 h-4"></i> Couldn’t verify right now — you can still continue.</span>`; }
            else { el.innerHTML=''; }
            if(window.lucide) lucide.createIcons();
            postHeight();
        }
        async function verifyIfc(){
            const inp=document.getElementById('f_ifc'); if(!inp) return;
            const name=inp.value.trim();
            if(!name){ shake('f_ifc'); return; }
            const slug=getSlug();
            if(!slug){ // preview mode with no backend — accept as-is
                verifyState={ name, status:'down' }; DATA.ifcName=name; renderIfcStatus(); return;
            }
            verifyState={ name, status:'checking' }; renderIfcStatus();
            try{
                const res=await fetch(`${BACKEND}/api/crew/${encodeURIComponent(slug)}/verify-if`,{ method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json'}, body:JSON.stringify({ ifcName:name }) });
                const d=await res.json().catch(()=>({}));
                if(inp.value.trim()!==name) return; // user kept typing; ignore stale result
                if(!res.ok || d.available===false){ verifyState={ name, status:'down' }; DATA.verified=false; DATA.vGrade=null; }
                else if(d.found){
                    DATA.ifcName = d.username || name; DATA.verified=true;
                    DATA.vGrade = (typeof d.grade==='number') ? d.grade : null;
                    DATA.stats = d.stats || null;
                    if(DATA.vGrade!=null) DATA.grade=DATA.vGrade;
                    inp.value = DATA.ifcName;
                    verifyState={ name:DATA.ifcName, status:'found' };
                    buildSteps(); // may drop the self-report grade step now we know it
                } else { verifyState={ name, status:'notfound' }; DATA.verified=false; DATA.vGrade=null; DATA.stats=null; }
            }catch{ if(inp.value.trim()===name){ verifyState={ name, status:'down' }; } }
            renderIfcStatus();
        }

        // ---- Join requirements (auto-checked against verified IF stats) ----
        const REQ_INFO={
            grade:{label:'Grade',stat:'grade',cmp:'min'},
            hours:{label:'Flight hours',stat:'hours',cmp:'min'},
            landings:{label:'Landings',stat:'landings',cmp:'min'},
            xp:{label:'XP',stat:'xp',cmp:'min'},
            flights:{label:'Online flights',stat:'flights',cmp:'min'},
            violations:{label:'Violations',stat:'violations',cmp:'max'},
        };
        function reqRowHtml(r){
            const info=REQ_INFO[r.type]; if(!info) return '';
            const need=r.value, word=info.cmp==='max'?'max':'min';
            if(!DATA.stats){
                return `<li class="flex items-center justify-between gap-3 text-sm py-2.5"><span>${escapeHtml(info.label)}</span><span class="text-xs faint">${word} ${escapeHtml(String(need))}</span></li>`;
            }
            const have=Number(DATA.stats[info.stat])||0;
            const pass=info.cmp==='max'?have<=need:have>=need;
            return `<li class="flex items-center justify-between gap-3 text-sm py-2.5">
                <span>${escapeHtml(info.label)} <span class="faint">· ${word} ${escapeHtml(String(need))}</span></span>
                <span class="inline-flex items-center gap-1.5 ${pass?'text-emerald-600 dark:text-emerald-400':'text-red-500'} font-semibold"><i data-lucide="${pass?'check':'x'}" class="w-4 h-4"></i>${escapeHtml(String(have))}</span></li>`;
        }
        function reqAutoPass(){
            if(!DATA.stats) return true; // can't check client-side; server enforces on submit
            return CFG.reqs.filter(r=>REQ_INFO[r.type]).every(r=>{ const info=REQ_INFO[r.type]; const have=Number(DATA.stats[info.stat])||0; return info.cmp==='max'?have<=r.value:have>=r.value; });
        }

        function renderStep(){
            const s = STEPS[cur];
            const body = document.getElementById('stepBody');
            document.getElementById('bar').style.width = Math.round((cur)/(STEPS.length-1)*100)+'%';

            if(s==='intro'){
                const reqs = [];
                reqs.push(CFG.mode==='free' ? 'Instant access — no waiting' : 'Reviewed by the VA staff');
                if(CFG.minGrade>0) reqs.push(`Infinite Flight Grade ${CFG.minGrade}+`);
                body.innerHTML = `<div class="step text-center">
                    <div class="w-12 h-12 rounded-xl bg-[color-mix(in_srgb,var(--accent)_14%,transparent)] accent-text grid place-items-center mx-auto mb-4"><i data-lucide="plane" class="w-6 h-6"></i></div>
                    <h2 class="text-xl font-bold tracking-tight">Ready to fly with us?</h2>
                    <p class="text-sm muted mt-1.5">Takes under a minute.</p>
                    <ul class="text-left mt-5 space-y-2">${reqs.map(r=>`<li class="flex items-center gap-2.5 text-sm"><i data-lucide="check" class="w-4 h-4 accent-text"></i> ${escapeHtml(r)}</li>`).join('')}</ul>
                </div>`;
                setNav(false, "Get started");
            }
            else if(s==='ifc'){
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Your Infinite Flight name</h2>
                    <p class="text-sm muted mt-1 mb-4">Your Infinite Flight Community (IFC) username — we’ll verify it against Infinite Flight.</p>
                    <div class="flex items-center gap-2">
                        <input id="f_ifc" class="field flex-1" placeholder="e.g. Jordan_Lee" value="${escapeHtml(DATA.ifcName)}" autocomplete="off" autocapitalize="off" spellcheck="false">
                        <button id="ifcCheck" type="button" onclick="verifyIfc()" class="shrink-0 text-sm font-semibold px-3.5 py-2.5 rounded-lg border hair hover:bg-[var(--line-soft)] transition">Verify</button>
                    </div>
                    <div id="ifcStatus" class="mt-2.5 text-sm min-h-[1.25rem]"></div>
                </div>`;
                setNav(true, "Continue");
                const inp=document.getElementById('f_ifc');
                // Re-verify whenever the name changes; verify on blur for convenience.
                inp.addEventListener('input',()=>{ if(inp.value.trim()!==verifyState.name){ verifyState={ name:'', status:'idle' }; DATA.verified=false; DATA.vGrade=null; renderIfcStatus(); } });
                inp.addEventListener('blur',()=>{ if(inp.value.trim() && inp.value.trim()!==verifyState.name) verifyIfc(); });
                inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); verifyIfc(); } });
                renderIfcStatus();
                setTimeout(()=>inp.focus(),50);
            }
            else if(s==='callsign'){
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Pick your callsign</h2>
                    <p class="text-sm muted mt-1 mb-4">Your radio callsign for VA flights.</p>
                    <div class="flex items-center gap-2">
                        <input id="f_prefix" class="field w-24 text-center font-semibold" placeholder="ACA" value="${escapeHtml(DATA.prefix||CFG.callsignPrefix||VA.code||'')}" maxlength="6">
                        <input id="f_number" class="field flex-1 text-center font-semibold tracking-wider" placeholder="1174" inputmode="numeric" value="${escapeHtml(DATA.number)}" maxlength="5">
                    </div>
                    <div class="mt-4 text-center">
                        <div class="text-xs uppercase tracking-wider faint mb-1">Your callsign</div>
                        <div id="csPreview" class="text-2xl font-extrabold tracking-wide accent-text">—</div>
                    </div>
                </div>`;
                setNav(true, "Continue");
                const upd=()=>{ const p=document.getElementById('f_prefix').value.trim().toUpperCase(); const n=document.getElementById('f_number').value.replace(/[^0-9]/g,''); document.getElementById('f_number').value=n; document.getElementById('csPreview').textContent=(p||n)?`${p} ${n}`.trim():'—'; };
                document.getElementById('f_prefix').addEventListener('input',upd); document.getElementById('f_number').addEventListener('input',upd); upd();
            }
            else if(s==='grade'){
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Your Infinite Flight grade</h2>
                    <p class="text-sm muted mt-1 mb-4">This VA requires <b>Grade ${CFG.minGrade}+</b>.</p>
                    <div class="grid grid-cols-5 gap-2" id="gradeGrid">
                        ${[1,2,3,4,5].map(g=>`<button data-g="${g}" class="py-3 rounded-lg border hair text-sm font-bold ${DATA.grade===g?'accent-bg text-white':''}">${g}</button>`).join('')}
                    </div>
                </div>`;
                setNav(true, "Continue");
                document.querySelectorAll('#gradeGrid [data-g]').forEach(b=>b.addEventListener('click',()=>{ DATA.grade=+b.getAttribute('data-g'); renderStep(); }));
            }
            else if(s==='requirements'){
                const auto=CFG.reqs.filter(r=>REQ_INFO[r.type]);
                const agree=CFG.reqs.filter(r=>r.type==='agree');
                const haveStats=!!DATA.stats;
                const autoHtml = auto.length ? `<ul class="surface hair rounded-lg divide-y hair-soft px-4">${auto.map(reqRowHtml).join('')}</ul>${!haveStats?`<p class="text-xs faint mt-2">We’ll confirm these against your Infinite Flight stats when you submit.</p>`:''}` : '';
                const agreeHtml = agree.length ? `<div class="mt-4 space-y-1">${agree.map(r=>`
                    <label class="flex items-start gap-2.5 text-sm py-1.5 cursor-pointer">
                        <input type="checkbox" data-agree="${escapeHtml(r.label)}" ${DATA.agreed.includes(r.label)?'checked':''} class="mt-0.5 accent-[var(--accent)]">
                        <span>${escapeHtml(r.label)}${r.required?' <span class="accent-text">*</span>':''}</span>
                    </label>`).join('')}</div>` : '';
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Requirements</h2>
                    <p class="text-sm muted mt-1 mb-4">What the ${escapeHtml(VA.name||'VA')} team asks of new pilots.</p>
                    ${autoHtml}${agreeHtml}
                    <p id="reqNote" class="hidden text-sm mt-3 text-red-500"></p>
                </div>`;
                setNav(true, "Continue");
                body.querySelectorAll('[data-agree]').forEach(c=>c.addEventListener('change',()=>{
                    const lbl=c.getAttribute('data-agree');
                    if(c.checked){ if(!DATA.agreed.includes(lbl)) DATA.agreed.push(lbl); }
                    else DATA.agreed=DATA.agreed.filter(x=>x!==lbl);
                }));
            }
            else if(s==='questions'){
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">A few questions</h2>
                    <p class="text-sm muted mt-1 mb-4">From the ${escapeHtml(VA.name||'VA')} team.</p>
                    <div class="space-y-4">${CFG.form.map((q,i)=>`
                        <div>
                            <label class="block text-sm font-medium mb-1.5">${escapeHtml(q.label)}${q.required?' <span class="accent-text">*</span>':''}</label>
                            ${q.type==='textarea'
                                ? `<textarea data-q="${i}" rows="3" class="field">${escapeHtml((DATA.answers[i]&&DATA.answers[i].a)||'')}</textarea>`
                                : `<input data-q="${i}" class="field" value="${escapeHtml((DATA.answers[i]&&DATA.answers[i].a)||'')}">`}
                        </div>`).join('')}</div>
                </div>`;
                setNav(true, "Continue");
            }
            else if(s==='review'){
                const nameCell = DATA.verified
                    ? `${escapeHtml(DATA.ifcName)} <span class="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400 text-xs font-semibold ml-1"><i data-lucide="badge-check" class="w-3.5 h-3.5"></i>verified</span>`
                    : escapeHtml(DATA.ifcName);
                const rows = [['IFC name', nameCell, true], ['Callsign', fullCallsign()||'—']];
                if(CFG.minGrade>0 || DATA.grade) rows.push(['Grade', 'Grade '+(DATA.grade||'—')]);
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Review &amp; ${CFG.mode==='free'?'join':'apply'}</h2>
                    <p class="text-sm muted mt-1 mb-4">${CFG.mode==='free'?'You’ll get instant access.':'Staff will review your application.'}</p>
                    <div class="surface hair rounded-lg divide-y hair-soft">
                        ${rows.map(r=>`<div class="flex items-center justify-between px-4 py-2.5 text-sm"><span class="muted">${escapeHtml(r[0])}</span><span class="font-semibold text-right">${r[2]?r[1]:escapeHtml(r[1])}</span></div>`).join('')}
                    </div>
                    <p id="submitNote" class="hidden text-sm mt-3"></p>
                </div>`;
                setNav(true, CFG.mode==='free' ? 'Join now' : 'Submit application');
            }
            document.getElementById('nextBtn').disabled=false;
            if(window.lucide) lucide.createIcons();
            postHeight();
        }

        function readStep(){
            const s = STEPS[cur];
            if(s==='ifc'){ DATA.ifcName = document.getElementById('f_ifc').value.trim(); if(!DATA.ifcName){ shake('f_ifc'); return false; }
                if(verifyState.name===DATA.ifcName && verifyState.status==='notfound'){ shake('f_ifc'); return false; } }
            if(s==='callsign'){ DATA.prefix = document.getElementById('f_prefix').value.trim().toUpperCase(); DATA.number = document.getElementById('f_number').value.replace(/[^0-9]/g,''); if(!DATA.number){ shake('f_number'); return false; } }
            if(s==='grade'){ if(!DATA.grade){ return false; } if(DATA.grade<CFG.minGrade){ toast('Grade '+CFG.minGrade+'+ required.'); return false; } }
            if(s==='requirements'){
                const missing=CFG.reqs.filter(r=>r.type==='agree'&&r.required&&!DATA.agreed.includes(r.label));
                const n=document.getElementById('reqNote');
                if(missing.length){ if(n){ n.textContent='Please accept the required item'+(missing.length>1?'s':'')+' to continue.'; n.classList.remove('hidden'); } return false; }
                if(!reqAutoPass()){ if(n){ n.textContent='Your Infinite Flight stats don’t meet these requirements yet.'; n.classList.remove('hidden'); } return false; }
            }
            if(s==='questions'){ DATA.answers = CFG.form.map((q,i)=>({ q:q.label, a:(document.querySelector(`[data-q="${i}"]`)||{}).value?document.querySelector(`[data-q="${i}"]`).value.trim():'' })); for(let i=0;i<CFG.form.length;i++){ if(CFG.form[i].required && !DATA.answers[i].a){ shake(`[data-q="${i}"]`); return false; } } }
            return true;
        }
        function shake(sel){ const el=sel.startsWith('[')?document.querySelector(sel):document.getElementById(sel); if(el){ el.style.borderColor='#ef4444'; el.focus(); } }
        function toast(msg){ const n=document.getElementById('submitNote')||document.getElementById('stepBody'); }

        async function next(){
            if(!readStep()) return;
            // On the IFC step, make sure we've verified the current name before
            // moving on. If it hasn't been checked yet, check it now and pause so
            // the pilot sees the result (a not-found name won't advance).
            if(STEPS[cur]==='ifc' && verifyState.name!==DATA.ifcName){
                await verifyIfc();
                if(verifyState.status==='notfound') return;
            }
            if(cur>=STEPS.length-1){ submit(); return; }
            cur++; renderStep();
        }
        function back(){ if(cur>0){ cur--; renderStep(); } }

        async function submit(){
            const btn=document.getElementById('nextBtn'); btn.disabled=true;
            const note=document.getElementById('submitNote');
            const slug=getSlug();
            const body={ ifcName:DATA.ifcName, callsignPrefix:DATA.prefix, callsignNumber:DATA.number, grade:DATA.grade, answers:DATA.answers, agreed:DATA.agreed };
            try{
                const res=await fetch(`${BACKEND}/api/crew/${encodeURIComponent(slug)}/apply`,{ method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json'}, body:JSON.stringify(body) });
                const d=await res.json().catch(()=>({}));
                if(!res.ok){ if(note){ note.textContent=d.error||'Something went wrong. Please try again.'; note.className='text-sm text-red-500 mt-3'; note.classList.remove('hidden'); } btn.disabled=false; return; }
                success(d);
            }catch{ if(note){ note.textContent='Couldn’t reach the server. Please try again.'; note.className='text-sm text-red-500 mt-3'; note.classList.remove('hidden'); } btn.disabled=false; }
        }
        function success(d){
            document.getElementById('nav').classList.add('hidden');
            document.getElementById('bar').style.width='100%';
            const accepted = d.status==='accepted';
            const slug=getSlug();
            // Pending applicants get a private status link (no account/email
            // needed) so they can check back for the staff's accept/decline.
            const statusUrl = d.statusToken ? `/crew/${encodeURIComponent(slug)}/status?id=${encodeURIComponent(d.statusToken)}` : '';
            document.getElementById('stepBody').innerHTML = `<div class="step text-center py-4">
                <div class="w-14 h-14 rounded-full ${accepted?'bg-emerald-500':'accent-bg'} text-white grid place-items-center mx-auto mb-4"><i data-lucide="${accepted?'party-popper':'clock'}" class="w-7 h-7"></i></div>
                <h2 class="text-xl font-bold tracking-tight">${accepted?'Welcome aboard!':'Application received'}</h2>
                ${accepted
                    ? `<p class="text-sm muted mt-2">You’re now part of <b>${escapeHtml(VA.name||'the crew')}</b>. Your callsign:</p><div class="text-2xl font-extrabold accent-text mt-2">${escapeHtml(d.callsign||fullCallsign())}</div>
                       <a href="/crew/${escapeHtml(slug)}" ${EMBED?'target="_top"':''} class="inline-flex items-center gap-1.5 accent-bg text-white text-sm font-semibold px-5 py-2.5 rounded-lg mt-5 hover:opacity-90 transition">Go to the crew center <i data-lucide="arrow-right" class="w-4 h-4"></i></a>`
                    : `<p class="text-sm muted mt-2">Thanks, <b>${escapeHtml(DATA.ifcName)}</b>. The ${escapeHtml(VA.name||'VA')} staff will review your application and message you here.</p>
                       ${statusUrl?`<div class="surface hair rounded-xl p-4 mt-5 text-left">
                          <div class="text-xs uppercase tracking-wider faint mb-1.5 flex items-center gap-1.5"><i data-lucide="bookmark" class="w-3.5 h-3.5"></i> Save your status link</div>
                          <p class="text-sm muted mb-3">Bookmark this to see the VA’s decision and any message they leave you.</p>
                          <div class="flex items-center gap-2">
                            <input id="statusLink" readonly value="${escapeHtml(location.origin+statusUrl)}" class="field flex-1 text-xs" onclick="this.select()">
                            <button onclick="copyStatus()" id="copyBtn" class="shrink-0 accent-bg text-white text-sm font-semibold px-3.5 py-2.5 rounded-lg hover:opacity-90 transition">Copy</button>
                          </div>
                          <a href="${escapeHtml(statusUrl)}" ${EMBED?'target="_top"':''} class="inline-flex items-center gap-1.5 accent-text text-sm font-semibold mt-3 hover:underline">Check status now <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
                       </div>`:''}`}
            </div>`;
            if(window.lucide) lucide.createIcons();
            postHeight();
        }
        function copyStatus(){ const i=document.getElementById('statusLink'); if(!i) return; i.select(); try{ navigator.clipboard.writeText(i.value); }catch{ document.execCommand('copy'); } const b=document.getElementById('copyBtn'); if(b){ const t=b.textContent; b.textContent='Copied'; setTimeout(()=>b.textContent=t,1400); } }

        // ---- Branding + config ----
        function applyBranding(b){
            if(isHex(b.accent)) document.documentElement.style.setProperty('--accent', b.accent);
            VA={ name:b.name||b.code||'', code:b.code||'' };
            const mono=initials(VA.name, VA.code);
            document.getElementById('mono').textContent=mono;
            if(VA.name){ document.getElementById('vaName').textContent=VA.name; document.title=`Join ${VA.name} — Crew Center`; }
            if(b.logo && isSafeImageUrl(b.logo)){ const el=document.getElementById('logo'); el.src=b.logo; el.classList.remove('hidden'); document.getElementById('mono').classList.add('hidden'); }
            if(b.join){ CFG={ mode:b.join.mode||'application', minGrade:b.join.minGrade||0, callsignPrefix:b.join.callsignPrefix||b.code||'', form:Array.isArray(b.join.form)?b.join.form:[], reqs:Array.isArray(b.join.requirements)?b.join.requirements:[] }; }
            DATA.prefix = CFG.callsignPrefix || VA.code || '';
            document.getElementById('joinSub').textContent = CFG.mode==='free' ? 'Instant access' : 'Applications reviewed by staff';
        }
        (async function(){
            const slug=getSlug();
            if(slug){
                try{
                    const res=await fetch(`${BACKEND}/api/va-ads/by-slug/${encodeURIComponent(slug)}`,{headers:{Accept:'application/json'}});
                    if(res.ok) applyBranding(await res.json());
                }catch{}
            }
            // Preview fallback via query overrides (?name/accent + &free / &grade / &q=)
            const q=new URLSearchParams(location.search);
            if(!slug && (q.get('name')||q.get('accent'))){
                applyBranding({ name:q.get('name')||'', code:(q.get('va')||'').toUpperCase(), accent:q.get('accent')||'', join:{ mode:q.get('mode')||'application', minGrade:+(q.get('minGrade')||0), callsignPrefix:q.get('prefix')||'', form:(q.get('q')||'').split('|').filter(Boolean).map(l=>({label:l,type:'text',required:false})) } });
            }
            buildSteps(); cur=0; renderStep();
            addEventListener('resize', postHeight);
        })();
    </script>
</body>
</html>
