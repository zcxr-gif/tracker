<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join — Crew Center</title>
    <!-- Inflight's own mark, until the airline's arrives.
         These pages carried no icon at all, so the browser drew its
         placeholder globe — and kept drawing it for the whole of the first
         request, because the VA's logo comes from the crew record and that is
         a fetch away. This is what is shown in the meantime; CrewBrand.favicon
         replaces it with the airline's own (or its monogram) the moment the
         record lands. Absolute, because these pages are served under
         /crew/<slug> and a relative path would look for them there. -->
    <link rel="icon" type="image/x-icon" href="/Images/inflightIcon.ico">
    <link rel="apple-touch-icon" href="/Images/inflight.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Guarded, because Tailwind is a CDN script: blocked by a network or an
         ad blocker, slow, or simply down, and an unguarded `tailwind.config`
         throws a ReferenceError that kills this inline script outright. Every
         other page in the crew center already guards it. -->
    <script>if (window.tailwind) tailwind.config = { darkMode: 'class' };</script>
    <!-- Paints the VA's own design tokens over the stock look. No-ops entirely
         for a VA that hasn't configured a theme. -->
    <script src="/crewBrand.js"></script>
    <!-- Which of the two interfaces this crew center is wearing (crewSkin.css).
         Sets data-skin on <html> before the first paint; a VA that has never
         chosen gets `essential`, which leaves this page exactly as it was. -->
    <script src="/crewSkin.js"></script>
    <!-- Keeps the airline's accent readable: the ink that sits on it, and a
         version of it that stays legible as text on this page. See crewAccent.js.
         After the skin, so the ground it measures against is the one in force. -->
    <script src="/crewAccent.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        /* Never let a field or a stray wide child scroll the whole page sideways. */
        html,body{ max-width:100%; overflow-x:hidden; }
        input,select,textarea{ max-width:100%; }
        /* iOS Safari zooms the whole page in when you focus a form control
           whose text is smaller than 16px, and there is no way to ask it not
           to: maximum-scale has been deliberately ignored since iOS 10,
           because pinch-zoom is an accessibility feature. So the fix is the
           font size itself, applied only where the pointer is coarse — the
           desktop layout keeps its 14px controls.

           !important because these controls carry Tailwind's text-sm, and a
           class beats any number of element selectors. */
        @media (pointer: coarse){
            input,select,textarea{ font-size:16px !important; }
        }
        :root{ --bg:#F6F3ED; --surface:#FFFFFF; --line:#E7E2D8; --line-soft:#F0ECE4; --ink:#1C1A16; --muted:#736E64; --faint:#A8A296; --accent:#4f46e5; color-scheme: light dark; }
        .dark{ --bg:#121110; --surface:#1A1815; --line:#2A2721; --line-soft:#211E1A; --ink:#F3EFE7; --muted:#A49E92; --faint:#6E685D; }
        *{ -webkit-tap-highlight-color: transparent; }
        body{ font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; background:var(--bg); color:var(--ink); }
        body.embed{ background:transparent; }
        [data-lucide]{ width:1.15em; height:1.15em; } svg.lucide{ stroke-width:1.6; }
        .surface{ background:var(--surface); border:1px solid var(--line); }
        .hair{ border-color:var(--line); } .hair-soft{ border-color:var(--line-soft); }
        .muted{ color:var(--muted); } .faint{ color:var(--faint); }
        /* THE HIGHLIGHTS, READABLE WHATEVER COLOUR THE AIRLINE PICKED.

           --accent is the airline's own hex and is used unchanged as a block of
           colour. The two properties beside it are derived from it by
           crewAccent.js: --accent-ink is the ink that is legible ON it (a cream
           or sky-blue brand needs dark text, not the white this used to hard-code
           and then hide under), and --accent-on is the accent moved far enough in
           lightness to be readable AS text on this page — which is what stops a
           near-black accent from vanishing into the dark interface.

           The compound selector is deliberate: it out-specifies the text-white
           utility these controls are written with, without an !important. */
        .accent-text{ color:var(--accent-on, var(--accent)); }
        .accent-bg{ background:var(--accent-fill, var(--accent)); }
        .accent-bg, .accent-bg.text-white{ color:var(--accent-ink, #fff); }
        input, select, textarea{ font-family:inherit; } ::placeholder{ color:var(--faint); }
        .step{ animation:slide .35s cubic-bezier(.2,.8,.2,1); }
        @keyframes slide{ from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:translateX(0);} }
        .field{ width:100%; background:var(--surface); border:1px solid var(--line); border-radius:.75rem; padding:.7rem .9rem; font-size:.95rem; }
        .field:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
        a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
    </style>
</head>
<body class="min-h-screen antialiased">

    <!--
      Crew Center — applicant JOIN flow. Standalone AND embeddable:
        · full page:  inflight.info/crew/<slug>/join
        · iframe:     …/join?embed=1  (posts its height so the host can resize)
      Branding + the staff-built form come from by-slug; submits to /apply.
    -->

    <div id="wrap" class="min-h-screen flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-5">
                <img id="logo" alt="" class="hidden mx-auto mb-3 max-h-14 w-auto object-contain">
                <div id="mono" class="accent-bg w-14 h-14 rounded-2xl grid place-items-center text-white text-xl font-black mx-auto mb-3">VA</div>
                <h1 class="text-lg font-bold tracking-tight">Join <span id="vaName">the crew</span></h1>
                <p id="joinSub" class="text-sm muted mt-0.5"></p>
            </div>

            <div class="surface rounded-2xl overflow-hidden shadow-sm">
                <!-- Progress -->
                <div class="h-1 bg-[var(--line)]"><div id="bar" class="h-full accent-bg transition-all duration-300" style="width:0%"></div></div>

                <div class="p-5 sm:p-6">
                    <div id="stepBody"><div class="flex justify-center py-10"><i data-lucide="loader" class="w-6 h-6 muted animate-spin"></i></div></div>
                </div>

                <!-- Why you cannot go on yet.
                     Above the nav rather than inside a step, because the steps
                     are rebuilt from scratch on every render and the one place
                     this has to survive is the press that did not work. -->
                <p id="navNote" class="hidden px-5 sm:px-6 -mb-1 pt-3 text-sm text-red-500" role="alert"></p>

                <!-- Footer nav -->
                <div id="nav" class="hidden flex items-center justify-between px-5 sm:px-6 py-4 border-t hair-soft">
                    <button id="backBtn" onclick="back()" class="text-sm font-semibold muted hover:text-[var(--ink)] transition inline-flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back</button>
                    <button id="nextBtn" onclick="next()" class="accent-bg text-white text-sm font-semibold px-5 py-2.5 rounded-lg hover:opacity-90 active:scale-[.99] transition inline-flex items-center gap-1.5">Continue <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                </div>
            </div>

            <div class="mt-5 flex items-center justify-center gap-2 opacity-80">
                <span class="text-[11px] font-medium tracking-wide faint">Powered by</span>
                <img src="/Images/inflight.png" alt="Inflight" class="h-[16px] w-auto dark:hidden">
                <img src="/Images/inflight-light.png" alt="Inflight" class="h-[16px] w-auto hidden dark:block">
            </div>
        </div>
    </div>

    <script>
        const BACKEND = 'https://site--indgo-backend--6dmjph8ltlhv.code.run';
        const EMBED = new URLSearchParams(location.search).get('embed')==='1';
        // Read once, at load. Both decide how a step ARRIVES — see renderStep.
        const mq = (q) => !!(window.matchMedia && window.matchMedia(q).matches);
        const STILL  = mq('(prefers-reduced-motion: reduce)');
        const COARSE = mq('(pointer: coarse)');
        // `callsign` is the SHAPE this VA issues — one entry per airline it has
        // registered, each carrying the tag its pilots append and how wide the
        // number is — plus the top of the range only staff can hand out. See
        // the callsign-shape block below for why this form no longer just
        // staples a prefix to a number.
        let CFG = { mode:'application', minGrade:0, callsignPrefix:'', callsign:{ airlines:[], reservedMax:10 }, form:[], reqs:[], emailEnabled:false };
        let VA = { name:'', code:'' };
        let STEPS = [], cur = 0;
        const DATA = { ifcName:'', prefix:'', number:'', email:'', grade:0, answers:[], verified:false, vGrade:null, stats:null, agreed:[] };
        // Tracks the last IF verification so we can badge the field, skip the
        // self-report grade step when we already know the true grade, and block
        // a name our lookup says doesn't exist.
        let verifyState = { name:'', status:'idle' }; // idle|checking|found|notfound|down
        // The last answer we got about the callsign they are typing, so the step
        // can badge it and Continue can refuse a number somebody already holds.
        // `key` is the airline+number it is an answer ABOUT — the moment they
        // type another digit it is stale and the badge goes back to idle rather
        // than showing a verdict for a callsign that is no longer on screen.
        let csState = { key:'', status:'idle', message:'', callsign:'' }; // idle|checking|free|taken|reserved|down

        // ---- Theme (follow the host / OS) ----
        (function(){ let p=null; try{p=localStorage.getItem('crew-theme');}catch{} const d=p?p==='dark':window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.classList.toggle('dark',d); })();
        if(EMBED){ document.body.classList.add('embed'); document.getElementById('wrap').classList.remove('min-h-screen'); }

        function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        function isSafeImageUrl(u){try{const url=new URL(u,location.href);if(url.origin===location.origin)return true;return url.protocol==='https:'||url.protocol==='data:';}catch{return false;}}
        function isHex(c){return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c||'');}
        function initials(name,code){const s=(name||code||'VA').trim();const w=s.split(/\s+/).filter(Boolean);return (w.length>=2?(w[0][0]+w[1][0]):s.slice(0,2)).toUpperCase();}
        function getSlug(){const m=location.pathname.match(/\/crew\/([^\/?#]+)/i);if(m&&m[1]&&m[1].toLowerCase()!=='join')return decodeURIComponent(m[1]).trim().toLowerCase();const q=new URLSearchParams(location.search).get('va');return q?q.trim().toLowerCase():'';}
        function postHeight(){ if(EMBED){ try{ parent.postMessage({ ifcrewHeight: document.documentElement.scrollHeight }, '*'); }catch{} } }

        // ---- Steps ----
        function buildSteps(){
            STEPS = ['intro','ifc','callsign'];
            // Only ask the pilot for their grade if the VA gates on it AND our
            // own lookup hasn't already confirmed a grade for them.
            if(CFG.minGrade>0 && !(DATA.verified && DATA.vGrade!=null)) STEPS.push('grade');
            if(CFG.reqs && CFG.reqs.length) STEPS.push('requirements');
            if(CFG.form && CFG.form.length) STEPS.push('questions');
            STEPS.push('review');
        }
        function setNav(showBack, nextLabel){
            document.getElementById('nav').classList.remove('hidden');
            document.getElementById('backBtn').style.visibility = showBack ? 'visible':'hidden';
            document.getElementById('nextBtn').innerHTML = nextLabel + ' <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        }
        /* ---- Callsign shape -------------------------------------------------
         * A pilot's callsign is the VA's REGISTERED MASK with their number in
         * it: "AEROMEXICO ###MX" + 1 -> "AEROMEXICO 001MX". The airline, the
         * width of the number and the tag all come out of the mask.
         *
         * This form used to paste the prefix and the number together and call
         * it done — "AEROMEXICO001". That has no tag, which means it is not a
         * VA callsign at all, it IS Aeromexico: the VA's own flight matcher
         * then failed to recognise its own pilot and their flying was credited
         * to nobody. And nothing asked whether the number was already held, so
         * two pilots could take 001 the same afternoon.
         *
         * The server builds the same string from the same rules (crewCallsign.js
         * on the backend) and is the one that decides. Everything here exists so
         * the applicant SEES what they are being issued, and hears "that one is
         * taken", while they can still do something about it.
         * ------------------------------------------------------------------ */
        function airlines(){ return (CFG.callsign && CFG.callsign.airlines) || []; }
        // The shape in play: the airline they picked, this VA's primary one, or
        // — for a VA that has registered no callsign at all — whatever they
        // typed, read the way the rest of the product reads a bare airline.
        function currentShape(){
            const list = airlines();
            if(!list.length){ const p=(DATA.prefix||'').trim().toUpperCase(); return p ? { base:p, tag:'VA', digits:3 } : null; }
            return list.find(a=>a.base===DATA.prefix) || list[0];
        }
        function buildCallsign(shape, number){
            const n = parseInt(String(number==null?'':number).replace(/[^0-9]/g,''), 10);
            if(!shape || !n) return '';
            const width = Math.max(1, Math.min(5, shape.digits||3));
            // Padded to the mask's width, never truncated: a VA on two digits
            // that has grown past 99 keeps issuing callsigns rather than
            // handing out a second "42".
            return `${shape.base} ${String(n).padStart(width,'0')}${shape.tag||''}`.trim();
        }
        function fullCallsign(){ return buildCallsign(currentShape(), DATA.number); }
        // Low numbers are the VA's to hand out — 001 is the founder's, not
        // whoever filled this form in first — so the form refuses them and says
        // who can. Staff issue them from the roster.
        function reservedMax(){ const m=CFG.callsign&&CFG.callsign.reservedMax; return (typeof m==='number'&&m>=0)?m:10; }
        function isReservedNumber(number){
            const n = parseInt(String(number==null?'':number).replace(/[^0-9]/g,''), 10);
            return !!n && reservedMax()>0 && n<=reservedMax();
        }

        // ---- Is this callsign free? ----
        // Asked as they type, answered by the same three checks /apply runs. It
        // is advisory — the number can go between this call and the submit — so
        // /apply checks again and has the last word. Anything we can't get an
        // answer to leaves them able to continue: our outage is not their
        // problem, and the submit will still refuse a taken callsign.
        let csTimer = null;
        function csKey(){ const s=currentShape(); return `${s?s.base:''}#${DATA.number}`; }
        function renderCsStatus(){
            const el=document.getElementById('csStatus'); if(!el) return;
            const S = csState.key===csKey() ? csState.status : 'idle';
            if(S==='checking'){ el.innerHTML=`<span class="muted inline-flex items-center gap-1.5"><i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Checking…</span>`; }
            else if(S==='free'){ el.innerHTML=`<span class="inline-flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-medium"><i data-lucide="badge-check" class="w-4 h-4"></i> Available</span>`; }
            else if(S==='taken'||S==='reserved'){ el.innerHTML=`<span class="inline-flex items-center gap-1.5 text-red-500 font-medium"><i data-lucide="alert-circle" class="w-4 h-4"></i> ${escapeHtml(csState.message)}</span>`; }
            else if(S==='down'){ el.innerHTML=`<span class="muted inline-flex items-center gap-1.5"><i data-lucide="info" class="w-4 h-4"></i> Couldn’t check right now — you can still continue.</span>`; }
            else { el.innerHTML=''; }
            if(window.lucide) lucide.createIcons();
            postHeight();
        }
        async function checkCallsign(){
            const key=csKey();
            const shape=currentShape();
            if(!shape || !DATA.number){ csState={ key:'', status:'idle', message:'', callsign:'' }; renderCsStatus(); return; }
            // The reserved range is known here, so say so immediately rather
            // than spending a round trip to be told.
            if(isReservedNumber(DATA.number)){
                const max=reservedMax();
                csState={ key, status:'reserved', callsign:'',
                    message:`Numbers 1–${max} are reserved for senior crew — pick ${max+1} or above.` };
                renderCsStatus(); return;
            }
            const slug=getSlug();
            if(!slug){ csState={ key, status:'free', message:'', callsign:fullCallsign() }; renderCsStatus(); return; } // preview mode, no backend
            csState={ key, status:'checking', message:'', callsign:'' }; renderCsStatus();
            try{
                const res=await fetch(`${BACKEND}/api/crew/${encodeURIComponent(slug)}/callsign-check`,{
                    method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json'},
                    body:JSON.stringify({ callsignPrefix:shape.base, callsignNumber:DATA.number }) });
                const d=await res.json().catch(()=>({}));
                if(csKey()!==key) return; // they typed on; this answer is about a callsign that is gone
                if(!res.ok){ csState={ key, status:'down', message:'', callsign:'' }; }
                else if(d.ok){ csState={ key, status:'free', message:'', callsign:d.callsign||'' }; }
                else { csState={ key, status:d.code==='reserved'?'reserved':'taken', message:d.error||'That callsign isn’t available.', callsign:'' }; }
            }catch{
                if(csKey()!==key) return;
                csState={ key, status:'down', message:'', callsign:'' };
            }
            renderCsStatus();
        }
        function queueCallsignCheck(){ clearTimeout(csTimer); csTimer=setTimeout(checkCallsign, 400); }

        // ---- Infinite Flight verification (uses our own IF tooling) ----
        function renderIfcStatus(){
            const el=document.getElementById('ifcStatus'); if(!el) return;
            const S=verifyState.status;
            if(S==='checking'){ el.innerHTML=`<span class="muted inline-flex items-center gap-1.5"><i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Checking Infinite Flight…</span>`; }
            else if(S==='found'){ const g=DATA.vGrade!=null?` · Grade ${DATA.vGrade}`:''; el.innerHTML=`<span class="inline-flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-medium"><i data-lucide="badge-check" class="w-4 h-4"></i> Verified as ${escapeHtml(DATA.ifcName)}${escapeHtml(g)}</span>`; }
            else if(S==='notfound'){ el.innerHTML=`<span class="inline-flex items-center gap-1.5 text-red-500 font-medium"><i data-lucide="alert-circle" class="w-4 h-4"></i> No Infinite Flight account with that name. Check the spelling.</span>`; }
            else if(S==='down'){ el.innerHTML=`<span class="muted inline-flex items-center gap-1.5"><i data-lucide="info" class="w-4 h-4"></i> Couldn’t verify right now — you can still continue.</span>`; }
            else { el.innerHTML=''; }
            if(window.lucide) lucide.createIcons();
            postHeight();
        }
        async function verifyIfc(){
            const inp=document.getElementById('f_ifc'); if(!inp) return;
            const name=inp.value.trim();
            if(!name){ shake('f_ifc'); return; }
            const slug=getSlug();
            if(!slug){ // preview mode with no backend — accept as-is
                verifyState={ name, status:'down' }; DATA.ifcName=name; renderIfcStatus(); return;
            }
            verifyState={ name, status:'checking' }; renderIfcStatus();
            try{
                const res=await fetch(`${BACKEND}/api/crew/${encodeURIComponent(slug)}/verify-if`,{ method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json'}, body:JSON.stringify({ ifcName:name }) });
                const d=await res.json().catch(()=>({}));
                if(inp.value.trim()!==name) return; // user kept typing; ignore stale result
                if(!res.ok || d.available===false){ verifyState={ name, status:'down' }; DATA.verified=false; DATA.vGrade=null; }
                else if(d.found){
                    DATA.ifcName = d.username || name; DATA.verified=true;
                    DATA.vGrade = (typeof d.grade==='number') ? d.grade : null;
                    DATA.stats = d.stats || null;
                    if(DATA.vGrade!=null) DATA.grade=DATA.vGrade;
                    inp.value = DATA.ifcName;
                    verifyState={ name:DATA.ifcName, status:'found' };
                    buildSteps(); // may drop the self-report grade step now we know it
                } else { verifyState={ name, status:'notfound' }; DATA.verified=false; DATA.vGrade=null; DATA.stats=null; }
            }catch{ if(inp.value.trim()===name){ verifyState={ name, status:'down' }; } }
            renderIfcStatus();
        }

        // ---- Join requirements (auto-checked against verified IF stats) ----
        const REQ_INFO={
            grade:{label:'Grade',stat:'grade',cmp:'min'},
            hours:{label:'Flight hours',stat:'hours',cmp:'min'},
            landings:{label:'Landings',stat:'landings',cmp:'min'},
            xp:{label:'XP',stat:'xp',cmp:'min'},
            flights:{label:'Online flights',stat:'flights',cmp:'min'},
            violations:{label:'Violations',stat:'violations',cmp:'max'},
        };
        function reqRowHtml(r){
            const info=REQ_INFO[r.type]; if(!info) return '';
            const need=r.value, word=info.cmp==='max'?'max':'min';
            if(!DATA.stats){
                return `<li class="flex items-center justify-between gap-3 text-sm py-2.5"><span>${escapeHtml(info.label)}</span><span class="text-xs faint">${word} ${escapeHtml(String(need))}</span></li>`;
            }
            const have=Number(DATA.stats[info.stat])||0;
            const pass=info.cmp==='max'?have<=need:have>=need;
            return `<li class="flex items-center justify-between gap-3 text-sm py-2.5">
                <span>${escapeHtml(info.label)} <span class="faint">· ${word} ${escapeHtml(String(need))}</span></span>
                <span class="inline-flex items-center gap-1.5 ${pass?'text-emerald-600 dark:text-emerald-400':'text-red-500'} font-semibold"><i data-lucide="${pass?'check':'x'}" class="w-4 h-4"></i>${escapeHtml(String(have))}</span></li>`;
        }
        function reqAutoPass(){
            if(!DATA.stats) return true; // can't check client-side; server enforces on submit
            return CFG.reqs.filter(r=>REQ_INFO[r.type]).every(r=>{ const info=REQ_INFO[r.type]; const have=Number(DATA.stats[info.stat])||0; return info.cmp==='max'?have<=r.value:have>=r.value; });
        }

        function renderStep(){
            const s = STEPS[cur];
            const body = document.getElementById('stepBody');
            document.getElementById('bar').style.width = Math.round((cur)/(STEPS.length-1)*100)+'%';

            if(s==='intro'){
                const reqs = [];
                reqs.push(CFG.mode==='free' ? 'Instant access — no waiting' : 'Reviewed by the VA staff');
                if(CFG.minGrade>0) reqs.push(`Infinite Flight Grade ${CFG.minGrade}+`);
                body.innerHTML = `<div class="step text-center">
                    <div class="w-12 h-12 rounded-xl bg-[color-mix(in_srgb,var(--accent)_14%,transparent)] accent-text grid place-items-center mx-auto mb-4"><i data-lucide="plane" class="w-6 h-6"></i></div>
                    <h2 class="text-xl font-bold tracking-tight">Ready to fly with us?</h2>
                    <p class="text-sm muted mt-1.5">Takes under a minute.</p>
                    <ul class="text-left mt-5 space-y-2">${reqs.map(r=>`<li class="flex items-center gap-2.5 text-sm"><i data-lucide="check" class="w-4 h-4 accent-text"></i> ${escapeHtml(r)}</li>`).join('')}</ul>
                </div>`;
                setNav(false, "Get started");
            }
            else if(s==='ifc'){
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Your Infinite Flight name</h2>
                    <p class="text-sm muted mt-1 mb-4">Your Infinite Flight Community (IFC) username — we’ll verify it against Infinite Flight.</p>
                    <div class="flex items-center gap-2">
                        <input id="f_ifc" class="field flex-1" placeholder="e.g. Jordan_Lee" value="${escapeHtml(DATA.ifcName)}" autocomplete="off" autocapitalize="off" spellcheck="false">
                        <button id="ifcCheck" type="button" onclick="verifyIfc()" class="shrink-0 text-sm font-semibold px-3.5 py-2.5 rounded-lg border hair hover:bg-[var(--line-soft)] transition">Verify</button>
                    </div>
                    <div id="ifcStatus" class="mt-2.5 text-sm min-h-[1.25rem]"></div>
                    <!-- Always offered, whether or not the VA has email set up.
                         It is how a pilot receives their sign-in details when
                         they are accepted, and without it the only copy of that
                         one-time password is whatever a staff member manages to
                         pass on by hand. A VA with no mail configured still gets
                         the address on the application, to reach them their own
                         way — so the field is shown either way, and only the
                         promise underneath it changes. -->
                    <label class="block text-sm font-medium mt-4 mb-1.5">Email <span class="faint font-normal">— where your sign-in details go</span></label>
                    <input id="f_email" type="email" class="field" placeholder="you@example.com" value="${escapeHtml(DATA.email)}" autocomplete="email" autocapitalize="off" spellcheck="false">
                    <p class="text-xs faint mt-1.5">${CFG.emailEnabled
                        ? `We’ll email you when ${escapeHtml(VA.name||'the VA')} accepts or declines${CFG.mode==='free'?'':' your application'} — and if you’re accepted, your crew center username and password go there too. Optional, but strongly recommended.`
                        : `Optional. ${escapeHtml(VA.name||'The VA')} will use it to send you your crew center sign-in details.`}</p>
                </div>`;
                setNav(true, "Continue");
                const inp=document.getElementById('f_ifc');
                // Re-verify whenever the name changes; verify on blur for convenience.
                inp.addEventListener('input',()=>{ if(inp.value.trim()!==verifyState.name){ verifyState={ name:'', status:'idle' }; DATA.verified=false; DATA.vGrade=null; renderIfcStatus(); } });
                inp.addEventListener('blur',()=>{ if(inp.value.trim() && inp.value.trim()!==verifyState.name) verifyIfc(); });
                inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); verifyIfc(); } });
                renderIfcStatus();
                setTimeout(()=>inp.focus(),50);
            }
            else if(s==='callsign'){
                // The airline is the VA's, not the applicant's: it comes from
                // the callsign they registered, along with the tag and the
                // width. A VA with sub-fleets registers several and the pilot
                // picks one; a VA that registered nothing at all falls back to
                // the old free-text box, because there is no shape to hold them
                // to. The number is the only part that is ever theirs to choose.
                const list = airlines();
                const shape = currentShape();
                const max = reservedMax();
                const airlineField = list.length>1
                    ? `<select id="f_prefix" class="field w-auto font-semibold">${list.map(a=>`<option value="${escapeHtml(a.base)}" ${shape&&a.base===shape.base?'selected':''}>${escapeHtml(a.base)}</option>`).join('')}</select>`
                    : (list.length===1
                        ? `<span id="f_prefix" data-value="${escapeHtml(list[0].base)}" class="surface hair rounded-lg px-3 py-2 text-sm font-semibold whitespace-nowrap">${escapeHtml(list[0].base)}</span>`
                        : `<input id="f_prefix" class="field w-28 text-center font-semibold" placeholder="ACA" value="${escapeHtml(DATA.prefix||CFG.callsignPrefix||VA.code||'')}" maxlength="10">`);
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Pick your callsign number</h2>
                    <p class="text-sm muted mt-1 mb-4">${list.length?`${escapeHtml(VA.name||'This VA')} flies as <b>${escapeHtml(shape?shape.base:'')}</b>${shape&&shape.tag?` with the <b>${escapeHtml(shape.tag)}</b> tag`:''} — you choose the number.`:'Your radio callsign for VA flights.'}</p>
                    <div class="flex items-center gap-2">
                        ${airlineField}
                        <input id="f_number" class="field flex-1 text-center font-semibold tracking-wider" placeholder="${escapeHtml(String(max+1))}" inputmode="numeric" value="${escapeHtml(DATA.number)}" maxlength="5">
                    </div>
                    ${max>0?`<p class="text-xs faint mt-2">Numbers 1–${max} are reserved for senior crew and assigned by staff.</p>`:''}
                    <div class="mt-4 text-center">
                        <div class="text-xs uppercase tracking-wider faint mb-1">Your callsign</div>
                        <div id="csPreview" class="text-2xl font-extrabold tracking-wide accent-text">—</div>
                        <div id="csStatus" class="text-sm mt-2 min-h-[1.25rem]"></div>
                    </div>
                </div>`;
                setNav(true, "Continue");
                const pf=document.getElementById('f_prefix');
                const readPrefix=()=> pf ? (pf.dataset && pf.dataset.value!==undefined ? pf.dataset.value : (pf.value||'')) : '';
                const upd=()=>{
                    DATA.prefix = String(readPrefix()).trim().toUpperCase();
                    const nf=document.getElementById('f_number');
                    nf.value = nf.value.replace(/[^0-9]/g,'');
                    DATA.number = nf.value;
                    document.getElementById('csPreview').textContent = fullCallsign() || '—';
                    renderCsStatus();
                    queueCallsignCheck();
                };
                if(pf && pf.tagName!=='SPAN') pf.addEventListener(pf.tagName==='SELECT'?'change':'input', upd);
                document.getElementById('f_number').addEventListener('input', upd);
                upd();
            }
            else if(s==='grade'){
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Your Infinite Flight grade</h2>
                    <p class="text-sm muted mt-1 mb-4">This VA requires <b>Grade ${CFG.minGrade}+</b>.</p>
                    <div class="grid grid-cols-5 gap-2" id="gradeGrid">
                        ${[1,2,3,4,5].map(g=>`<button data-g="${g}" class="py-3 rounded-lg border hair text-sm font-bold ${DATA.grade===g?'accent-bg text-white':''}">${g}</button>`).join('')}
                    </div>
                </div>`;
                setNav(true, "Continue");
                document.querySelectorAll('#gradeGrid [data-g]').forEach(b=>b.addEventListener('click',()=>{ DATA.grade=+b.getAttribute('data-g'); renderStep(); }));
            }
            else if(s==='requirements'){
                const auto=CFG.reqs.filter(r=>REQ_INFO[r.type]);
                const agree=CFG.reqs.filter(r=>r.type==='agree');
                const haveStats=!!DATA.stats;
                const autoHtml = auto.length ? `<ul class="surface hair rounded-lg divide-y hair-soft px-4">${auto.map(reqRowHtml).join('')}</ul>${!haveStats?`<p class="text-xs faint mt-2">We’ll confirm these against your Infinite Flight stats when you submit.</p>`:''}` : '';
                const agreeHtml = agree.length ? `<div class="mt-4 space-y-1">${agree.map(r=>`
                    <label class="flex items-start gap-2.5 text-sm py-1.5 cursor-pointer">
                        <input type="checkbox" data-agree="${escapeHtml(r.label)}" ${DATA.agreed.includes(r.label)?'checked':''} class="mt-0.5 accent-[var(--accent)]">
                        <span>${escapeHtml(r.label)}${r.required?' <span class="accent-text">*</span>':''}</span>
                    </label>`).join('')}</div>` : '';
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Requirements</h2>
                    <p class="text-sm muted mt-1 mb-4">What the ${escapeHtml(VA.name||'VA')} team asks of new pilots.</p>
                    ${autoHtml}${agreeHtml}
                    <p id="reqNote" class="hidden text-sm mt-3 text-red-500"></p>
                </div>`;
                setNav(true, "Continue");
                body.querySelectorAll('[data-agree]').forEach(c=>c.addEventListener('change',()=>{
                    const lbl=c.getAttribute('data-agree');
                    if(c.checked){ if(!DATA.agreed.includes(lbl)) DATA.agreed.push(lbl); }
                    else DATA.agreed=DATA.agreed.filter(x=>x!==lbl);
                }));
            }
            else if(s==='questions'){
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">A few questions</h2>
                    <p class="text-sm muted mt-1 mb-4">From the ${escapeHtml(VA.name||'VA')} team.</p>
                    <div class="space-y-4">${CFG.form.map((q,i)=>`
                        <div>
                            <label class="block text-sm font-medium mb-1.5">${escapeHtml(q.label)}${q.required?' <span class="accent-text">*</span>':''}</label>
                            ${q.type==='textarea'
                                ? `<textarea data-q="${i}" rows="3" class="field">${escapeHtml((DATA.answers[i]&&DATA.answers[i].a)||'')}</textarea>`
                                : `<input data-q="${i}" class="field" value="${escapeHtml((DATA.answers[i]&&DATA.answers[i].a)||'')}">`}
                        </div>`).join('')}</div>
                </div>`;
                setNav(true, "Continue");
            }
            else if(s==='review'){
                const nameCell = DATA.verified
                    ? `${escapeHtml(DATA.ifcName)} <span class="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400 text-xs font-semibold ml-1"><i data-lucide="badge-check" class="w-3.5 h-3.5"></i>verified</span>`
                    : escapeHtml(DATA.ifcName);
                const rows = [['IFC name', nameCell, true], ['Callsign', fullCallsign()||'—']];
                if(DATA.email) rows.push(['Email', DATA.email]);
                if(CFG.minGrade>0 || DATA.grade) rows.push(['Grade', 'Grade '+(DATA.grade||'—')]);
                body.innerHTML = `<div class="step">
                    <h2 class="text-lg font-bold tracking-tight">Review &amp; ${CFG.mode==='free'?'join':'apply'}</h2>
                    <p class="text-sm muted mt-1 mb-4">${CFG.mode==='free'?'You’ll get instant access.':'Staff will review your application.'}</p>
                    <div class="surface hair rounded-lg divide-y hair-soft">
                        ${rows.map(r=>`<div class="flex items-center justify-between px-4 py-2.5 text-sm"><span class="muted">${escapeHtml(r[0])}</span><span class="font-semibold text-right">${r[2]?r[1]:escapeHtml(r[1])}</span></div>`).join('')}
                    </div>
                    <p id="submitNote" class="hidden text-sm mt-3"></p>
                </div>`;
                setNav(true, CFG.mode==='free' ? 'Join now' : 'Submit application');
            }
            document.getElementById('nextBtn').disabled=false;
            clearNote();
            if(window.lucide) lucide.createIcons();
            postHeight();

            // A step is a new screen, so it starts at its top — arriving half
            // way down a form because that is where the last one ended is how
            // an applicant misses the question they are being asked. Framed, the
            // host page owns the scroll and postHeight() has just resized us, so
            // there is nothing here to move.
            if(!EMBED) window.scrollTo({ top:0, behavior: STILL ? 'auto' : 'smooth' });

            // And the caret goes in the first thing to fill in. Not on a phone:
            // there, focusing a field throws the keyboard over the question the
            // step is asking, which is worse than one tap.
            if(!COARSE){
                const first=body.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),textarea,select');
                if(first) first.focus({preventScroll:true});
            }
        }

        /* Enter is Continue.
           Every step of this is one or two fields and a Continue button, and
           pressing Enter after typing is what everybody does. It did nothing —
           there is no <form> here — so the applicant had to reach for the mouse
           on every one of five steps. */
        document.addEventListener('keydown', e=>{
            if(e.key!=='Enter') return;
            const tag=(e.target.tagName||'').toUpperCase();
            if(tag==='TEXTAREA' || tag==='BUTTON' || tag==='A') return;
            const btn=document.getElementById('nextBtn');
            if(!btn || btn.disabled || document.getElementById('nav').classList.contains('hidden')) return;
            e.preventDefault();
            btn.click();
        });

        function readStep(){
            const s = STEPS[cur];
            if(s==='ifc'){ DATA.ifcName = document.getElementById('f_ifc').value.trim(); if(!DATA.ifcName){ shake('f_ifc'); return false; }
                if(verifyState.name===DATA.ifcName && verifyState.status==='notfound'){ shake('f_ifc'); return false; }
                const em=document.getElementById('f_email'); DATA.email = em ? em.value.trim() : '';
                if(DATA.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(DATA.email)){ shake('f_email'); return false; } }
            if(s==='callsign'){
                const pf=document.getElementById('f_prefix');
                DATA.prefix = String(pf ? (pf.dataset && pf.dataset.value!==undefined ? pf.dataset.value : (pf.value||'')) : '').trim().toUpperCase();
                DATA.number = document.getElementById('f_number').value.replace(/[^0-9]/g,'');
                if(!DATA.number){ shake('f_number'); return false; }
                // Held back here rather than at the submit: being told on the
                // last screen that the number you picked four steps ago belongs
                // to somebody else is the whole of what was wrong with this.
                if(isReservedNumber(DATA.number)){
                    const max=reservedMax();
                    toast(`Numbers 1–${max} are reserved for senior crew — pick ${max+1} or above. Staff can assign you one later.`);
                    shake('f_number'); return false;
                }
                if(csState.key===csKey() && csState.status==='taken'){ toast(csState.message||'That callsign is already taken.'); shake('f_number'); return false; }
            }
            if(s==='grade'){ if(!DATA.grade){ return false; } if(DATA.grade<CFG.minGrade){ toast('Grade '+CFG.minGrade+'+ required.'); return false; } }
            if(s==='requirements'){
                const missing=CFG.reqs.filter(r=>r.type==='agree'&&r.required&&!DATA.agreed.includes(r.label));
                const n=document.getElementById('reqNote');
                if(missing.length){ if(n){ n.textContent='Please accept the required item'+(missing.length>1?'s':'')+' to continue.'; n.classList.remove('hidden'); } return false; }
                if(!reqAutoPass()){ if(n){ n.textContent='Your Infinite Flight stats don’t meet these requirements yet.'; n.classList.remove('hidden'); } return false; }
            }
            if(s==='questions'){ DATA.answers = CFG.form.map((q,i)=>({ q:q.label, a:(document.querySelector(`[data-q="${i}"]`)||{}).value?document.querySelector(`[data-q="${i}"]`).value.trim():'' })); for(let i=0;i<CFG.form.length;i++){ if(CFG.form[i].required && !DATA.answers[i].a){ shake(`[data-q="${i}"]`); return false; } } }
            return true;
        }
        /**
         * Say why Continue did nothing.
         *
         * This used to be an empty function — it declared a variable and
         * returned. So an applicant below the VA's minimum grade pressed
         * Continue and got NOTHING: no message, no movement, no hint that the
         * button had even registered. On the one page a prospective pilot meets
         * before anything else.
         *
         * An inline line above the nav rather than a floating toast, because
         * this page is embedded in VAs' own sites in an iframe sized to its
         * content, and a fixed-position element in a short frame is a message
         * posted off the bottom of the screen.
         */
        function toast(msg){
            const n=document.getElementById('navNote');
            if(!n) return;
            n.textContent=msg;
            n.classList.remove('hidden');
            postHeight();
        }
        function clearNote(){ const n=document.getElementById('navNote'); if(n) n.classList.add('hidden'); }

        /**
         * Mark the field that is holding things up.
         *
         * The red used to be permanent: set on the element's own style, never
         * taken off, so a field stayed red after it had been corrected and the
         * form kept accusing you of a mistake you had already fixed. It now
         * clears itself the moment the field is touched.
         */
        function shake(sel){
            const el=sel.startsWith('[')?document.querySelector(sel):document.getElementById(sel);
            if(!el) return;
            el.style.borderColor='#ef4444';
            el.setAttribute('aria-invalid','true');
            const clear=()=>{ el.style.borderColor=''; el.removeAttribute('aria-invalid'); clearNote(); };
            el.addEventListener('input', clear, {once:true});
            el.addEventListener('change', clear, {once:true});
            el.focus();
        }

        async function next(){
            if(!readStep()) return;
            // On the IFC step, make sure we've verified the current name before
            // moving on. If it hasn't been checked yet, check it now and pause so
            // the pilot sees the result (a not-found name won't advance).
            if(STEPS[cur]==='ifc' && verifyState.name!==DATA.ifcName){
                await verifyIfc();
                if(verifyState.status==='notfound') return;
            }
            // Same on the callsign step: if the debounce hasn't fired yet, or a
            // check is still in flight, settle it here and pause on a taken
            // number so they see WHICH number is the problem while it is still
            // the thing on screen. A check we couldn't complete does not block
            // them — /apply runs the same check and will refuse it there.
            if(STEPS[cur]==='callsign'){
                if(csState.key!==csKey() || csState.status==='checking'){
                    clearTimeout(csTimer);
                    await checkCallsign();
                }
                if(csState.key===csKey() && (csState.status==='taken'||csState.status==='reserved')){
                    toast(csState.message||'That callsign isn’t available.');
                    shake('f_number');
                    return;
                }
            }
            if(cur>=STEPS.length-1){ submit(); return; }
            cur++; renderStep();
        }
        function back(){ if(cur>0){ cur--; renderStep(); } }

        async function submit(){
            const btn=document.getElementById('nextBtn'); btn.disabled=true;
            const note=document.getElementById('submitNote');
            const slug=getSlug();
            // Send the resolved airline, not whatever is left in DATA.prefix: on
            // a VA with one registered callsign the applicant never touches the
            // field, so the shape is the only thing that knows which airline
            // this is.
            const shape=currentShape();
            const body={ ifcName:DATA.ifcName, email:DATA.email, callsignPrefix:(shape?shape.base:DATA.prefix), callsignNumber:DATA.number, grade:DATA.grade, answers:DATA.answers, agreed:DATA.agreed };
            try{
                const res=await fetch(`${BACKEND}/api/crew/${encodeURIComponent(slug)}/apply`,{ method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json'}, body:JSON.stringify(body) });
                const d=await res.json().catch(()=>({}));
                if(!res.ok){
                    // A callsign refused HERE was free when they picked it and
                    // has gone since, or our own check never got an answer. The
                    // fix is one field back, so send them to it with the reason
                    // rather than leaving them on a review screen with a red
                    // line about a number they can't see.
                    if(String(d.code||'').startsWith('callsign_')){
                        const i=STEPS.indexOf('callsign');
                        csState={ key:csKey(), status:d.code==='callsign_reserved'?'reserved':'taken', message:d.error||'That callsign isn’t available.', callsign:'' };
                        btn.disabled=false;
                        if(i>=0){ cur=i; renderStep(); toast(d.error||'That callsign isn’t available.'); shake('f_number'); return; }
                    }
                    if(note){ note.textContent=d.error||'Something went wrong. Please try again.'; note.className='text-sm text-red-500 mt-3'; note.classList.remove('hidden'); }
                    btn.disabled=false; return;
                }
                success(d);
            }catch{ if(note){ note.textContent='Couldn’t reach the server. Please try again.'; note.className='text-sm text-red-500 mt-3'; note.classList.remove('hidden'); } btn.disabled=false; }
        }
        // A VA that accepts everyone issues the login on the spot, so the
        // password comes back in the join response. This is the ONLY time it
        // will ever be shown: nothing stores it, not the VA's database and not
        // ours — only its hash. So it is displayed plainly, with the warning it
        // deserves, and repeated by email when they gave an address.
        function credentialsHtml(d){
            const a=d.account;
            if(!a||!a.password) return '';
            return `<div class="surface hair rounded-xl p-4 mt-5 text-left">
                <div class="text-xs uppercase tracking-wider faint mb-1.5 flex items-center gap-1.5"><i data-lucide="key-round" class="w-3.5 h-3.5"></i> Your crew center sign-in</div>
                <div class="text-sm"><span class="muted">Username</span> <b class="font-mono select-all">${escapeHtml(a.username)}</b></div>
                <div class="text-sm mt-0.5"><span class="muted">One-time password</span> <b class="font-mono select-all">${escapeHtml(a.password)}</b></div>
                <p class="text-xs mt-3 text-amber-600 dark:text-amber-400">Write this down now — it is shown once and is stored nowhere. You’ll be asked to choose your own password the first time you sign in.${d.emailed?` We’ve also emailed it to <b>${escapeHtml(DATA.email)}</b>.`:''}</p>
            </div>`;
        }
        function success(d){
            document.getElementById('nav').classList.add('hidden');
            document.getElementById('bar').style.width='100%';
            const accepted = d.status==='accepted';
            const slug=getSlug();
            // Pending applicants get a private status link (no account/email
            // needed) so they can check back for the staff's accept/decline.
            const statusUrl = d.statusToken ? `/crew/${encodeURIComponent(slug)}/status?id=${encodeURIComponent(d.statusToken)}` : '';
            document.getElementById('stepBody').innerHTML = `<div class="step text-center py-4">
                <div class="w-14 h-14 rounded-full ${accepted?'bg-emerald-500':'accent-bg'} text-white grid place-items-center mx-auto mb-4"><i data-lucide="${accepted?'party-popper':'clock'}" class="w-7 h-7"></i></div>
                <h2 class="text-xl font-bold tracking-tight">${accepted?'Welcome aboard!':'Application received'}</h2>
                ${accepted
                    ? `<p class="text-sm muted mt-2">You’re now part of <b>${escapeHtml(VA.name||'the crew')}</b>. Your callsign:</p><div class="text-2xl font-extrabold accent-text mt-2">${escapeHtml(d.callsign||fullCallsign())}</div>
                       ${credentialsHtml(d)}
                       <a href="/crew/${escapeHtml(slug)}" ${EMBED?'target="_top"':''} class="inline-flex items-center gap-1.5 accent-bg text-white text-sm font-semibold px-5 py-2.5 rounded-lg mt-5 hover:opacity-90 transition">${d.account&&d.account.password?'Sign in to the crew center':'Go to the crew center'} <i data-lucide="arrow-right" class="w-4 h-4"></i></a>`
                    : `<p class="text-sm muted mt-2">Thanks, <b>${escapeHtml(DATA.ifcName)}</b>. The ${escapeHtml(VA.name||'VA')} staff will review your application${DATA.email?` and email you at <b>${escapeHtml(DATA.email)}</b> with their decision`:''}.</p>
                       ${statusUrl?`<div class="surface hair rounded-xl p-4 mt-5 text-left">
                          <div class="text-xs uppercase tracking-wider faint mb-1.5 flex items-center gap-1.5"><i data-lucide="bookmark" class="w-3.5 h-3.5"></i> Save your status link</div>
                          <p class="text-sm muted mb-3">Bookmark this to see the VA’s decision and any message they leave you.</p>
                          <div class="flex items-center gap-2">
                            <input id="statusLink" readonly value="${escapeHtml(location.origin+statusUrl)}" class="field flex-1 text-xs" onclick="this.select()">
                            <button onclick="copyStatus()" id="copyBtn" class="shrink-0 accent-bg text-white text-sm font-semibold px-3.5 py-2.5 rounded-lg hover:opacity-90 transition">Copy</button>
                          </div>
                          <a href="${escapeHtml(statusUrl)}" ${EMBED?'target="_top"':''} class="inline-flex items-center gap-1.5 accent-text text-sm font-semibold mt-3 hover:underline">Check status now <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
                       </div>`:''}`}
            </div>`;
            if(window.lucide) lucide.createIcons();
            postHeight();
        }
        function copyStatus(){ const i=document.getElementById('statusLink'); if(!i) return; i.select(); try{ navigator.clipboard.writeText(i.value); }catch{ document.execCommand('copy'); } const b=document.getElementById('copyBtn'); if(b){ const t=b.textContent; b.textContent='Copied'; setTimeout(()=>b.textContent=t,1400); } }

        // ---- Branding + config ----
        function applyBranding(b){
            if(isHex(b.accent)) document.documentElement.style.setProperty('--accent', b.accent);
            // The VA's full design system, when it has one. Matters most here:
            // this form is usually framed inside the VA's own website.
            if(window.CrewBrand) CrewBrand.apply(b);
            if(window.CrewSkin) CrewSkin.applyRecord(b);
            VA={ name:b.name||b.code||'', code:b.code||'' };
            const mono=initials(VA.name, VA.code);
            document.getElementById('mono').textContent=mono;
            if(VA.name){ document.getElementById('vaName').textContent=VA.name; document.title=`Join ${VA.name} — Crew Center`; }
            if(b.logo && isSafeImageUrl(b.logo)){ const el=document.getElementById('logo'); el.src=b.logo; el.classList.remove('hidden'); document.getElementById('mono').classList.add('hidden'); }
            if(b.join){
                const cs=b.join.callsign||{};
                CFG={ mode:b.join.mode||'application', minGrade:b.join.minGrade||0, callsignPrefix:b.join.callsignPrefix||b.code||'',
                    // The shape this VA issues under. A VA on an older backend
                    // sends no `callsign` block at all, which leaves the list
                    // empty and the form on its free-text airline field — the
                    // behaviour it had before any of this.
                    callsign:{
                        airlines:(Array.isArray(cs.airlines)?cs.airlines:[])
                            .map(a=>({ base:String(a.base||'').toUpperCase(), tag:String(a.tag||'').toUpperCase(), digits:Number(a.digits)||3 }))
                            .filter(a=>a.base),
                        reservedMax:(typeof cs.reservedMax==='number'&&cs.reservedMax>=0)?cs.reservedMax:10,
                    },
                    form:Array.isArray(b.join.form)?b.join.form:[], reqs:Array.isArray(b.join.requirements)?b.join.requirements:[], emailEnabled:!!b.join.emailEnabled };
            }
            DATA.prefix = (airlines()[0] && airlines()[0].base) || CFG.callsignPrefix || VA.code || '';
            document.getElementById('joinSub').textContent = CFG.mode==='free' ? 'Instant access' : 'Applications reviewed by staff';
        }
        (async function(){
            const slug=getSlug();
            if(slug){
                try{
                    const res=await fetch(`${BACKEND}/api/va-ads/by-slug/${encodeURIComponent(slug)}`,{headers:{Accept:'application/json'}});
                    if(res.ok) applyBranding(await res.json());
                }catch{}
            }
            // Preview fallback via query overrides (?name/accent + &free / &grade / &q=)
            const q=new URLSearchParams(location.search);
            if(!slug && (q.get('name')||q.get('accent'))){
                applyBranding({ name:q.get('name')||'', code:(q.get('va')||'').toUpperCase(), accent:q.get('accent')||'', join:{ mode:q.get('mode')||'application', minGrade:+(q.get('minGrade')||0), callsignPrefix:q.get('prefix')||'', form:(q.get('q')||'').split('|').filter(Boolean).map(l=>({label:l,type:'text',required:false})) } });
            }
            buildSteps(); cur=0; renderStep();
            addEventListener('resize', postHeight);
            // A brand typeface arrives after first paint and reflows the form,
            // so re-post the height once it lands or the host frame stays short.
            if(document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight).catch(()=>{});
            if(window.CrewBrand) CrewBrand.onMode(postHeight);
        })();
    </script>
</body>
</html>
