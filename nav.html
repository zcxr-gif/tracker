<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbus A320 Navigation Display Simulation</title>
    <style>
        /* --- Imports & Variables --- */
        @import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap');
        
        :root {
            --bg-body: #1a1a1a;
            --bg-panel: #111827;   /* gray-900 */
            --bg-bezel: #1f2937;   /* gray-800 */
            --border-main: #374151; /* gray-700 */
            --border-dark: #111827; /* gray-900 */
            --screw-color: #4b5563; /* gray-600 */
            
            --text-main: #e5e7eb;   /* gray-200 */
            --text-muted: #9ca3af;  /* gray-400 */
            --text-dim: #6b7280;    /* gray-500 */
            
            --accent-green: #4ade80;
            --accent-cyan: #22d3ee;
            
            --font-mono: 'Inconsolata', monospace;
        }

        /* --- Reset & Base --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            font-family: var(--font-mono);
            color: var(--text-main);
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden; 
        }

        /* --- Layout Components --- */
        .cockpit-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content; /* Fits the fixed bezel size */
            gap: 1rem;
        }

        /* --- Display Unit (The Monitor Bezel) --- */
        /* UPDATED: Fixed dimensions per request */
        .display-bezel {
            position: relative;
            background-color: var(--bg-bezel);
            padding: 0.75rem; /* Slightly reduced padding for smaller frame */
            border-radius: 1rem;
            border: 4px solid var(--border-main);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            
            /* STRICT DIMENSIONS */
            width: 300px;
            height: 242px;
            /* Removed aspect-ratio: 1/1 to allow rectangular shape */
            
            display: flex;
            flex-direction: column;
        }

        /* Decorative Screws */
        .screw {
            position: absolute;
            width: 0.5rem; /* Smaller screws for smaller bezel */
            height: 0.5rem;
            background-color: var(--screw-color);
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
        }
        .screw.tl { top: 0.35rem; left: 0.35rem; }
        .screw.tr { top: 0.35rem; right: 0.35rem; }
        .screw.bl { bottom: 0.35rem; left: 0.35rem; }
        .screw.br { bottom: 0.35rem; right: 0.35rem; }

        /* --- CRT Screen Area --- */
        .crt-container {
            width: 100%;
            height: 100%;
            position: relative;
            border: 2px solid var(--border-dark);
            background: #000;
            border-radius: 12px; /* Slightly smaller radius */
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            display: block; 
            width: 100%;
            height: 100%;
        }

        /* Scanline Overlay */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* --- Control Panel --- */
        .control-panel {
            width: 300px; /* Match the bezel width */
            background-color: var(--bg-panel);
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-main);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            
            display: flex;
            flex-direction: column; /* Force column on small width */
            gap: 1rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .label-text {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Digital Value Displays */
        .value-display {
            font-size: 1rem; 
            width: 2.5rem;
            font-family: var(--font-mono);
        }
        .value-display.green { color: var(--accent-green); }
        .value-display.cyan { color: var(--accent-cyan); }

        /* --- Range Buttons --- */
        .button-group {
            display: flex;
            justify-content: space-between;
            background-color: var(--bg-bezel);
            border-radius: 0.25rem;
            padding: 0.25rem;
        }

        .range-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            transition: color 0.2s;
        }

        .range-btn:hover {
            color: #fff;
        }

        .btn-active { color: var(--accent-green); }
        .btn-inactive { color: var(--text-dim); }

        /* --- Footer --- */
        .footer-text {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-top: 0.25rem;
            text-align: center;
        }

        /* --- Form Elements (Sliders) --- */
        input[type=range] {
            -webkit-appearance: none; 
            appearance: none;
            background: transparent; 
            width: 100%;
        }
        
        input[type=range]:focus { outline: none; }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px; /* Smaller thumb */
            width: 14px;
            border-radius: 50%;
            background: var(--accent-green);
            margin-top: -5px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(74, 222, 128, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- Main Cockpit Panel -->
    <div class="cockpit-container">
        
        <!-- Display Unit Bezel (Fixed 300x242) -->
        <div class="display-bezel">
            
            <!-- Screw details -->
            <div class="screw tl"></div>
            <div class="screw tr"></div>
            <div class="screw bl"></div>
            <div class="screw br"></div>

            <!-- The Screen (Canvas) -->
            <div class="crt-container scanlines">
                <canvas id="ndCanvas"></canvas>
            </div>
            
        </div>

        <!-- Control Panel (Fits width) -->
        <div class="control-panel">
            
            <div class="control-group">
                <label class="label-text">Heading (HDG)</label>
                <div class="input-row">
                    <span class="value-display green" id="hdgVal">270°</span>
                    <input type="range" id="hdgInput" min="0" max="359" value="270">
                </div>
            </div>

            <div class="control-group">
                <label class="label-text">Speed (TAS)</label>
                <div class="input-row">
                    <span class="value-display cyan" id="tasVal">0</span>
                    <input type="range" id="tasInput" min="0" max="450" value="0">
                </div>
            </div>

            <div class="control-group">
                <label class="label-text">Range (NM)</label>
                <div class="button-group">
                    <button onclick="setRange(10)" class="range-btn btn-active" id="btn-10">10</button>
                    <button onclick="setRange(20)" class="range-btn btn-inactive" id="btn-20">20</button>
                    <button onclick="setRange(40)" class="range-btn btn-inactive" id="btn-40">40</button>
                </div>
            </div>
            
        </div>
        
        <p class="footer-text">Use controls to simulate.</p>
    </div>

   <style>
        body.embedded .control-panel {
            display: none !important;
        }
        body.embedded .cockpit-container {
            padding: 0;
            width: fit-content;
        }
        body.embedded .display-bezel {
            box-shadow: none;
            border: none;
            border-radius: 0;
            padding: 0;
            background: transparent;
            /* Keep dimensions rigid even in embedded mode if desired, 
               or remove this line if embedded should be fluid. 
               Sticking to request for fixed size: */
            width: 300px;
            height: 242px;
        }
        body.embedded .screw { display: none; }
        body.embedded .crt-container {
            border-radius: 0;
            border: none;
        }
    </style>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('ndCanvas');
        const ctx = canvas.getContext('2d');
        
        // SCALE FACTOR:
        // Since the physical screen is small (300x242), we need to ensure the
        // drawing logic doesn't create elements that are too microscopic.
        // 1.0 is standard relative to canvas size.
        const GLOBAL_SCALE = 0.85; 

        // Check if embedded
        if (window.self !== window.top) {
            document.body.classList.add('embedded');
        }

        let state = {
            heading: 270,
            tas: 0, 
            gs: 0,  
            range: 40,
            windDir: 0,
            windSpd: 0,
            track: 270, 
            time: "00:00",
            simTime: new Date()
        };

        let traffic = [
            { bearing: 30, dist: 15, altDiff: 12, vs: 800 },
            { bearing: 180, dist: 25, altDiff: -5, vs: -500 },
            { bearing: 300, dist: 8, altDiff: 0, vs: 0 },
        ]; 

        // Colors
        const COLORS = {
            bg: '#000000',
            white: '#e6e6e6',
            green: '#00ff00',
            cyan: '#00ffff',
            yellow: '#ffff00',
            magenta: '#ff00ff',
            amber: '#ff9900',
            grey: '#666666'
        };

        // UPDATED RESIZE LOGIC
        function resize() {
            // We want high resolution drawing internally (crisp lines),
            // but we must respect the aspect ratio of the CSS size (300x242).
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            // Use the actual rendered size (from CSS) to determine canvas resolution
            // This ensures 1:1 mapping of drawing aspect ratio to screen aspect ratio
            const width = rect.width || 300;
            const height = rect.height || 242;

            // Multiply by DPR (or fixed 2x) for Retina sharpness
            canvas.width = width * 2;
            canvas.height = height * 2;
        }
        window.addEventListener('resize', resize);
        // Call immediately
        setTimeout(resize, 0);

        function updatePhysics() {
            const now = new Date();
            state.time = now.getUTCHours().toString().padStart(2, '0') + ":" + 
                         now.getUTCMinutes().toString().padStart(2, '0');
        }

        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, w, h);

            // Center origin
            ctx.save();
            ctx.translate(w/2, h/2); 
            ctx.scale(GLOBAL_SCALE, GLOBAL_SCALE);

            // Calculate responsive sizes based on current canvas height
            const scaledH = h / GLOBAL_SCALE;
            const scaledW = w / GLOBAL_SCALE;
            
            // Position adjustments for the wider/shorter aspect ratio
            const arcCenterY = scaledH * 0.45 - (scaledH / 2); 
            const arcCenterX = 0; 
            const arcRadius = scaledH * 0.42; // Slightly larger relative radius since we have width

            // Rotating Map
            ctx.save();
            ctx.translate(arcCenterX, arcCenterY);
            ctx.rotate(-state.heading * Math.PI / 180);
            drawCompassRose(arcRadius);
            drawTraffic(arcRadius);
            ctx.restore();

            // Static Overlays
            drawRangeRings(arcCenterX, arcCenterY, arcRadius);
            drawAircraftSymbol(arcCenterX, arcCenterY);
            drawHeadingPointers(arcCenterX, arcCenterY, arcRadius);
            drawOverlays(scaledW, scaledH); 
            
            ctx.restore();
        }

        function drawCompassRose(radius) {
            ctx.strokeStyle = COLORS.white;
            ctx.fillStyle = COLORS.white;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineWidth = 2; 
            
            // Use relative font sizes
            ctx.font = `bold ${radius * 0.09}px 'Inconsolata', monospace`;

            const tickLenShort = radius * 0.04;
            const tickLenLong = radius * 0.08;

            for (let d = 0; d < 360; d += 5) {
                const rad = d * Math.PI / 180;
                let rel = Math.abs(d - state.heading);
                if (rel > 180) rel = 360 - rel;
                if (rel > 110) continue; 

                const isMajor = (d % 10 === 0);
                const len = isMajor ? tickLenLong : tickLenShort;

                const x1 = Math.sin(rad) * radius;
                const y1 = -Math.cos(rad) * radius;
                const x2 = Math.sin(rad) * (radius - len);
                const y2 = -Math.cos(rad) * (radius - len);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                if (d % 30 === 0) {
                    const textRadius = radius - (radius * 0.18); 
                    const tx = Math.sin(rad) * textRadius;
                    const ty = -Math.cos(rad) * textRadius;
                    
                    ctx.save();
                    ctx.translate(tx, ty);
                    ctx.rotate(state.heading * Math.PI / 180); 
                    let label = (d / 10).toString().padStart(2, '0');
                    if (d === 0) label = "N"; 
                    ctx.fillText(label, 0, 0);
                    ctx.restore();
                }
            }
        }

        function drawRangeRings(cx, cy, radius) {
            ctx.strokeStyle = COLORS.white;
            ctx.setLineDash([5, 5]); 
            ctx.lineWidth = 1; 
            
            // Ring 1
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.5, Math.PI + 0.6, 2 * Math.PI - 0.6);
            ctx.stroke();
            
            // Ring 2
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.75, Math.PI + 0.4, 2 * Math.PI - 0.4);
            ctx.stroke();
            ctx.setLineDash([]); 

            // Labels
            ctx.fillStyle = COLORS.cyan;
            ctx.font = `${radius * 0.06}px 'Inconsolata'`;
            ctx.textAlign = "right";
            
            let midVal = state.range / 2;
            let threeQuarterVal = state.range * 0.75;
            
             const offset = 5;
             ctx.fillText(midVal.toString(), cx - (radius*0.5) - offset, cy - offset); 
             ctx.fillText(threeQuarterVal.toString(), cx - (radius*0.75) - offset, cy - offset);
        }

        function drawAircraftSymbol(cx, cy) {
            ctx.strokeStyle = COLORS.yellow;
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            // Fixed pixel sizes usually look better for the symbol, but we can scale lightly
            const size = 15;
            const tailOffset = 12;
            const tailWidth = 6;
            const centerDot = 2;

            ctx.moveTo(cx, cy - size); ctx.lineTo(cx, cy + size);
            ctx.moveTo(cx - size, cy); ctx.lineTo(cx + size, cy);
            ctx.moveTo(cx - tailWidth, cy + tailOffset); ctx.lineTo(cx + tailWidth, cy + tailOffset);
            ctx.stroke();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(cx, cy, centerDot, 0, Math.PI*2); ctx.fill();
        }

        function drawHeadingPointers(cx, cy, radius) {
            ctx.fillStyle = COLORS.yellow;
            ctx.beginPath();
            
            const arrowHeight = radius * 0.08;
            const arrowWidth = radius * 0.04;
            const topYOffset = radius * 0.02;
            
            const topY = cy - radius + topYOffset; 
            
            ctx.moveTo(cx, topY);
            ctx.lineTo(cx - arrowWidth, topY - arrowHeight);
            ctx.lineTo(cx + arrowWidth, topY - arrowHeight);
            ctx.fill();
            
            const drift = state.track - state.heading;
            const driftRad = drift * Math.PI / 180;
            
            ctx.strokeStyle = COLORS.green;
            ctx.lineWidth = 2;
            
            const endX = cx + radius * Math.sin(driftRad);
            const endY = cy - radius * Math.cos(driftRad);
            
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(endX, endY);
            ctx.stroke();
        }

        function drawTraffic(radius) {
            if (!traffic || traffic.length === 0) return;
            const pxPerNM = radius / state.range;

            traffic.forEach(t => {
                if (t.dist > state.range + 5) return;

                const tX = Math.sin(t.bearing * Math.PI / 180) * (t.dist * pxPerNM);
                const tY = -Math.cos(t.bearing * Math.PI / 180) * (t.dist * pxPerNM);
                
                ctx.fillStyle = COLORS.white;
                ctx.strokeStyle = COLORS.white;
                ctx.lineWidth = 2;
                
                const dSize = 6;
                ctx.beginPath();
                ctx.moveTo(tX, tY - dSize);
                ctx.lineTo(tX + dSize, tY);
                ctx.lineTo(tX, tY + dSize);
                ctx.lineTo(tX - dSize, tY);
                ctx.closePath();
                ctx.stroke();
                
                ctx.font = `bold ${radius * 0.07}px Arial`;
                const altDiff = t.altDiff;
                const sign = altDiff >= 0 ? "+" : "";
                
                const xOffset = 15;
                const yOffset = 5;

                ctx.fillText(sign + altDiff, tX + xOffset, tY - yOffset);
                
                if (t.vs > 500) ctx.fillText("↑", tX + (xOffset + 20), tY - yOffset);
                else if (t.vs < -500) ctx.fillText("↓", tX + (xOffset + 20), tY - yOffset);
            });
        }

        function drawOverlays(w, h) {
            // Use height-relative font size so it scales if we change CSS height later
            const fontSize = h * 0.06; 
            ctx.font = `bold ${fontSize}px 'Inconsolata', monospace`;
            
            const leftM = -w / 2 + 20;
            const topM = -h / 2 + 35;
            const rightM = w / 2 - 20;
            
            const lineSpacing = fontSize * 1.2;
            const labelOffset = fontSize * 2.5;

            // GS / TAS
            ctx.fillStyle = COLORS.green;
            ctx.textAlign = "left";
            ctx.fillText("GS", leftM, topM);
            const gsText = Math.round(state.gs).toString().padStart(3, '0');
            ctx.fillText(gsText, leftM + labelOffset, topM);
            
            ctx.fillText("TAS", leftM, topM + lineSpacing);
            const tasText = Math.round(state.tas).toString().padStart(3, '0');
            ctx.fillText(tasText, leftM + labelOffset, topM + lineSpacing);

            // Wind
            if (state.windSpd > 0) {
                 ctx.fillText(`${state.windDir}°/${state.windSpd}`, leftM, topM + lineSpacing * 2.5);
                 
                 const arrowX = leftM + (fontSize * 4);
                 const arrowY = topM + lineSpacing * 2.2;
                 ctx.save();
                 ctx.translate(arrowX, arrowY);
                 
                 const windRelAngle = (state.windDir - state.heading + 180) * Math.PI / 180;
                 ctx.rotate(windRelAngle);
                 ctx.strokeStyle = COLORS.green;
                 ctx.lineWidth = 2;
                 
                 const halfLine = 10;
                 const headSize = 5;
                 
                 ctx.beginPath();
                 ctx.moveTo(0, -halfLine); ctx.lineTo(0, halfLine);
                 ctx.moveTo(0, halfLine); ctx.lineTo(-headSize, halfLine - headSize);
                 ctx.moveTo(0, halfLine); ctx.lineTo(headSize, halfLine - headSize);
                 ctx.stroke();
                 ctx.restore();
            }

            // Range
            ctx.textAlign = "right";
            ctx.fillStyle = COLORS.cyan; 
            ctx.fillText(state.range + " NM", rightM, topM + lineSpacing * 2); 

            ctx.fillStyle = COLORS.green;
            ctx.fillText("PPOS", rightM, topM);
            
            ctx.fillStyle = COLORS.white;
            ctx.fillText(state.time, rightM, topM + lineSpacing);
            
            // Bottom Center Text
            ctx.textAlign = "center";
            ctx.fillStyle = COLORS.green;
            ctx.font = `bold ${fontSize * 0.9}px 'Inconsolata', monospace`;
            ctx.fillText("GPS PRIMARY", 0, h / 2 - 20); 
        }

        document.getElementById('hdgInput').addEventListener('input', (e) => {
            state.heading = parseInt(e.target.value);
            state.track = parseInt(e.target.value);
            document.getElementById('hdgVal').innerText = state.heading.toString().padStart(3, '0') + "°";
        });

        document.getElementById('tasInput').addEventListener('input', (e) => {
            state.tas = parseInt(e.target.value);
            state.gs = state.tas; 
            document.getElementById('tasVal').innerText = state.tas;
        });
        
        window.setRange = function(r) {
            state.range = r;
            [10, 20, 40].forEach(val => {
                const btn = document.getElementById(`btn-${val}`);
                if(btn) {
                    if (val === r) {
                        btn.classList.remove('btn-inactive');
                        btn.classList.add('btn-active');
                    } else {
                        btn.classList.add('btn-inactive');
                        btn.classList.remove('btn-active');
                    }
                }
            });
        };

        window.setRange(40);
        document.getElementById('hdgVal').innerText = state.heading.toString().padStart(3, '0') + "°";
        document.getElementById('tasVal').innerText = state.tas;

        function animate() {
            if (window.self === window.top) {
                updatePhysics();
            }
            draw();
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.heading !== undefined) state.heading = data.heading;
            if (data.track !== undefined) state.track = data.track;
            if (data.tas !== undefined) state.tas = data.tas;
            if (data.gs !== undefined) state.gs = data.gs;
            if (data.windDir !== undefined) state.windDir = data.windDir;
            if (data.windSpd !== undefined) state.windSpd = data.windSpd;
            if (data.range !== undefined) {
                 state.range = data.range;
                 window.setRange(data.range); 
            }
            if (data.traffic && Array.isArray(data.traffic)) {
                traffic = data.traffic;
            }
        });
    </script>
</body>
</html>
