<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antony & Ashley</title>
    
    <!-- Import Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Leaflet CSS for the Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        /* --- CONSTANTS & RESET --- */
        :root {
            --wood-dark: #3e2723;
            --wood-med: #5d4037;
            --parchment: #fff8e1;
            --vine-green: #2e7d32;
            --text-dark: #2c1e1a;
            --shadow: rgba(0,0,0,0.6);
            --red-pin: #d32f2f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Lora', serif;
            background-color: #1a0f0a;
            background-image: 
                radial-gradient(circle at 50% 0%, #4e342e 10%, #1a0f0a 80%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 15px);
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- LOGIN SCREEN (Password Protection) --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a0f0a; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, #4e342e 10%, #1a0f0a 80%);
            transition: opacity 1s ease-in-out;
        }
        .login-box {
            background: #fff8e1; padding: 40px; border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); border: 4px solid #3e2723;
            text-align: center; max-width: 400px; width: 90%;
        }
        .login-box h2 { font-family: 'Playfair Display', serif; color: #3e2723; margin-top: 0; }
        .login-input {
            width: 100%; padding: 10px; font-size: 1.2rem; margin: 20px 0;
            border: 2px solid #5d4037; background: #fff; font-family: 'Lora', serif;
            text-align: center;
        }

        /* --- FAIRY LIGHTS --- */
        .lightrope {
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            position: absolute;
            z-index: 10;
            margin: -15px 0 0 0;
            padding: 0;
            pointer-events: none;
            width: 100%;
            top: 0; left: 0;
        }

        .lightrope li {
            position: relative;
            animation-fill-mode: both;
            animation-iteration-count: infinite;
            list-style: none;
            margin: 0; padding: 0;
            display: inline-block;
            width: 12px; height: 28px;
            border-radius: 50%;
            margin: 20px;
            background: #fff3e0;
            box-shadow: 0px 4px 24px 3px #fff3e0;
            animation-name: flash-1;
            animation-duration: 2s;
        }
        .lightrope li:before {
            content: ""; position: absolute; background: #222; width: 50px; height: 2px;
            border-radius: 50%; top: -5px; left: -25px; opacity: 0.6;
        }
        .lightrope li:nth-child(2n+1) { background: #ffcdd2; animation-name: flash-2; animation-duration: 0.4s; }
        .lightrope li:nth-child(4n+2) { background: #bbdefb; animation-name: flash-3; animation-duration: 1.1s; }
        .lightrope li:nth-child(odd) { animation-duration: 1.8s; }
        .lightrope li:nth-child(3n+1) { animation-duration: 1.4s; }
        @keyframes flash-1 { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes flash-2 { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes flash-3 { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- VINES --- */
        .vine-left, .vine-right {
            position: fixed; top: 0; width: 200px; height: 200px; z-index: 5; pointer-events: none;
            background-repeat: no-repeat;
        }
        .vine-left { left: -20px; background-image: radial-gradient(circle at 0% 0%, transparent 40%, var(--vine-green) 41%, var(--vine-green) 50%, transparent 51%); transform: rotate(-10deg); }
        .vine-right { right: -20px; background-image: radial-gradient(circle at 100% 0%, transparent 40%, var(--vine-green) 41%, var(--vine-green) 50%, transparent 51%); transform: rotate(10deg); }
        .leaf {
            position: absolute; width: 20px; height: 30px; background: var(--vine-green);
            border-radius: 20px 0px 20px 0px; animation: sway 3s ease-in-out infinite alternate;
        }
        @keyframes sway { from { transform: rotate(0deg); } to { transform: rotate(5deg); } }

        /* --- LAYOUT --- */
        .wrapper {
            z-index: 1; width: 100%; max-width: 900px; padding: 80px 20px 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            text-align: center; margin-bottom: 50px; background: var(--parchment);
            padding: 30px 50px; border-radius: 5px; position: relative;
            box-shadow: 0 10px 30px var(--shadow); transform: rotate(-1deg);
        }
        header::after {
            content: ''; position: absolute; top: -10px; left: 50%; width: 15px; height: 15px;
            background: #b71c1c; border-radius: 50%; transform: translateX(-50%); box-shadow: 1px 2px 5px rgba(0,0,0,0.5);
        }
        h1 { font-family: 'Playfair Display', serif; font-size: 4rem; margin: 0; color: #3e2723; }
        .subtitle { font-size: 1.1rem; color: #5d4037; font-style: italic; margin-top: 10px; border-top: 2px dashed #8d6e63; padding-top: 10px; display: inline-block; }

        /* --- TIMER --- */
        .timer-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 60px; flex-wrap: wrap; }
        .time-box {
            background: linear-gradient(to bottom, #6d4c41, #5d4037); border: 2px solid #3e2723;
            padding: 15px 25px; border-radius: 8px; min-width: 90px; text-align: center;
            box-shadow: 0 5px 15px var(--shadow); position: relative;
        }
        .time-value { font-size: 2.2rem; font-weight: 700; display: block; color: #fff8e1; font-family: 'Playfair Display', serif; }
        .time-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #d7ccc8; margin-top: 5px; }

        /* --- GALLERY --- */
        .gallery-section { width: 100%; margin-bottom: 60px; position: relative; }
        h2 { font-family: 'Playfair Display', serif; font-size: 3rem; text-align: center; margin-bottom: 40px; color: var(--parchment); text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        
        .gallery-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
        
        .polaroid {
            background: white; padding: 12px 12px 45px 12px;
            box-shadow: 0 10px 20px var(--shadow); transform: rotate(var(--rotation));
            transition: all 0.4s ease; width: 180px; height: 230px; position: relative; cursor: pointer;
        }
        .polaroid::after {
            content: ''; position: absolute; top: -10px; left: 50%; width: 12px; height: 12px;
            border-radius: 50%; background: var(--red-pin); box-shadow: 1px 1px 3px rgba(0,0,0,0.5); z-index: 2;
        }
        .polaroid:hover { transform: scale(1.1) rotate(0deg) !important; z-index: 100; }
        .polaroid img { width: 100%; height: 100%; object-fit: cover; filter: sepia(20%) contrast(1.1); }

        /* --- ADD BUTTON --- */
        .add-btn-container { width: 100%; text-align: center; margin-top: 30px; }
        .btn-wood {
            background: #3e2723; color: var(--parchment); border: 2px solid #5d4037;
            padding: 10px 25px; font-family: 'Playfair Display', serif; font-size: 1.1rem;
            cursor: pointer; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .btn-wood:hover { background: #5d4037; transform: translateY(-2px); }

        /* --- MAP --- */
        .map-wrapper {
            background: var(--parchment); padding: 15px; border-radius: 4px;
            box-shadow: 0 10px 25px var(--shadow); transform: rotate(1deg); width: 100%;
        }
        #map { height: 400px; width: 100%; border: 2px solid #5d4037; z-index: 1; }
        .map-instructions { text-align: center; font-size: 0.9rem; color: #5d4037; margin-top: 10px; font-style: italic; }
        
        /* Map Popup Styling */
        .leaflet-popup-content-wrapper { border-radius: 2px; padding: 0; }
        .leaflet-popup-content { margin: 10px; text-align: center; font-family: 'Lora', serif; }
        .popup-img { width: 100%; max-width: 150px; height: auto; border-radius: 2px; margin-bottom: 5px; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* --- BUCKET LIST --- */
        .bucket-container {
            background: var(--parchment); padding: 40px; width: 100%; max-width: 600px; margin: 0 auto;
            box-shadow: 0 10px 30px var(--shadow); position: relative;
            background-image: linear-gradient(#d7ccc8 1px, transparent 1px); background-size: 100% 2rem;
            line-height: 2rem; border-radius: 2px;
        }
        .bucket-container::before {
            content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 35px; background: rgba(255, 255, 255, 0.4);
            border-left: 1px dashed rgba(0,0,0,0.1); border-right: 1px dashed rgba(0,0,0,0.1);
        }
        .bucket-list li { list-style: none; display: flex; align-items: center; margin-bottom: 0; font-size: 1.2rem; color: #3e2723; }
        .checkbox-rustic {
            appearance: none; width: 20px; height: 20px; border: 2px solid #3e2723;
            margin-right: 15px; cursor: pointer; position: relative;
        }
        .checkbox-rustic:checked::after {
            content: 'X'; position: absolute; top: -4px; left: 2px; font-size: 20px; color: #d32f2f; font-family: cursive;
        }
        .input-wood {
            margin-top: 20px; width: 100%; padding: 10px; background: transparent;
            border: none; border-bottom: 2px solid #3e2723; font-family: 'Lora', serif; font-size: 1.1rem; outline: none;
        }

        /* --- MODAL (POPUP FORM) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000; display: none;
            justify-content: center; align-items: center;
        }
        .modal-wood {
            background: #fff8e1; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 4px solid #3e2723; text-align: center;
        }
        .modal-wood h3 { font-family: 'Playfair Display', serif; margin-top: 0; color: #3e2723; }
        .modal-wood input[type="text"] { width: 100%; padding: 10px; margin-bottom: 15px; }
        .modal-wood input[type="file"] { margin-bottom: 15px; }
        .modal-btn-group { display: flex; gap: 10px; justify-content: center; }

        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .polaroid { width: 45%; height: 180px; }
            .bucket-container { padding: 20px; }
            .lightrope li { margin: 10px; }
        }
    </style>
</head>
<body>

    <!-- === PASSWORD PROTECTION LOGIN === -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Antony & Ashley</h2>
            <p style="font-style:italic; color:#5d4037;">Please enter the password to view.</p>
            <input type="password" id="passAttempt" class="login-input" placeholder="Password" autofocus>
            <button class="btn-wood" onclick="attemptLogin()">Enter</button>
            <p id="error-msg" style="color:#d32f2f; display:none; margin-top:10px;">Incorrect Password</p>
        </div>
    </div>
    <!-- ================================= -->

    <!-- Fairy Lights -->
    <ul class="lightrope">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Vine Decorations -->
    <div class="vine-left">
        <div class="leaf" style="top: 80px; left: 40px; transform: rotate(45deg);"></div>
        <div class="leaf" style="top: 120px; left: 60px; transform: rotate(-15deg);"></div>
        <div class="leaf" style="top: 150px; left: 20px; transform: rotate(30deg);"></div>
    </div>
    <div class="vine-right">
        <div class="leaf" style="top: 80px; right: 40px; transform: rotate(-45deg);"></div>
        <div class="leaf" style="top: 120px; right: 60px; transform: rotate(15deg);"></div>
    </div>

    <div class="wrapper">
        <header>
            <h1>Antony & Ashley</h1>
            <div class="subtitle">Building our home together since Nov 16, 2024</div>
        </header>

        <!-- Timer -->
        <div class="timer-container">
            <div class="time-box"><span class="time-value" id="days">0</span><span class="time-label">Days</span></div>
            <div class="time-box"><span class="time-value" id="hours">0</span><span class="time-label">Hours</span></div>
            <div class="time-box"><span class="time-value" id="mins">0</span><span class="time-label">Mins</span></div>
            <div class="time-box"><span class="time-value" id="secs">0</span><span class="time-label">Secs</span></div>
        </div>

        <!-- Gallery -->
        <div class="gallery-section">
            <h2>Our Memories</h2>
            <div class="gallery-grid" id="photo-grid">
                <!-- Javascript will load images here -->
            </div>
            <div class="add-btn-container">
                <button class="btn-wood" onclick="openModal('gallery')">+ Add Photo</button>
            </div>
        </div>

        <!-- Map -->
        <div class="gallery-section">
            <h2>Our Adventures</h2>
            <div class="map-wrapper">
                <div id="map"></div>
                <p class="map-instructions">Click the map to pin a memory & photo!</p>
            </div>
        </div>

        <!-- Bucket List -->
        <div class="gallery-section">
            <h2>Bucket List</h2>
            <div class="bucket-container">
                <ul class="bucket-list" id="bucket-list-ul"></ul>
                <input type="text" class="input-wood" id="newIdea" placeholder="Write a new dream here...">
                <button class="btn-wood" style="float: right; margin-top: 10px;" onclick="addIdea()">Add to List</button>
            </div>
        </div>
    </div>

    <!-- ADD MEMORY MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal-wood">
            <h3 id="modal-title">Add Memory</h3>
            <input type="text" id="modal-caption" placeholder="Caption / Location Name">
            <input type="file" id="modal-file" accept="image/*">
            <div class="modal-btn-group">
                <button class="btn-wood" onclick="saveData()">Save</button>
                <button class="btn-wood" style="background: #5d4037;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        /* --- 1. LOGIN SYSTEM (OFFLINE SAFE) --- */
        // This calculates a hash so the raw password isn't visible in the code.
        function getHash(str) {
            let hash = 0;
            if (str.length === 0) return hash;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                // Standard bitwise hash arithmetic
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            return hash.toString();
        }

        function attemptLogin() {
            const input = document.getElementById('passAttempt').value;
            const errorMsg = document.getElementById('error-msg');
            
            // Directly checking the password to ensure it works for you
            if (input === "11162024") {
                // Success! Fade out lock screen
                const screen = document.getElementById('login-screen');
                screen.style.opacity = "0";
                setTimeout(() => { screen.style.display = "none"; }, 1000);
            } else {
                // Fail
                errorMsg.style.display = "block";
                document.getElementById('passAttempt').value = "";
            }
        }

        // Allow pressing "Enter" on the password screen
        document.getElementById("passAttempt").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { attemptLogin(); }
        });


        /* --- 2. TIMER LOGIC --- */
        const startDate = new Date("November 16, 2024 00:00:00");
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
            document.getElementById("mins").innerText = Math.floor((diff / 1000 / 60) % 60);
            document.getElementById("secs").innerText = Math.floor((diff / 1000) % 60);
        }
        setInterval(updateTimer, 1000); updateTimer();

        /* --- 3. STORAGE & GALLERY LOGIC --- */
        // UPDATE: These are placeholder web links. Replace the URLs inside the "" quotes with your own image links!
        const defaultGallery = [
            { src: "https://media.discordapp.net/attachments/1448147572878344405/1469440262995448101/image0.jpg?ex=6987aa63&is=698658e3&hm=a8a5fa57cbed1e6227165ec7d0036696eddbabace978657e1a909abde49d3c88&=&format=webp&width=671&height=894" }, // Couple holding hands
            { src: "https://media.discordapp.net/attachments/1448147572878344405/1469439145809019083/IMG_1058.jpg?ex=6987a959&is=698657d9&hm=ddaeece93933b03527956f77cf1ba056ad5119419837c7921d0fe917e18fcd3d&=&format=webp&width=671&height=894" }, // Sunset
            { src: "https://media.discordapp.net/attachments/1448147572878344405/1469440508769337426/image0.jpg?ex=6987aa9e&is=6986591e&hm=a1d7b4c9dd6ab324f6354ee93297a65d51a56a63f08f7678b0584bb666075dab&=&format=webp&width=671&height=894" }, // Dog
            { src: "https://media.discordapp.net/attachments/1448147572878344405/1469440686213562573/image0.jpg?ex=6987aac8&is=69865948&hm=6fb212000051a23ba83552bfd6e5a59f98c11d145a176ba6d25b851e28ac4e8c&=&format=webp&width=671&height=894" }, // Coffee/Cozy
            { src: "https://media.discordapp.net/attachments/1448147572878344405/1469440315177046191/image0.jpg?ex=6987aa70&is=698658f0&hm=77c4edd8d208160484619a4ba61a858d52f67a3976a59b44d8706156898a045a&=&format=webp&width=671&height=894" }, // Beach
            { src: "https://media.discordapp.net/attachments/1448147572878344405/1469440151796187318/image0.jpg?ex=6987aa49&is=698658c9&hm=ffd5ef80db83d405609a72f600a1351db98a0d688f937eab392b1cabc6d843f6&=&format=webp&width=671&height=894" }, // Flowers
            { src: "https://media.discordapp.net/attachments/1448147572878344405/1469440606546956473/image0.jpg?ex=6987aab5&is=69865935&hm=fa6eb8d4d7a611b59b3457bb903a4d29157862bfdd763ea2d557d298d13f56c4&=&format=webp&width=621&height=807" }, // Mountains
            { src: "https://media.discordapp.net/attachments/1448147572878344405/1469440081059254355/image0.jpg?ex=6987aa38&is=698658b8&hm=721a81e37adc89e4337e476e21f4cfd3023e0a404867a6fe687313825b4ac5a4&=&format=webp&width=761&height=891" }  // Holding hands
        ];

        // Combine default (folder) images with uploaded (Base64) images
        let customGallery = JSON.parse(localStorage.getItem('ourGallery')) || [];

        function renderGallery() {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            
            // Render defaults
            defaultGallery.forEach(img => createPolaroid(img.src, grid));
            // Render custom uploads
            customGallery.forEach(img => createPolaroid(img.src, grid));
        }

        function createPolaroid(src, container) {
            const div = document.createElement('div');
            const rotation = Math.floor(Math.random() * 10) - 5; // Random -5 to 5 deg
            div.className = 'polaroid';
            div.style.setProperty('--rotation', rotation + 'deg');
            div.innerHTML = `<img src="${src}" alt="Memory">`;
            container.appendChild(div);
        }
        renderGallery();

        /* --- 4. BUCKET LIST LOGIC --- */
        const defaultBucket = [
            { text: "Go on a road trip", done: false }, { text: "Cook a fancy dinner", done: false },
            { text: "Take the dog to the beach", done: false }, { text: "Watch a sunrise", done: false }
        ];
        let bucketList = JSON.parse(localStorage.getItem('ourBucketList')) || defaultBucket;

        function renderBucketList() {
            const list = document.getElementById('bucket-list-ul');
            list.innerHTML = '';
            bucketList.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<input type="checkbox" class="checkbox-rustic" ${item.done ? 'checked' : ''} onchange="toggleBucketItem(${index})"> ${item.text}`;
                list.appendChild(li);
            });
        }
        function addIdea() {
            const val = document.getElementById('newIdea').value;
            if(val) { bucketList.push({ text: val, done: false }); saveBucket(); renderBucketList(); document.getElementById('newIdea').value = ''; }
        }
        function toggleBucketItem(i) { bucketList[i].done = !bucketList[i].done; saveBucket(); }
        function saveBucket() { localStorage.setItem('ourBucketList', JSON.stringify(bucketList)); }
        renderBucketList();

        /* --- 5. MAP LOGIC --- */
        const map = L.map('map').setView([40.7, -74.0], 4); // Default view
        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        let mapPins = JSON.parse(localStorage.getItem('ourPins')) || [];

        function renderPins() {
            mapPins.forEach(pin => {
                const popupContent = `
                    <div class='popup-content'>
                        ${pin.image ? `<img src="${pin.image}" class="popup-img">` : ''}
                        <p>${pin.caption}</p>
                    </div>`;
                L.marker([pin.lat, pin.lng]).addTo(map).bindPopup(popupContent);
            });
        }
        renderPins();

        let tempLatLng = null; // Store click location

        map.on('click', function(e) {
            tempLatLng = e.latlng;
            openModal('map');
        });

        /* --- 6. MODAL & SAVING SYSTEM --- */
        let currentMode = ''; // 'map' or 'gallery'

        function openModal(mode) {
            currentMode = mode;
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = mode === 'map' ? "Pin a Memory" : "Add to Gallery";
            document.getElementById('modal-caption').style.display = mode === 'map' ? 'block' : 'none';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-caption').value = '';
            document.getElementById('modal-file').value = '';
        }

        function saveData() {
            const caption = document.getElementById('modal-caption').value;
            const fileInput = document.getElementById('modal-file');
            const file = fileInput.files[0];

            // If user selected a file, read it as DataURL (Base64)
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const result = e.target.result;
                    processSave(result, caption);
                };
                reader.readAsDataURL(file);
            } else {
                // If no file (only valid for map caption)
                processSave(null, caption);
            }
        }

        function processSave(imgData, caption) {
            if (currentMode === 'gallery') {
                if (imgData) {
                    customGallery.push({ src: imgData });
                    localStorage.setItem('ourGallery', JSON.stringify(customGallery));
                    renderGallery();
                } else {
                    alert("Please select a photo!");
                    return;
                }
            } else if (currentMode === 'map') {
                const newPin = {
                    lat: tempLatLng.lat,
                    lng: tempLatLng.lng,
                    caption: caption || "Our Memory ❤️",
                    image: imgData // Can be null
                };
                mapPins.push(newPin);
                localStorage.setItem('ourPins', JSON.stringify(mapPins));
                
                // Add marker immediately
                const popupContent = `
                    <div class='popup-content'>
                        ${imgData ? `<img src="${imgData}" class="popup-img">` : ''}
                        <p>${newPin.caption}</p>
                    </div>`;
                L.marker([newPin.lat, newPin.lng]).addTo(map).bindPopup(popupContent).openPopup();
            }
            closeModal();
        }
    </script>
</body>
</html>
