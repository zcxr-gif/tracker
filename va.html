<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08080b">
    <title>Virtual Airline · InFlight</title>
    <link rel="icon" type="image/x-icon" href="Images/inflightIcon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="va-ui.css">
    <style>
        .live-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            margin-bottom: 18px;
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(74,222,128,0.10) 0%, rgba(74,222,128,0.03) 100%);
            border: 1px solid rgba(74,222,128,0.30);
            color: var(--va-text);
            text-decoration: none;
            transition: border-color 200ms, background 200ms;
        }
        .live-banner:hover {
            border-color: rgba(74,222,128,0.50);
            background: linear-gradient(180deg, rgba(74,222,128,0.14) 0%, rgba(74,222,128,0.04) 100%);
        }
        .live-banner-text { min-width: 0; flex: 1; line-height: 1.4; }
        .live-banner-title {
            font-weight: 700; color: #86efac;
            font-size: 0.86rem; letter-spacing: 0.02em;
            display: flex; align-items: center; gap: 8px;
        }
        .live-banner-sub {
            margin-top: 2px;
            font-size: 0.92rem;
            color: var(--va-text);
        }
        .live-banner-sub .va-mono { color: #fafafa; }
        .live-banner-cta { color: #4ade80; font-size: 0.85rem; flex-shrink: 0; }
        @media (max-width: 480px) {
            .live-banner-cta { display: none; }
        }
        .event-tile {
            background: var(--va-surface-1);
            border: 1px solid var(--va-border);
            border-radius: 16px;
            padding: 16px;
            transition: border-color 200ms, background 200ms, transform 200ms;
            display: flex; flex-direction: column; gap: 8px;
        }
        .event-tile:hover { border-color: var(--va-border-2); background: var(--va-surface-2); transform: translateY(-1px); }
        .event-tile-head {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .event-tile-head h3 {
            margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: -0.01em;
        }
        .event-tile-route {
            color: var(--va-text-2); font-size: 0.92rem;
        }
        .event-tile-route .va-mono { color: var(--va-text); }
        .event-tile-time {
            color: var(--va-text-3); font-size: 0.82rem;
        }
        .event-tile-brief {
            color: var(--va-text-2); font-size: 0.86rem;
            line-height: 1.55;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .event-tile-foot {
            margin-top: 6px;
        }
        .pilot-tile {
            background: var(--va-surface-1);
            border: 1px solid var(--va-border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex; align-items: center; gap: 12px;
            transition: border-color 200ms, background 200ms;
        }
        .pilot-tile:hover { border-color: var(--va-border-2); background: var(--va-surface-2); }
        .pilot-tile-body { min-width: 0; flex: 1; }
        .pilot-tile-name { font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pilot-tile-rank { font-size: 0.78rem; color: var(--va-text-3); margin-top: 2px; }
        .description-card {
            background: var(--va-surface-1);
            border: 1px solid var(--va-border);
            border-radius: 16px;
            padding: 18px 20px;
            color: var(--va-text);
            line-height: 1.65;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .links-row {
            display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px;
        }
    </style>
</head>
<body>
    <header class="va-header">
        <div class="va-header-inner">
            <a href="home.html" class="va-brand">
                <img src="Images/inflight.png" alt="InFlight">
                <span>InFlight</span>
                <span class="va-brand-tag">Partnership</span>
            </a>
            <nav class="va-nav">
                <a href="events.html"><i class="fa-solid fa-calendar"></i><span>Events</span></a>
                <a href="va-apply.html"><i class="fa-solid fa-id-badge"></i><span>Apply</span></a>
                <a href="home.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
            </nav>
        </div>
    </header>

    <main class="va-main" id="content">
        <div class="va-gate-wrap" id="loading-state">
            <div style="text-align:center; color: var(--va-text-2);">
                <div class="va-spinner va-spinner-light" style="display:inline-block; width:24px; height:24px;"></div>
                <div style="margin-top: 12px; font-size: 0.9rem;">Loading…</div>
            </div>
        </div>
    </main>

    <script type="module">
        import {
            getVaBySlug, listPilots, listEventsForVa, formatEventTime, isLive
        } from './vaService.js';

        const content = document.getElementById('content');

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function renderGate({ icon, title, sub, ctaText, ctaHref }) {
            content.innerHTML = `
                <div class="va-gate-wrap">
                    <div class="va-gate-card">
                        <div class="va-gate-icon"><i class="fa-solid ${icon}"></i></div>
                        <h2 class="va-gate-title">${escapeHtml(title)}</h2>
                        <p class="va-gate-sub">${escapeHtml(sub)}</p>
                        <div class="va-gate-actions">
                            <a href="${ctaHref}" class="va-btn va-btn-primary">
                                <i class="fa-solid fa-calendar"></i> ${escapeHtml(ctaText)}
                            </a>
                        </div>
                    </div>
                </div>`;
        }

        function renderTombstone(va) {
            renderGate({
                icon: 'fa-hourglass-end',
                title: `${va.name} is no longer active`,
                sub: 'This virtual airline has been inactive for over 60 days and is no longer accepting new events through InFlight.',
                ctaText: 'Browse active events',
                ctaHref: 'events.html'
            });
        }

        function renderNotFound() {
            renderGate({
                icon: 'fa-circle-question',
                title: 'No such VA',
                sub: "We couldn't find a virtual airline with that link.",
                ctaText: 'Browse events',
                ctaHref: 'events.html'
            });
        }

        function setTab(name) {
            document.querySelectorAll('.va-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
            const ids = ['about','events','roster'];
            ids.forEach(t => {
                const el = document.getElementById('tab-' + t);
                if (el) el.classList.toggle('va-hidden', t !== name);
            });
        }

        async function boot() {
            const slug = new URLSearchParams(location.search).get('slug');
            if (!slug) { renderNotFound(); return; }
            const va = await getVaBySlug(slug);
            if (!va) { renderNotFound(); return; }
            if (va.tombstone) { renderTombstone(va); return; }

            const [pilots, events] = await Promise.all([
                listPilots(va.id),
                listEventsForVa(va.id)
            ]);

            const approvedEvents = events.filter(e => e.status === 'approved');
            const liveEvent = approvedEvents.find(isLive);
            const upcoming = approvedEvents.filter(e => !isLive(e));

            const hasDescription = !!va.description;
            const hasLinks = !!(va.website || va.discord);

            content.innerHTML = `
                ${liveEvent ? `
                <a href="events.html#${escapeHtml(liveEvent.id)}" class="live-banner">
                    <span class="va-live-dot"></span>
                    <div class="live-banner-text">
                        <div class="live-banner-title">HAPPENING NOW</div>
                        <div class="live-banner-sub">
                            ${escapeHtml(liveEvent.name)} ·
                            <span class="va-mono">${escapeHtml(liveEvent.origin_icao)}</span>
                            →
                            <span class="va-mono">${escapeHtml(liveEvent.destination_icao)}</span>
                        </div>
                    </div>
                    <span class="live-banner-cta"><i class="fa-solid fa-arrow-right"></i></span>
                </a>` : ''}

                <section class="va-section">
                    <div class="va-hero">
                        <div class="va-hero-main">
                            ${va.logo_url
                                ? `<img class="va-hero-logo" src="${escapeHtml(va.logo_url)}" alt="">`
                                : `<div class="va-hero-logo"><i class="fa-solid fa-plane"></i></div>`}
                            <div class="va-hero-body">
                                <div class="va-hero-title-row">
                                    <h1 class="va-h1">${escapeHtml(va.name)}</h1>
                                    ${va.trusted ? `<span class="va-badge va-badge-trusted"><i class="fa-solid fa-shield-halved"></i> Trusted partner</span>` : ''}
                                </div>
                                <div class="va-hero-meta">
                                    <span class="va-mono">${escapeHtml(va.callsign)}</span>
                                    ${va.hub ? `<span class="sep">·</span><span>Hub ${escapeHtml(va.hub)}</span>` : ''}
                                    ${va.region ? `<span class="sep">·</span><span>${escapeHtml(va.region)}</span>` : ''}
                                    ${va.fleet ? `<span class="sep">·</span><span>${escapeHtml(va.fleet)}</span>` : ''}
                                </div>
                                ${hasLinks ? `<div class="links-row">
                                    ${va.website ? `<a class="va-btn va-btn-ghost va-btn-sm" href="${escapeHtml(va.website)}" target="_blank" rel="noopener"><i class="fa-solid fa-globe"></i> Website</a>` : ''}
                                    ${va.discord ? `<a class="va-btn va-btn-ghost va-btn-sm" href="${escapeHtml(va.discord)}" target="_blank" rel="noopener"><i class="fa-brands fa-discord"></i> Discord</a>` : ''}
                                </div>` : ''}
                            </div>
                        </div>

                        <div class="va-stats">
                            <div class="va-stat">
                                <div class="va-stat-label">Pilots</div>
                                <div class="va-stat-value">${pilots.length}</div>
                                <div class="va-stat-sub">${pilots.length === 1 ? 'On the roster' : 'On the roster'}</div>
                            </div>
                            <div class="va-stat">
                                <div class="va-stat-label">Upcoming events</div>
                                <div class="va-stat-value">${upcoming.length}</div>
                                <div class="va-stat-sub">Open for sign-ups</div>
                            </div>
                            <div class="va-stat">
                                <div class="va-stat-label">Status</div>
                                <div class="va-stat-value" style="font-size:1.15rem;">${liveEvent ? 'Live now' : (va.trusted ? 'Trusted' : 'Active')}</div>
                                <div class="va-stat-sub">${liveEvent ? 'Event in progress' : 'Accepting new events'}</div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="va-section">
                    <div class="va-tabs-wrap">
                        <div class="va-tabs" role="tablist">
                            ${hasDescription ? `<button class="va-tab active" data-tab="about" role="tab"><i class="fa-solid fa-circle-info"></i> About</button>` : ''}
                            <button class="va-tab ${hasDescription ? '' : 'active'}" data-tab="events" role="tab"><i class="fa-solid fa-calendar-days"></i> Events <span class="va-tab-count">${approvedEvents.length}</span></button>
                            <button class="va-tab" data-tab="roster" role="tab"><i class="fa-solid fa-user-group"></i> Roster <span class="va-tab-count">${pilots.length}</span></button>
                        </div>
                    </div>
                </section>

                ${hasDescription ? `
                <section id="tab-about" class="va-section">
                    <div class="description-card">${escapeHtml(va.description)}</div>
                </section>` : ''}

                <section id="tab-events" class="va-section ${hasDescription ? 'va-hidden' : ''}">
                    ${approvedEvents.length === 0
                        ? `<div class="va-empty">
                                <i class="va-empty-icon fa-solid fa-calendar-xmark"></i>
                                <div class="va-empty-title">No upcoming events</div>
                                <div class="va-empty-sub">Check back soon — this VA hasn't published anything yet.</div>
                           </div>`
                        : `<div class="va-grid va-grid-2">${approvedEvents.map(ev => `
                            <div class="event-tile" id="${escapeHtml(ev.id)}">
                                <div class="event-tile-head">
                                    <h3>${escapeHtml(ev.name)}</h3>
                                    <span class="va-badge va-badge-server">${escapeHtml(ev.server)}</span>
                                    ${isLive(ev) ? `<span class="va-badge va-badge-live"><span class="va-live-dot" style="margin-right:2px;"></span> Live</span>` : ''}
                                </div>
                                <div class="event-tile-route">
                                    <span class="va-mono">${escapeHtml(ev.origin_icao || '')}</span>
                                    <span style="color:var(--va-text-3);">→</span>
                                    <span class="va-mono">${escapeHtml(ev.destination_icao || '')}</span>
                                </div>
                                <div class="event-tile-time">${formatEventTime(ev.start_at)}</div>
                                ${ev.briefing ? `<p class="event-tile-brief">${escapeHtml(ev.briefing)}</p>` : ''}
                                ${ev.signup_url ? `<div class="event-tile-foot">
                                    <a href="${escapeHtml(ev.signup_url)}" target="_blank" rel="noopener" class="va-btn va-btn-accent va-btn-sm">
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Sign up
                                    </a>
                                </div>` : ''}
                            </div>`).join('')}</div>`}
                </section>

                <section id="tab-roster" class="va-section va-hidden">
                    ${pilots.length === 0
                        ? `<div class="va-empty">
                                <i class="va-empty-icon fa-solid fa-user-slash"></i>
                                <div class="va-empty-title">Roster not published</div>
                                <div class="va-empty-sub">This VA hasn't added pilots to their roster yet.</div>
                           </div>`
                        : `<div class="va-grid va-grid-3">${pilots.map(p => `
                            <div class="pilot-tile">
                                <div class="va-avatar"><i class="fa-solid fa-user"></i></div>
                                <div class="pilot-tile-body">
                                    <div class="pilot-tile-name">@${escapeHtml(p.ifc_handle)}</div>
                                    ${p.rank ? `<div class="pilot-tile-rank">${escapeHtml(p.rank)}</div>` : ''}
                                </div>
                            </div>`).join('')}</div>`}
                </section>
            `;

            document.querySelectorAll('.va-tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
        }

        boot();
    </script>
</body>
</html>
