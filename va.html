<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Airline · InFlight</title>
    <link rel="icon" type="image/x-icon" href="Images/inflightIcon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] },
                colors: { background:'#020617', surface:'#0f172a', pro:'#fbbf24', accent:'#38bdf8' } } }
        }
    </script>
    <style>
        body { background:#020617; color:#f8fafc; font-family:Inter,sans-serif; }
        .card { background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:18px; }
        .badge { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:0.72rem; font-weight:600; }
        .badge-trusted { background:rgba(56,189,248,0.15); color:#38bdf8; }
        .badge-server { background:rgba(15,23,42,0.8); color:#cbd5e1; border:1px solid rgba(255,255,255,0.1); font-family:ui-monospace,monospace; text-transform:uppercase; }
    </style>
</head>
<body class="min-h-screen">
    <header class="border-b border-white/5 bg-slate-950/70 backdrop-blur sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="home.html" class="flex items-center gap-3">
                <img src="Images/inflight.png" alt="InFlight" class="h-8 w-8 rounded-md">
                <span class="font-extrabold tracking-tight">InFlight</span>
            </a>
            <nav class="flex items-center gap-4 text-sm">
                <a href="events.html" class="text-slate-400 hover:text-white">Events</a>
                <a href="va-apply.html" class="text-slate-400 hover:text-white">Apply</a>
                <a href="home.html" class="text-slate-400 hover:text-white">Home</a>
            </nav>
        </div>
    </header>

    <main id="content" class="max-w-6xl mx-auto px-6 py-10"></main>

    <script type="module">
        import {
            getVaBySlug, listPilots, listEventsForVa, formatEventTime, isLive
        } from './vaService.js';

        const content = document.getElementById('content');

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function renderTombstone(va) {
            content.innerHTML = `
                <div class="card text-center max-w-xl mx-auto">
                    <i class="fa-solid fa-hourglass-end text-3xl text-slate-500 mb-3"></i>
                    <h1 class="text-2xl font-bold mb-2">${escapeHtml(va.name)} is no longer active</h1>
                    <p class="text-slate-400 text-sm">This virtual airline has been inactive for over 60 days and is no longer accepting new events through InFlight.</p>
                    <a href="events.html" class="mt-5 inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-sm"><i class="fa-solid fa-calendar"></i> Browse active events</a>
                </div>`;
        }

        function renderNotFound() {
            content.innerHTML = `
                <div class="card text-center max-w-xl mx-auto">
                    <i class="fa-solid fa-circle-question text-3xl text-slate-500 mb-3"></i>
                    <h1 class="text-2xl font-bold mb-2">No such VA</h1>
                    <p class="text-slate-400 text-sm">We couldn't find a virtual airline with that link.</p>
                    <a href="events.html" class="mt-5 inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-sm"><i class="fa-solid fa-calendar"></i> Browse events</a>
                </div>`;
        }

        async function boot() {
            const slug = new URLSearchParams(location.search).get('slug');
            if (!slug) { renderNotFound(); return; }
            const va = await getVaBySlug(slug);
            if (!va) { renderNotFound(); return; }
            if (va.tombstone) { renderTombstone(va); return; }

            const [pilots, events] = await Promise.all([
                listPilots(va.id),
                listEventsForVa(va.id)
            ]);

            const approvedEvents = events.filter(e => e.status === 'approved');
            const liveEvent = approvedEvents.find(isLive);

            content.innerHTML = `
                ${liveEvent ? `
                <a href="events.html#${liveEvent.id}" class="block mb-6 card border-emerald-500/40 bg-emerald-500/5">
                    <div class="flex items-center gap-3">
                        <span class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                        <span class="font-bold text-emerald-300">Happening now</span>
                        <span class="text-slate-300">${escapeHtml(liveEvent.name)} · ${escapeHtml(liveEvent.origin_icao)} → ${escapeHtml(liveEvent.destination_icao)}</span>
                    </div>
                </a>` : ''}

                <section class="flex items-start gap-6 mb-10 flex-wrap">
                    ${va.logo_url
                        ? `<img src="${escapeHtml(va.logo_url)}" alt="" class="h-24 w-24 rounded-2xl object-cover border border-white/10 bg-slate-800">`
                        : `<div class="h-24 w-24 rounded-2xl bg-slate-800 border border-white/10 flex items-center justify-center text-slate-500 text-3xl"><i class="fa-solid fa-plane"></i></div>`}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-3 flex-wrap">
                            <h1 class="text-4xl font-extrabold tracking-tight">${escapeHtml(va.name)}</h1>
                            ${va.trusted ? `<span class="badge badge-trusted"><i class="fa-solid fa-shield-check"></i> Trusted partner</span>` : ''}
                        </div>
                        <div class="mt-2 text-slate-400">
                            <span class="font-mono">${escapeHtml(va.callsign)}</span>
                            ${va.hub ? ` · Hub <span class="text-slate-200">${escapeHtml(va.hub)}</span>` : ''}
                            ${va.region ? ` · ${escapeHtml(va.region)}` : ''}
                            ${va.fleet ? ` · ${escapeHtml(va.fleet)}` : ''}
                        </div>
                        <div class="mt-3 flex flex-wrap gap-3 text-sm">
                            ${va.website ? `<a class="text-accent hover:underline" href="${escapeHtml(va.website)}" target="_blank" rel="noopener"><i class="fa-solid fa-globe"></i> Website</a>` : ''}
                            ${va.discord ? `<a class="text-accent hover:underline" href="${escapeHtml(va.discord)}" target="_blank" rel="noopener"><i class="fa-brands fa-discord"></i> Discord</a>` : ''}
                        </div>
                    </div>
                </section>

                ${va.description ? `<section class="mb-10 card whitespace-pre-wrap text-slate-300">${escapeHtml(va.description)}</section>` : ''}

                <section class="mb-10">
                    <h2 class="text-xs font-bold tracking-widest text-slate-500 uppercase mb-4">Upcoming events</h2>
                    ${approvedEvents.length === 0
                        ? `<div class="card text-sm text-slate-500">No upcoming events.</div>`
                        : `<div class="grid sm:grid-cols-2 gap-4">${approvedEvents.map(ev => `
                            <div class="card" id="${escapeHtml(ev.id)}">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-bold">${escapeHtml(ev.name)}</h3>
                                    <span class="badge badge-server">${escapeHtml(ev.server)}</span>
                                </div>
                                <div class="text-sm text-slate-400 mt-1">${escapeHtml(ev.origin_icao || '')} → ${escapeHtml(ev.destination_icao || '')}</div>
                                <div class="text-xs text-slate-500 mt-1">${formatEventTime(ev.start_at)}</div>
                                ${ev.briefing ? `<p class="mt-3 text-sm text-slate-300 line-clamp-3 whitespace-pre-wrap">${escapeHtml(ev.briefing)}</p>` : ''}
                                ${ev.signup_url ? `<a href="${escapeHtml(ev.signup_url)}" target="_blank" rel="noopener" class="mt-3 inline-flex items-center gap-2 text-sm text-accent hover:underline"><i class="fa-solid fa-arrow-up-right-from-square"></i> Sign up</a>` : ''}
                            </div>`).join('')}</div>`}
                </section>

                <section>
                    <h2 class="text-xs font-bold tracking-widest text-slate-500 uppercase mb-4">Roster · ${pilots.length} pilot${pilots.length === 1 ? '' : 's'}</h2>
                    ${pilots.length === 0
                        ? `<div class="card text-sm text-slate-500">Roster not published yet.</div>`
                        : `<div class="grid sm:grid-cols-2 md:grid-cols-3 gap-3">${pilots.map(p => `
                            <div class="card flex items-center gap-3 py-3">
                                <div class="h-9 w-9 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-slate-400"><i class="fa-solid fa-user"></i></div>
                                <div class="min-w-0">
                                    <div class="font-semibold truncate">@${escapeHtml(p.ifc_handle)}</div>
                                    ${p.rank ? `<div class="text-xs text-slate-500">${escapeHtml(p.rank)}</div>` : ''}
                                </div>
                            </div>`).join('')}</div>`}
                </section>
            `;
        }

        boot();
    </script>
</body>
</html>
