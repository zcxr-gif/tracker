<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Strip</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    /* ------------------------------------------------------------------ *
     *  "Strip" flight window — the third presentation mode.
     *
     *  Legacy is the avionics panel, Simple is the full information window,
     *  Card is the Apple-Maps place card. All three are things you look AT:
     *  they take the screen and the map becomes background. This one is the
     *  opposite — a boarding-pass strip along the bottom that leaves the map
     *  as the thing you are actually watching, carrying only what you want at
     *  a glance: which flight, which airframe, where it is going, and how far
     *  through it is.
     *
     *  Two details are load-bearing rather than decorative:
     *
     *  • The photo RISES ABOVE the bar. That is why the page background is
     *    transparent and the strip is anchored to the bottom with clear space
     *    reserved over it: the aircraft is the subject, and a photo boxed
     *    inside the bar reads as a thumbnail in a list instead. The host gives
     *    the window a transparent shell in this mode (`.info-window.fw-strip`)
     *    so that clear space really is the map.
     *
     *  • Everything moves on one easing curve and one pair of durations,
     *    declared once below. A strip that sits over the map is in the corner
     *    of your eye for the whole flight, so anything that snaps or lurches
     *    is far more noticeable here than inside a window you opened
     *    deliberately.
     *
     *  Fed the same FLIGHT_DATA_UPDATE payload as Simple and Card, so the
     *  host's live-tick path needs nothing new. It reports its own height with
     *  SIMPLE_WINDOW_PEEK_HEIGHT and re-reports it when tapped open, which is
     *  the whole of its expand/collapse — it never asks for the sheet's
     *  expanded detent, because a full-height sheet holding a 180px strip is
     *  not a bigger strip, it is a mostly empty screen.
     * ------------------------------------------------------------------ */

    :root {
        /* One curve, two durations. Every transition on this page uses them. */
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --dur: 0.42s;
        --dur-fast: 0.22s;

        --ink: #f4f7fb;
        --ink-dim: rgba(226, 235, 247, 0.62);
        --ink-faint: rgba(226, 235, 247, 0.40);
        --rule: rgba(255, 255, 255, 0.13);
        --accent: #4da2ff;
        --flown: #ff5a52;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

        /* How far the photo lifts clear of the bar. Also the height of the
           transparent gutter above it, so the lift is never clipped. */
        --lift: 34px;
        --photo-w: 118px;
        --photo-h: 74px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100%;
        /* Transparent on purpose — see the note above. */
        background: transparent;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
    }

    #shell {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        /* Nothing in the gutter should swallow a tap meant for the map. */
        pointer-events: none;
    }

    #bar {
        pointer-events: auto;
        position: relative;
        margin-top: var(--lift);
        padding: 13px 16px calc(11px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(180deg, rgba(28, 46, 74, 0.94), rgba(18, 30, 50, 0.96));
        -webkit-backdrop-filter: blur(26px) saturate(180%);
        backdrop-filter: blur(26px) saturate(180%);
        border-top: 0.5px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 -14px 40px rgba(0, 0, 0, 0.45), inset 0 0.5px 0 rgba(255, 255, 255, 0.16);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background var(--dur) var(--ease);
    }
    #bar:active { background: linear-gradient(180deg, rgba(34, 55, 88, 0.95), rgba(22, 36, 60, 0.97)); }

    /* The accent rail, which doubles as the "this is live" tell: it drifts
       only while the aircraft is moving. */
    #bar::before {
        content: '';
        position: absolute; left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.75;
    }

    /* ── Top row: photo, identity, route ─────────────────────────────── */

    /* The row leaves a column clear on the left for the photo, which is taken
       out of flow below. */
    .row-top {
        display: flex; align-items: flex-end; gap: 13px;
        padding-left: calc(var(--photo-w) + 13px);
    }

    /* The photo. Positioned against the bar rather than laid out in the row,
       so the lift is exactly --lift whatever the text beside it happens to
       measure. In flow, a negative margin-top only lifts it as far as the
       tallest sibling allows, which makes the one detail this mode is built
       around depend on how long an airport code is. */
    #photo-card {
        position: absolute;
        left: 16px;
        top: calc(-1 * var(--lift));
        width: var(--photo-w); height: var(--photo-h);
        border-radius: 10px;
        overflow: hidden;
        background: rgba(9, 15, 26, 0.9);
        border: 1.5px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
        opacity: 0;
        transform: translateY(10px) scale(0.96);
        transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    #photo-card.in { opacity: 1; transform: none; }
    #photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* No photo for this airframe: draw a sky rather than an empty box. */
    #photo-card.empty {
        display: grid; place-items: center;
        background: linear-gradient(160deg, #2c4a72 0%, #1b2a44 100%);
        color: rgba(255, 255, 255, 0.35); font-size: 20px;
    }

    .ident { flex: 1 1 auto; min-width: 0; line-height: 1.45; }
    .ident .line { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
    .ident .k { font-size: 10.5px; font-weight: 600; color: var(--ink-faint); }
    .ident .v {
        font-family: var(--mono); font-size: 13px; font-weight: 700;
        letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis;
    }

    .route { flex: 0 0 auto; text-align: right; }
    .route .codes {
        display: flex; align-items: center; justify-content: flex-end; gap: 9px;
        font-family: var(--mono); font-weight: 800;
        font-size: clamp(19px, 6.4vw, 30px);
        letter-spacing: -0.01em; line-height: 1;
    }
    .route .codes i { font-size: 0.52em; color: var(--ink-dim); }
    .route .glyphs {
        display: flex; align-items: center; justify-content: flex-end; gap: 34px;
        margin-top: 5px; color: rgba(255, 255, 255, 0.55); font-size: 12px;
    }

    /* ── Progress ────────────────────────────────────────────────────── */

    .progress { margin-top: 11px; display: flex; align-items: center; gap: 10px; }
    .progress .end {
        font-family: var(--mono); font-size: 11.5px; font-weight: 700;
        color: var(--ink-dim); flex: 0 0 auto; white-space: nowrap;
    }
    .track {
        flex: 1 1 auto; height: 4px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        overflow: hidden; position: relative;
    }
    .track .fill {
        position: absolute; inset: 0 auto 0 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff8a52, var(--flown));
        width: 0%;
        /* The only long transition on the page, and it earns it: the bar is
           re-rendered on every live tick and a hard jump every few seconds is
           what makes a progress bar look broken. */
        transition: width 0.9s var(--ease);
    }
    .track .dot {
        position: absolute; top: 50%; left: 0;
        width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
        border-radius: 50%; background: #fff;
        box-shadow: 0 0 0 2px var(--flown), 0 2px 6px rgba(0, 0, 0, 0.4);
        transition: left 0.9s var(--ease);
    }

    /* ── The detail drawer ───────────────────────────────────────────── */
    /*
     * Opened by tapping the bar. Animated on max-height rather than height so
     * the content decides its own size, and paired with opacity so the text
     * does not appear before there is room for it.
     */
    #detail {
        max-height: 0; opacity: 0; overflow: hidden;
        transition: max-height var(--dur) var(--ease),
                    opacity var(--dur-fast) var(--ease),
                    margin-top var(--dur) var(--ease);
        margin-top: 0;
    }
    body.open #detail { max-height: 120px; opacity: 1; margin-top: 12px; }

    .cells {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
        background: var(--rule); border-radius: 10px; overflow: hidden;
        border: 0.5px solid var(--rule);
    }
    .cell { background: rgba(255, 255, 255, 0.05); padding: 8px 4px; text-align: center; }
    .cell .l {
        display: block; font-size: 8.5px; font-weight: 800;
        letter-spacing: 0.09em; color: var(--ink-faint); text-transform: uppercase;
    }
    .cell .v { display: block; font-family: var(--mono); font-size: 13.5px; font-weight: 700; margin-top: 2px; }

    .detail-foot {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; margin-top: 8px; font-size: 11px; color: var(--ink-dim);
    }
    .detail-foot .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-foot .acts { display: flex; gap: 7px; flex: 0 0 auto; }
    .detail-foot button {
        background: rgba(255, 255, 255, 0.10); border: 0.5px solid var(--rule);
        color: var(--ink); border-radius: 8px; padding: 6px 11px; cursor: pointer;
        font: 700 11px/1 inherit;
        transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    }
    .detail-foot button:hover { background: rgba(255, 255, 255, 0.19); }
    .detail-foot button:active { transform: scale(0.94); }

    /* The chevron that says the bar opens at all. */
    #grip {
        position: absolute; top: 5px; left: 50%; margin-left: -13px;
        width: 26px; height: 14px; display: grid; place-items: center;
        color: rgba(255, 255, 255, 0.4); font-size: 9px;
        transition: transform var(--dur) var(--ease);
    }
    body.open #grip { transform: rotate(180deg); }

    /* Values that changed on this tick get a brief lift, so a glance at the
       bar tells you it is live without having to watch a number for a while. */
    @keyframes tick { 0% { color: var(--accent); } 100% { color: inherit; } }
    .ticked { animation: tick 1.1s var(--ease); }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
        }
    }

    /* Tight phones: the route code pair is the first thing to give up room. */
    @media (max-width: 380px) {
        :root { --photo-w: 96px; --photo-h: 62px; }
        .ident .v { font-size: 12px; }
        .ident .k { font-size: 9.5px; }
        .route .glyphs { gap: 24px; }
    }
    </style>
</head>
<body>
    <div id="shell">
        <div id="bar">
            <div id="grip"><i class="fa-solid fa-chevron-up"></i></div>

            <div class="row-top">
                <div id="photo-card" class="empty"><i class="fa-solid fa-plane-up"></i></div>

                <div class="ident">
                    <div class="line"><span class="k">Flight num:</span><span class="v" id="v-callsign">—</span></div>
                    <div class="line"><span class="k">Tail num:</span><span class="v" id="v-tail">—</span></div>
                </div>

                <div class="route">
                    <div class="codes">
                        <span id="v-orig">—</span>
                        <i class="fa-solid fa-arrow-right-long"></i>
                        <span id="v-dest">—</span>
                    </div>
                    <div class="glyphs">
                        <i class="fa-solid fa-plane-departure"></i>
                        <i class="fa-solid fa-plane-arrival"></i>
                    </div>
                </div>
            </div>

            <div class="progress">
                <span class="end" id="v-flown">—&nbsp;nm</span>
                <div class="track"><div class="fill" id="v-fill"></div><div class="dot" id="v-dot"></div></div>
                <span class="end" id="v-total">—&nbsp;nm</span>
            </div>

            <div id="detail">
                <div class="cells">
                    <div class="cell"><span class="l">Alt</span><span class="v" id="v-alt">—</span></div>
                    <div class="cell"><span class="l">Speed</span><span class="v" id="v-gs">—</span></div>
                    <div class="cell"><span class="l">V/S</span><span class="v" id="v-vs">—</span></div>
                    <div class="cell"><span class="l">ETA</span><span class="v" id="v-eta">—</span></div>
                </div>
                <div class="detail-foot">
                    <span class="who" id="v-who">—</span>
                    <span class="acts">
                        <button type="button" data-act="follow"><i class="fa-solid fa-crosshairs"></i>&nbsp; Follow</button>
                        <button type="button" data-act="replay"><i class="fa-solid fa-clock-rotate-left"></i>&nbsp; Replay</button>
                    </span>
                </div>
            </div>
        </div>
    </div>

<script>
(function () {
    'use strict';

    // Height the host should give us in each state. Reported rather than
    // assumed, because the host owns the window box on desktop and the sheet
    // detent on mobile — see SIMPLE_WINDOW_PEEK_HEIGHT in flight.js.
    //
    // These two are the opening bid, sent the instant the state changes so the
    // host's resize runs alongside the drawer's rather than after it. The real
    // figure is measured once everything has settled and sent as a correction
    // if it differs, because the bar's height is not a constant: the safe-area
    // inset alone moves it by ~34px between a notched phone and a desktop, and
    // guessing wrong either clips the progress row or leaves a band of window
    // that is not the bar and not the map.
    var H_SHUT = 150;
    var H_OPEN = 244;

    // Anything above the bar is deliberately empty so the photo has somewhere
    // to rise into. It has to be counted, but no more of it than the lift:
    // spare height there is window that swallows taps meant for the map.
    var LIFT = 34;

    var el = function (id) { return document.getElementById(id); };
    var bar = el('bar');
    var photo = el('photo-card');

    var isOpen = false;
    var lastPhotoUrl = '';
    var previous = {};
    var reportedHeight = 0;

    function send(height) {
        var h = Math.round(height);
        if (h === reportedHeight) return;
        reportedHeight = h;
        try {
            window.parent.postMessage({ type: 'SIMPLE_WINDOW_PEEK_HEIGHT', height: h }, '*');
        } catch (_) {}
    }

    function measuredHeight() {
        var h = bar.getBoundingClientRect().height;
        return h > 0 ? h + LIFT : 0;
    }

    function reportHeight() {
        send(isOpen ? H_OPEN : H_SHUT);
        // Correct once the drawer has finished moving and layout is final.
        setTimeout(function () {
            var real = measuredHeight();
            if (real && Math.abs(real - reportedHeight) > 4) send(real);
        }, 520);
    }

    /**
     * Write a value, and flash it when it actually changed.
     *
     * The flash is the point: a strip that sits over the map for a whole
     * flight has to show that it is live without the reader watching a digit
     * long enough to catch it move.
     */
    function put(id, value) {
        var node = el(id);
        if (!node) return;
        var text = (value == null || value === '') ? '—' : String(value);
        if (node.textContent === text) return;
        node.textContent = text;
        if (previous[id] !== undefined) {
            node.classList.remove('ticked');
            // Reflow so the animation restarts rather than being ignored as
            // "already running".
            void node.offsetWidth;
            node.classList.add('ticked');
        }
        previous[id] = text;
    }

    function num(v) {
        return (typeof v === 'number' && isFinite(v)) ? v : null;
    }

    function render(p) {
        if (!p) return;

        put('v-callsign', p.callsign || '—');
        put('v-tail', (p.aircraft && p.aircraft.registration) || '—');

        var r = p.route || {};
        put('v-orig', r.originIcao || '—');
        put('v-dest', r.destIcao || '—');

        // Distances. The left number is how far this flight has come and the
        // right one is the whole trip, so the pair reads as "207 of 516"
        // rather than as two unrelated figures.
        var flown = num(r.distFlownNm);
        var remaining = num(r.distRemainingNm);
        var total = (flown != null && remaining != null) ? flown + remaining : null;
        put('v-flown', flown != null ? flown.toLocaleString() + '\u00a0nm' : '—\u00a0nm');
        put('v-total', total != null ? total.toLocaleString() + '\u00a0nm' : '—\u00a0nm');

        // Prefer measured distance over the reported percentage when both are
        // present: they are derived from the same numbers, and using one for
        // the labels and the other for the fill is how a bar comes to disagree
        // with the text beside it.
        var pct = (total != null && total > 0)
            ? Math.max(0, Math.min(100, (flown / total) * 100))
            : Math.max(0, Math.min(100, num(r.progress) || 0));
        el('v-fill').style.width = pct + '%';
        el('v-dot').style.left = pct + '%';

        var t = p.telemetry || {};
        var alt = num(t.altitude);
        var gs = num(t.groundSpeed);
        var vs = num(t.verticalSpeed);
        put('v-alt', alt != null ? Math.round(alt).toLocaleString() + '\u00a0ft' : '—');
        put('v-gs', gs != null ? Math.round(gs) + '\u00a0kt' : '—');
        put('v-vs', vs != null ? (vs > 0 ? '+' : '') + Math.round(vs) : '—');
        put('v-eta', (r.eta && r.eta !== '--:--') ? r.eta + (r.tzSuffix || '') : '—');

        var who = p.username || '';
        var type = (p.aircraft && p.aircraft.aircraftName) || '';
        put('v-who', [who, type].filter(Boolean).join(' · ') || '—');

        // The photo, swapped only when the URL actually changes — re-setting
        // src on every tick restarts the decode and makes the card flicker.
        var url = (p.images && p.images.url) || '';
        if (url !== lastPhotoUrl) {
            lastPhotoUrl = url;
            if (url) {
                var img = new Image();
                img.onload = function () {
                    photo.classList.remove('empty', 'in');
                    photo.innerHTML = '';
                    photo.appendChild(img);
                    // Next frame, so the entrance transition has a start state
                    // to run from.
                    requestAnimationFrame(function () { photo.classList.add('in'); });
                };
                img.onerror = function () {
                    photo.className = 'empty in';
                    photo.innerHTML = '<i class="fa-solid fa-plane-up"></i>';
                };
                img.alt = type || 'Aircraft';
                img.src = url;
            } else {
                photo.className = 'empty in';
                photo.innerHTML = '<i class="fa-solid fa-plane-up"></i>';
            }
        } else if (!photo.classList.contains('in')) {
            requestAnimationFrame(function () { photo.classList.add('in'); });
        }
    }

    function setOpen(next) {
        if (isOpen === next) return;
        isOpen = next;
        document.body.classList.toggle('open', isOpen);
        reportHeight();
    }

    bar.addEventListener('click', function (event) {
        var act = event.target.closest('[data-act]');
        if (act) {
            event.stopPropagation();
            try {
                window.parent.postMessage({
                    type: 'SIMPLE_WINDOW_ACTION',
                    action: act.getAttribute('data-act')
                }, '*');
            } catch (_) {}
            return;
        }
        setOpen(!isOpen);
    });

    window.addEventListener('message', function (event) {
        var d = event.data;
        if (!d || typeof d !== 'object') return;
        if (d.type === 'FLIGHT_DATA_UPDATE') render(d.payload);
        // The host may still send SET_PHASE (both other modes use it). The
        // strip has no full-screen phase to switch into, so 'expanded' opens
        // the drawer instead of being ignored outright.
        if (d.type === 'SET_PHASE') setOpen(d.phase === 'expanded');
    });

    // A late web font or a photo landing can change the bar's height after the
    // first measurement, and a rotation changes it outright.
    window.addEventListener('resize', reportHeight);
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(reportHeight).catch(function () {});
    }

    reportHeight();
    try { window.parent.postMessage({ type: 'STRIP_FLIGHT_READY' }, '*'); } catch (_) {}
})();
</script>
</body>
</html>
