    <script>
        // App Store compliance gate (Apple rule 3.1.3(b) — multiplatform service).
        // Inside the native iOS app we hide every external payment surface:
        // pricing, "Upgrade", Stripe portal, signup, etc.
        // Web build is unaffected. Pro features still work for users who
        // signed up + paid on the website; iOS users just see them locked
        // without any in-app upgrade path.
        (function () {
            var platform = (window.Capacitor && typeof window.Capacitor.getPlatform === 'function')
                ? window.Capacitor.getPlatform()
                : null;
            var isCapacitorProtocol = window.location && (
                window.location.protocol === 'capacitor:' ||
                window.location.protocol === 'ionic:'
            );
            var ua = (navigator.userAgent || '') + ' ' + (navigator.platform || '');
            var looksLikeIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var ios = platform === 'ios' || (isCapacitorProtocol && looksLikeIOS);
            window.isIOSNative = function () { return ios; };
            if (ios) {
                document.documentElement.classList.add('ios-native');
                // Swap the Pro-branded brand logo to the neutral one everywhere
                // (auth modal, profile top bar, splash, etc.) so the app
                // doesn't surface "Pro" tier branding inside iOS.
                var swap = function (root) {
                    var imgs = (root || document).querySelectorAll('img[src*="InflightPro.png"]');
                    for (var i = 0; i < imgs.length; i++) {
                        imgs[i].src = 'Images/inflight.png';
                        imgs[i].alt = 'InFlight';
                    }
                };
                if (document.readyState !== 'loading') swap();
                else document.addEventListener('DOMContentLoaded', function () { swap(); });
                var mo = new MutationObserver(function (muts) {
                    for (var j = 0; j < muts.length; j++) {
                        var added = muts[j].addedNodes;
                        for (var k = 0; k < added.length; k++) {
                            var n = added[k];
                            if (n.nodeType !== 1) continue;
                            if (n.tagName === 'IMG' && n.src && n.src.indexOf('InflightPro.png') !== -1) {
                                n.src = 'Images/inflight.png';
                                n.alt = 'InFlight';
                            } else if (n.querySelectorAll) {
                                swap(n);
                            }
                        }
                    }
                });
                document.addEventListener('DOMContentLoaded', function () {
                    mo.observe(document.body, { childList: true, subtree: true });
                });
            }
        })();
    </script>
    <style>
        html.ios-native .ios-hide { display: none !important; }

    <!-- Open the TCP + TLS connections to the third-party origins while the
         HTML is still parsing. Without these the browser only starts the
         handshake when it reaches each tag, and the map, socket and icon
         font all sit on separate hosts — a full round trip each. The tile
         and glyph hosts are warmed too: the map requests them immediately
         after mapbox-gl.js evaluates. -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
    <link rel="preconnect" href="https://events.mapbox.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.mapbox.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://unpkg.com">

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css" rel="stylesheet">

    <!-- Both are `defer`, which is what lets the splash paint at all.
         As blocking <head> scripts they had to be downloaded AND executed
         before the parser could even reach <body> — and mapbox-gl.js is by far
         the heaviest thing on the page. So on a slow connection the user got a
         white page for the length of that download, then the splash.

         Deferring is safe here because nothing touches either global at load
         time: `mapboxgl` is first used inside initializeSectorOpsView() and
         `io` inside initializeSectorOpsSocket(), both of which run from
         flight.js — a module, and therefore ordered after every deferred
         script. The classic scripts further down the body were checked too:
         their only `mapboxgl` matches are CSS selector strings. -->
    <script defer src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>

    <link rel="stylesheet" href="panel-styles.css">

    <!-- Notifications are now served by notifications.js (imported from
         flight.js), so the Toastify CDN stylesheet and its render-blocking
         script are gone. -->

    <!-- Font Awesome, loaded without blocking the first paint.
         A cross-origin <link rel="stylesheet"> is render-blocking: the browser
         will not paint *anything* until it has resolved cdnjs, completed the
         TLS handshake and parsed the file. That defeated the whole point of
         inlining the splash below — it could not paint until a third-party
         stylesheet the splash does not use (its rings are inline SVG) had
         arrived. `media="print"` makes it non-blocking for screen rendering;
         onload flips it back to `all` and the icons apply. They land during
         the splash, so there is nothing for a user to see swap in. -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          media="print" onload="this.media='all'; this.onload=null;">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <style>
        /* Base Styles */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0d1117;
            color: #e8eaf6;
            overflow: hidden; /* Important for fullscreen map */
        }

        /* --- [FIX] Standalone Map View Layout --- */
        #standalone-map-view.active {
            position: absolute;
            inset: 0; /* Sets top, right, bottom, left to 0 */
            width: 100%;
            height: 100%;
            padding: 0;
            overflow: hidden;

            /* Use Grid to layer the map and floating panel */
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }

        /* This places the map into the grid, filling the entire space */
        #sector-ops-map-fullscreen {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            /* Needed so the ::after placeholder below anchors to this element.
               Mapbox sets this itself once it initialises, but not before —
               and "before" is exactly when the placeholder has to work. */
            position: relative;

            /* Backdrop for the window between this container existing and
               Mapbox painting its first frame. Share-link arrivals skip the
               splash entirely (they go straight to a flight), so without this
               they got flat #0d1117 — indistinguishable from a broken page —
               until the tiles arrived. The Mapbox canvas draws over it.
               Purely decorative: no JS, no layout cost, nothing to tear down. */
            background:
                radial-gradient(ellipse at 50% 45%, rgba(96, 132, 184, 0.16) 0%, transparent 62%),
                linear-gradient(180deg, #131722 0%, #0d1117 100%);
        }

        /* A slow horizon sweep, so the wait reads as "loading" rather than
           "frozen". Sits behind the canvas and never intercepts input. */
        #sector-ops-map-fullscreen::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(100deg,
                transparent 38%,
                rgba(255, 255, 255, 0.045) 50%,
                transparent 62%);
            background-size: 260% 100%;
            animation: inflight-map-sweep 2.4s ease-in-out infinite;
        }
        /* Retired the moment the map reports its first paint. Driven by a
           class rather than :has(.mapboxgl-canvas-container) so it also works
           on browsers without :has() support, where the sweep would otherwise
           keep running on top of a perfectly good map. */
        #sector-ops-map-fullscreen.map-painted::after {
            display: none;
        }

        @keyframes inflight-map-sweep {
            0%   { background-position: 120% 0; }
            100% { background-position: -20% 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            #sector-ops-map-fullscreen::after { animation: none; }
        }

        /* This rule makes the main content area fill the entire viewport */
        .main-content {
            padding: 0; 
            height: 100dvh; 
            overflow: hidden; 
        }

        /* ====================================================================
        START: Injected Styles from injectCustomStyles()
        ====================================================================
        */

        /* --- [OVERHAUL] Base Info Window Styles (Refined Glassmorphism) --- */
        .info-window {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 540px; 
            max-width: 90vw;
            max-height: calc(100vh - 40px);
            background: rgba(18, 20, 38, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #e8eaf6;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: translateX(20px);
            pointer-events: none; 
        }
        .info-window.visible { 
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        .info-window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(10, 12, 26, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        .info-window-header h3 {
            margin: 0; 
            font-size: 1.3rem; 
            color: #fff;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .info-window-header h3 small { 
            font-weight: 300; 
            color: #c5cae9; 
            font-size: 0.9rem; 
            margin-left: 5px; 
        }
        .info-window-actions button {
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            color: #c5cae9; 
            cursor: pointer;
            font-size: 1rem; 
            width: 32px; height: 32px;
            border-radius: 50%;
            margin-left: 8px;
            line-height: 1; 
            display: grid;
            place-items: center;
            transition: all 0.2s ease-in-out;
        }
        .info-window-actions button:hover { 
            background: #00a8ff;
            color: #fff; 
            transform: scale(1.1) rotate(90deg);
            border-color: #00a8ff;
        }
        .info-window-content { 
            overflow-y: auto; 
            flex-grow: 1; 
            padding: 0;
        }
        /* Custom Scrollbar */
        .info-window-content::-webkit-scrollbar { width: 8px; }
        .info-window-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .info-window-content::-webkit-scrollbar-thumb { background-color: #00a8ff; border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
        .info-window-content::-webkit-scrollbar-thumb:hover { background-color: #33c1ff; }

        /* --- [OVERHAUL] Airport Window: Weather & Tabs --- */
        .airport-info-weather {
            padding: 20px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 15px 20px;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 168, 255, 0.15), rgba(0, 100, 200, 0.25));
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .weather-flight-rules { 
            font-size: 1.8rem; font-weight: 700; 
            padding: 12px 18px; border-radius: 10px;
            grid-row: 1 / 3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        .flight-rules-vfr { background-color: #28a745; color: white; }
        .flight-rules-mvfr { background-color: #007bff; color: white; }
        .flight-rules-ifr { background-color: #dc3545; color: white; }
        .flight-rules-lifr { background-color: #a33ea3; color: white; }
        .weather-details-grid { 
            display: grid; grid-template-columns: 1fr 1fr; 
            gap: 10px 15px; text-align: left;
        }
        .weather-details-grid span { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .weather-details-grid .fa-solid { color: #00a8ff; width: 16px; text-align: center; }
        .metar-code {
            grid-column: 1 / -1; font-family: 'Courier New', Courier, monospace;
            background: rgba(0,0,0,0.2); padding: 8px; border-radius: 4px;
            font-size: 0.8rem; color: #e0e0e0; margin-top: 5px;
        }
        
        .info-window-tabs { display: flex; background: rgba(10, 12, 26, 0.4); padding: 5px 15px 0 15px; }
        .info-tab-btn {
            padding: 14px 18px; border: none; background: none; color: #c5cae9;
            cursor: pointer; font-size: 0.9rem; font-weight: 600;
            border-bottom: 3px solid transparent; transition: all 0.25s;
            display: flex; align-items: center; gap: 8px;
        }
        .info-tab-btn:hover { color: #fff; }
        .info-tab-btn.active { color: #00a8ff; border-bottom-color: #00a8ff; }
        .info-tab-content { display: none; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .info-tab-content.active { display: block; }
        .info-tab-content ul { list-style: none; padding: 0; margin: 0; }
        .info-tab-content li { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .info-tab-content li:last-child { border-bottom: none; }
        .muted-text { color: #9fa8da; text-align: center; padding: 2rem; }
        .error-text { color: #dc3545; text-align: center; padding: 2rem; }
        .spinner-small {
            width: 28px;
            height: 28px;
            border: 4px solid #484f58;
            border-bottom-color: #00a8ff;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }


        /* --- [NEW DESIGN] AIRCRAFT FLIGHT DISPLAY --- */
        #aircraft-info-window .info-window-content {
            background: #1C1E2A; /* Solid dark background for content area */
        }
        
        /* 1. Overview Panel (Image + Top Info) */
        .aircraft-overview-panel {
            position: relative;
            height: 200px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #0b1220;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-mask-image: linear-gradient(180deg, black 65%, rgba(0,0,0,0.7) 80%, transparent 100%);
            mask-image: linear-gradient(180deg, black 65%, rgba(0,0,0,0.7) 80%, transparent 100%);
            margin-bottom: -40px;
        }
        
        .aircraft-overview-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(180deg, 
                rgba(0, 0, 0, 0.4) 0%,  
                rgba(0, 0, 0, 0) 35%   
            );
        }
        
        /* Container for top-left/right text */
        .overview-content {
            position: relative;
            z-index: 2;
            padding: 16px 20px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .overview-col-left h3 {
            margin: 0;
            font-size: 1.6rem; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7), 0 0 2px rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* --- [NEW] Style for Airline Logo in Header --- */
        .ac-header-logo {
            height: 1.8rem; 
            width: auto;
            max-width: 100px; /* Prevent huge logos */
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7)) drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }
        
        .overview-col-left p {
            position: relative; 
            margin: 0;
            font-size: 1.0rem; 
            color: #e8eaf6; 
            font-weight: 400;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
            min-height: 1.2em;
            margin-top: 4px; 
        }

        @keyframes primarySubtextAnimation {
            0%   { opacity: 1; transform: translateY(0); }
            60%  { opacity: 1; transform: translateY(0); } /* Hold Username (6s) */
            65%  { opacity: 0; transform: translateY(10px); } /* Fade Out (0.5s) */
            95%  { opacity: 0; transform: translateY(-10px); } /* Stay Hidden (3s) */
            100% { opacity: 1; transform: translateY(0); } /* Fade In (0.5s) */
        }
        @keyframes secondarySubtextAnimation {
            0%   { opacity: 0; transform: translateY(-10px); } /* Start Hidden (6.5s) */
            65%  { opacity: 0; transform: translateY(-10px); }
            70%  { opacity: 1; transform: translateY(0); } /* Fade In (0.5s) */
            90%  { opacity: 1; transform: translateY(0); } /* Hold Aircraft (2s) */
            95%  { opacity: 0; transform: translateY(10px); } /* Fade Out (0.5s) */
            100% { opacity: 0; transform: translateY(-10px); } /* Stay Hidden (0.5s) */
        }
        
        .ac-header-subtext {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            animation-name: primarySubtextAnimation; /* Default to primary */
            animation-iteration-count: infinite;
            animation-duration: 10s;
            animation-timing-function: ease-in-out;
            opacity: 0; /* Start hidden, animation will show it */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        #ac-header-username {
            animation-name: primarySubtextAnimation;
        }
        
        #ac-header-actype {
            animation-name: secondarySubtextAnimation;
        }

        .overview-col-right {
            text-align: right;
            display: none; /* Hide the top-right ICAOs */
        }
        
        /* Action buttons (Hide/Close) */
        .overview-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 3;
            display: flex;
            gap: 8px;
        }
        .overview-actions button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e8eaf6;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease-in-out;
            backdrop-filter: blur(5px);
        }
        .overview-actions button:hover {
            background: #00a8ff;
            color: #fff;
            transform: scale(1.1);
            border-color: transparent;
        }

        /* 2. Route Summary Overlay (User Request) */
        .route-summary-overlay {
            position: relative;
            padding: 25px 20px 12px 20px;
            background: linear-gradient(
                180deg, 
                transparent 0%, 
                rgba(0, 168, 255, 0.15) 30%, 
                rgba(18, 20, 38, 0.8) 50%, 
                #1C1E2A 70%
            );
            
            border-radius: 0;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 16px;
            width: 100%;
            box-sizing: border-box; 
        }

        .route-summary-airport {
            display: flex;
            flex-direction: column;
        }
        #route-summary-dep { 
            text-align: left; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #route-summary-arr { 
            text-align: right; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .route-summary-airport .airport-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #route-summary-arr .airport-line {
            justify-content: flex-end; /* Align arrival to the right */
        }
        
        .route-summary-airport .icao {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); 
        }
        .route-summary-airport .time {
            font-size: 0.85rem;
            font-weight: 600;
            color: #c5cae9;
            margin-top: 4px;
            display: block;
            text-align: center;
        }
        .route-summary-airport .country-flag {
            width: 20px;
            height: auto;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none; /* Hidden by default, shown by JS */
        }

        .route-progress-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            align-items: center;
            justify-items: center;
            position: relative;
            min-height: 28px;
        }
        .route-progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(10, 12, 26, 0.7);
            border-radius: 3px;
            overflow: hidden;
            grid-row: 1 / 1;
            grid-column: 1 / 1;
            z-index: 1;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00a8ff, #89f7fe);
            transition: width 0.5s ease-out;
            border-radius: 3px;
        }
        .flight-phase-indicator {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;

        /* --- [MODIFIED] Toolbar and Recall Buttons --- */
        .dashboard-toolbar {

            gap: 8px;

        .toolbar-btn {

            box-shadow: 0 0 10px rgba(0, 168, 255, 0.5);

        #airport-recall-btn, #aircraft-recall-btn {

            display: grid; /* Use grid to match other buttons */
        }
        #airport-recall-btn.palpitate, #aircraft-recall-btn.palpitate {
            animation: palpitate 0.5s ease-in-out 2;
        }
        @keyframes palpitate {
            0%, 100% { transform: scale(1); color: #00a8ff; }
            50% { transform: scale(1.3); color: #fff; }
        }
        
        /* Styles for Active ATC Markers on Sector Ops Map */
        @keyframes atc-pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        @keyframes atc-breathe {
            0% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 0.9; }
            100% { transform: scale(0.95); opacity: 0.6; }
        }

            content: ''; grid-area: 1 / 1; width: 250%; height: 250%; border-radius: 50%;

            animation: atc-breathe 4s ease-in-out infinite;

        /* Indeterminate progress. A launch screen that only fades a logo in has
           no way to say "still working" — this does, without claiming a
           percentage nothing here can actually measure. */
        .inflight-splash-bar {
            position: relative;
            width: 132px;
            height: 2px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.10);
            overflow: hidden;
            /* Same unhurried entrance as the logo, one beat later. */
            opacity: 0;
            animation: inflight-splash-fade-in 700ms 620ms ease-out forwards;
        }
        .inflight-splash-bar::after {
            content: '';
            position: absolute;
            inset: 0 auto 0 0;
            width: 42%;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            animation: inflight-splash-sweep 1500ms 620ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes inflight-splash-fade-in { to { opacity: 1; } }
        @keyframes inflight-splash-sweep {
            from { transform: translateX(-115%); }
            to   { transform: translateX(280%); }
        }

        .inflight-splash-logo-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        /* Soft neutral spotlight behind the mark — fades in with the logo
           and gives the (dark) logo lettering a lighter region to read on. */
        .inflight-splash-logo-wrap::before {
            content: '';
            position: absolute;
            inset: -56px -52px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0.08) 44%, transparent 72%);
            filter: blur(16px);
            pointer-events: none;
            opacity: 0;
            animation: inflight-splash-halo-in 1100ms 140ms ease-out forwards;
        }
        .inflight-splash-logo {
            position: relative;
            display: block;
            height: 118px;
            width: auto;
            max-width: 78vw;
            filter: drop-shadow(0 12px 34px rgba(0, 0, 0, 0.5));
            /* The hero — and now the only element: a clean, unhurried fade-in. */
            animation: inflight-splash-logo-in 1000ms 140ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes inflight-splash-fade-out { to { opacity: 0; } }
        @keyframes inflight-splash-logo-in {
            from { opacity: 0; transform: scale(0.94) translateY(6px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes inflight-splash-halo-in {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @media (max-width: 480px) {
            .inflight-splash-logo { height: 102px; }
        }

        /* --- Partner marquee -------------------------------------------------
           Forty logos wrapped into a block is a blob, and a blob pinned to the
           bottom of the screen looks like something that would not fit. So they
           travel instead: two lanes drifting in opposite directions, edges
           faded out, sitting in the middle of the composition with the mark
           rather than under it.

           The lanes are big enough to actually read a logo — a partner wall
           whose logos are too small to recognise is decoration, not credit. */
        .inflight-splash-partners {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            opacity: 0;
            animation: inflight-splash-partners-in 700ms ease-out forwards;
        }
        .inflight-splash-partners-label {
            font: 600 11px/1 'Inter', system-ui, sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.42);
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }
        /* Hairlines either side of the label, so the lanes read as their own
           band rather than as loose text floating under the logo. */
        .inflight-splash-partners-label::before,
        .inflight-splash-partners-label::after {
            content: '';
            width: 26px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28));
        }
        .inflight-splash-partners-label::after { transform: scaleX(-1); }

        .inflight-splash-lanes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        /* The viewport each lane travels through. The mask is what stops a lane
           from ending in a hard vertical edge mid-logo — it dissolves instead,
           which is what makes the movement look deliberate. */
        .sp-lane {
            position: relative;
            width: 100%;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
            /* Nothing inside a lane can affect layout outside it, so say so —
               it keeps the track's width out of the boot-time layout work the
               rest of the page is doing while this is on screen. */
            contain: layout paint;
        }
        /* Each track holds its lane's logos TWICE, so translating it exactly
           half its width lands on an identical frame and the loop is seamless
           — no jump, no gap to time. */
        .sp-track {
            display: flex;
            align-items: center;
            /* Spacing lives on the coins as a trailing margin, NOT as `gap`.
               `gap` puts no space after the last coin, so half the track's
               width is half a gap short of the distance to the matching coin
               in the second copy — and translateX(-50%) then lands 8px off,
               which is a visible hitch once every lap. A trailing margin makes
               the two distances identical and the loop exact. */
            width: max-content;
            padding: 2px 0;
            animation: sp-scroll 46s linear infinite;
            /* Held until the logos have actually landed. Every image that
               arrives repaints this layer, and forty of them trickling in over
               the first seconds is what made the lanes stutter and then settle.
               A lane that is briefly still looks fine; one that judders does
               not. See startWhenPainted(). */
            animation-play-state: paused;
            /* This runs while the app is still downloading and parsing, so the
               main thread is the busiest it will ever be. Promoting the track
               to its own compositor layer up front means the scroll is a GPU
               transform from the first frame instead of stuttering until the
               browser decides on its own that the layer is worth having. */
            will-change: transform;
            backface-visibility: hidden;
        }
        .inflight-splash-partners.is-rolling .sp-track { animation-play-state: running; }
        .sp-lane:nth-child(2) .sp-track {
            animation-duration: 58s;
            animation-direction: reverse;
        }
        @keyframes sp-scroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        /* Round "coin" badges — each logo centred inside a circle. */
        .sp-track img,
        .sp-track .vp-name {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            flex: 0 0 auto;
            box-sizing: border-box;
            /* The trailing gap the loop maths needs — see .sp-track. */
            margin-right: 16px;
        }
        .sp-track img {
            display: block;
            max-width: 54px;
            max-height: 54px;
            object-fit: contain;
            padding: 7px;
            background: #fff;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .sp-track .vp-name {
            display: flex;
            align-items: center;
            justify-content: center;
            font: 700 16px/1 'Inter', system-ui, sans-serif;
            color: #e9eaec;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        @keyframes inflight-splash-partners-in { to { opacity: 1; } }
        @media (max-width: 480px) {
            .sp-track img, .sp-track .vp-name { width: 44px; height: 44px; margin-right: 12px; }
            .sp-track img { max-width: 44px; max-height: 44px; padding: 6px; }
            .sp-track .vp-name { font-size: 13px; }
        }
        /* Two lanes cost ~150px. Below this there isn't room for the mark and
           the lanes both, and the mark wins. */
        @media (max-height: 480px) {
            .inflight-splash-partners { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            #inflight-pro-loader-overlay,
            .inflight-splash-logo, .inflight-splash-logo-wrap::before,
            .inflight-splash-partners, .sp-track,
            .inflight-splash-arcs, .inflight-splash-arcs svg,
            .inflight-splash-bar, .inflight-splash-bar::after {
                animation-duration: 0.001s !important;
                animation-delay: 0s !important;
                animation-iteration-count: 1 !important;
                opacity: 1 !important;
                transform: none !important;
            }
            /* The sweep is the one thing that must not simply land — a bar
               frozen part-filled reads as stalled progress. Hide it instead. */
            .inflight-splash-bar { display: none; }
            .inflight-splash-arcs { opacity: 0.07 !important; }
            .inflight-splash-arcs svg { transform: translate(-50%, -50%) !important; }
            /* A stopped marquee is a lane cut off at both ends. Centre the
               track instead and let the mask fade whatever overflows, so a
               still frame still looks composed. */
            .sp-track { justify-content: center; width: 100%; }
        }
    </style>

</head>
<body>

    <!-- Splash must be the first body child so it paints before any
         downstream UI is parsed. The script below handles share-link
         skip + dismiss; keeping it inline (rather than in flight.js)
         is what makes the splash appear immediately on launch.
         The splash logo defaults to the neutral mark so non-Pro users
         (and brand-new users whose Pro status hasn't been resolved yet)
         never see Pro branding flash on screen. flight.js writes the
         cached Pro entitlement to localStorage, which the inline script
         below reads to upgrade the logo to the Pro mark for Pro users. -->
    <div id="inflight-pro-loader-overlay" role="status" aria-live="polite" aria-label="Inflight is loading">
        <!-- Decorative backdrop. aria-hidden because it says nothing a screen
             reader needs; the overlay's own label already announces the state. -->
        <div class="inflight-splash-arcs" aria-hidden="true">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <circle class="sa-ring" cx="100" cy="100" r="46"></circle>
                <circle class="sa-ring" cx="100" cy="100" r="72"></circle>
                <ellipse class="sa-ring" cx="100" cy="100" rx="88" ry="34"></ellipse>
                <ellipse class="sa-ring" cx="100" cy="100" rx="34" ry="88"></ellipse>
                <path class="sa-path" d="M14 118 C 52 62, 148 62, 186 118"></path>
                <path class="sa-path" d="M22 74 C 64 140, 136 140, 178 74"></path>
            </svg>
        </div>
        <div class="inflight-splash-stack">
            <div class="inflight-splash-logo-wrap">
                <img src="Images/inflight.png" alt="Inflight" class="inflight-splash-logo" id="inflight-splash-logo">
            </div>
            <!-- Indeterminate: nothing here can honestly measure a percentage. -->
            <div class="inflight-splash-bar" aria-hidden="true"></div>
            <!-- Boot status. Stays empty (and takes no space) for the first few
                 seconds so a fast load is still a clean logo-only splash; fills
                 in only if the map is slow, and turns into an explanation plus
                 a retry if it fails outright. -->
            <p class="inflight-splash-status" id="inflight-splash-status" role="status" aria-live="polite"></p>
            <button type="button" class="inflight-splash-retry" id="inflight-splash-retry" hidden>Try again</button>
        </div>
        <div class="inflight-splash-partners" id="inflight-splash-partners" hidden aria-hidden="true">
            <!-- The count is filled in from the roster that actually rendered,
                 so the wall never claims more airlines than it is showing. -->
            <span class="inflight-splash-partners-label" id="inflight-splash-partners-label">Our Partner VAs</span>
            <div class="inflight-splash-lanes" id="inflight-splash-lanes">
                <div class="sp-lane"><div class="sp-track" id="inflight-splash-lane-a"></div></div>
                <div class="sp-lane"><div class="sp-track" id="inflight-splash-lane-b"></div></div>
            </div>
        </div>
    </div>
    <script>
        // Upgrade the splash logo to the Pro mark if (and only if) the last
        // Supabase lookup confirmed this user is on Pro. Anyone else — first
        // launch, signed-out users, anonymous web visitors — stays on the
        // neutral logo. The iOS swap further up the page also forces neutral
        // branding regardless of entitlement.
        (function () {
            try {
                if (window.isIOSNative && window.isIOSNative()) return;
                var cached = localStorage.getItem('inflight_is_pro');
                if (cached !== 'true') return;
                var img = document.getElementById('inflight-splash-logo');
                if (img) img.src = 'Images/InflightPro.png';
            } catch (_) { /* storage unavailable — leave neutral logo in place */ }
        })();
    </script>
    <script>
        (function() {
            var overlayId = 'inflight-pro-loader-overlay';
            var styleId   = 'inflight-pro-loader-styles';
            var overlay   = document.getElementById(overlayId);
            if (!overlay) return;

            function removeNow() {
                if (overlay && overlay.parentNode) overlay.remove();
                var s = document.getElementById(styleId);
                if (s && s.parentNode) s.remove();
            }

            // Share-link arrivals (?flight=... / ?replay=... or a queued
            // share/replay payload) should land the user directly on the
            // flight info window or map replay — no splash in the way.
            try {
                var p = new URLSearchParams(window.location.search || '');
                var fromShare = !!p.get('flight') || !!p.get('replay') ||
                    (typeof sessionStorage !== 'undefined' && (
                        !!sessionStorage.getItem('inflight_share_payload') ||
                        !!sessionStorage.getItem('inflight_replay_payload')
                    ));
                if (fromShare) { removeNow(); return; }
            } catch (_) { /* non-fatal */ }

            var dismissed     = false;
            var minVisibleMs  = 3000;  // Linger so partner VAs load + settle cleanly
            var start         = Date.now();

            // The splash is dismissed when the MAP reports it has painted, not
            // on window.load. window.load only means the page's subresources
            // finished; the map is still fetching its token, style and tiles
            // well after that, so dismissing on it faded the splash out over a
            // bare #0d1117 page and left the user staring at black on any slow
            // connection. flight.js publishes boot state via
            // window.__inflightBoot + the 'inflight:boot' event.
            var status = document.getElementById('inflight-splash-status');

            function setStatus(text, isError) {
                if (!status) return;
                status.textContent = text || '';
                status.classList.toggle('is-error', !!isError);
                status.classList.toggle('is-visible', !!text);
            }

            function dismiss() {
                if (dismissed) return;
                dismissed = true;
                var elapsed   = Date.now() - start;
                var remaining = Math.max(0, minVisibleMs - elapsed);
                setTimeout(function() {
                    overlay.classList.add('is-dismissing');
                    setTimeout(removeNow, 420);
                }, remaining);
            }

            var failed = false;
            function fail(detail) {
                // First failure wins. The stall net below fires on a timer and
                // must not overwrite a specific, actionable message ("Could not
                // reach the InFlight servers") with its generic one.
                if (dismissed || failed) return;
                failed = true;
                // Deliberately does NOT dismiss: there is nothing behind the
                // splash worth revealing, so keep the explanation on screen.
                setStatus(detail || 'InFlight could not start.', true);
                var retry = document.getElementById('inflight-splash-retry');
                if (retry) retry.hidden = false;
            }

            // Progressive reassurance. Silence is fine for the first few
            // seconds; past that the user deserves to know it is still working
            // rather than wondering whether the app has hung.
            var reassure = [
                { at: 4000,  text: 'Loading the map…' },
                { at: 9000,  text: 'Still loading — this can take a moment on a slow connection.' },
                { at: 18000, text: 'Taking longer than usual. Hang tight…' }
            ];
            // Once the map itself is up the remaining wait is traffic, so say
            // so rather than continuing to claim the map is loading.
            var stageText = {
                'map-painted': 'Loading live traffic…',
                'ui-ready': 'Loading live traffic…'
            };
            var timers = reassure.map(function (step) {
                return setTimeout(function () {
                    if (!dismissed && !overlay.classList.contains('has-error')) setStatus(step.text);
                }, step.at);
            });

            function onBoot(state, detail) {
                // Any state at all is proof boot is still moving.
                if (typeof armStallTimer === 'function') armStallTimer();

                if (state === 'map-ready') {
                    timers.forEach(clearTimeout);
                    if (stallTimer) clearTimeout(stallTimer);
                    setStatus('');
                    dismiss();
                } else if (state === 'map-error') {
                    timers.forEach(clearTimeout);
                    overlay.classList.add('has-error');
                    fail(detail);
                } else if (stageText[state] && status && status.classList.contains('is-visible')) {
                    // Only refine a message already on screen — a fast load
                    // still shows nothing at all.
                    setStatus(stageText[state]);
                }
            }

            window.addEventListener('inflight:boot', function (e) {
                var d = (e && e.detail) || {};
                onBoot(d.state, d.detail);
            });

            // flight.js is a module and may have reported a state before this
            // listener attached, so reconcile with whatever is already there.
            if (window.__inflightBoot) onBoot(window.__inflightBoot.state, window.__inflightBoot.detail);

            // Last-resort net: if boot never reports either way — a wedged GPU
            // context, a blocked CDN, an exception before flight.js runs —
            // surface it rather than leaving a logo spinning forever.
            //
            // Keyed on lack of PROGRESS, not on total elapsed time. Boot walks
            // through several states before the reveal (data, map init, first
            // paint, chrome, traffic), and on a slow connection reaching the
            // last one can legitimately take a while — what must not happen is
            // going quiet. Each new state restarts the clock.
            var STALL_MS = 30000;
            var stallTimer = null;
            function armStallTimer() {
                if (stallTimer) clearTimeout(stallTimer);
                stallTimer = setTimeout(function () {
                    if (!dismissed) {
                        fail('The map is not responding. Check your connection and try again.');
                    }
                }, STALL_MS);
            }
            armStallTimer();

            var retryBtn = document.getElementById('inflight-splash-retry');
            if (retryBtn) retryBtn.addEventListener('click', function () { window.location.reload(); });
        })();
    </script>
    <script>
        // Populate the splash's "Our Partner VAs" strip from the cached partner
        // roster (window.InflightVaAds.allPartners()). vaAds.js warms the roster
        // on load; we poll briefly because it loads after this markup and the
        // data arrives over the network. Fails silently — if no partners resolve
        // in time, the strip just stays hidden.
        (function () {
            var strip = document.getElementById('inflight-splash-partners');
            var laneA = document.getElementById('inflight-splash-lane-a');
            var laneB = document.getElementById('inflight-splash-lane-b');
            var label = document.getElementById('inflight-splash-partners-label');
            if (!strip || !laneA || !laneB) return;

            // No cap. This used to stop at 24, which quietly left a third of the
            // roster off a screen whose entire job is to say who we fly with —
            // and a partner who cannot find themselves on it is the one person
            // guaranteed to look. Everyone rides the lanes instead.
            var tries = 0;
            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            }
            function initialsFor(name) {
                return String(name).trim().split(/\s+/)
                    .map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase();
            }

            /* A logo that fails to load must NOT be removed from the lane.
             *
             * Each lane holds its partners twice so the track can translate half
             * its width and land on an identical frame. Removing a coin changes
             * the track's width mid-animation AND leaves the two halves no
             * longer identical, so the loop starts jumping once per cycle — the
             * exact stutter this was blamed for. Swapping it for the initials
             * coin keeps the footprint and keeps the halves in step.
             */
            window.__spCoinFailed = function (img) {
                try {
                    var span = document.createElement('span');
                    span.className = 'vp-name';
                    span.title = img.title || '';
                    span.textContent = img.getAttribute('data-ini') || '';
                    img.parentNode.replaceChild(span, img);
                } catch (_) { /* leave the broken img rather than break the lane */ }
            };

            function coin(ad) {
                var ini = initialsFor(ad.name);
                if (ad.logo) {
                    // decoding=async keeps forty logo decodes off the main
                    // thread, which is already carrying the app's own boot.
                    return '<img src="' + esc(ad.logo) + '" alt="' + esc(ad.name) +
                        '" title="' + esc(ad.name) + '" data-ini="' + esc(ini) + '"' +
                        ' decoding="async" onerror="__spCoinFailed(this)">';
                }
                return '<span class="vp-name" title="' + esc(ad.name) + '">' + esc(ini) + '</span>';
            }
            function render(list) {
                var seen = {}, items = [];
                for (var i = 0; i < list.length; i++) {
                    var ad = list[i];
                    if (!ad || !ad.name) continue;
                    var key = String(ad.name).toLowerCase();
                    if (seen[key]) continue;
                    seen[key] = 1;
                    items.push(coin(ad));
                }
                // The old de-duplication kept the FIRST spelling and dropped the
                // rest; unchanged. What changed is that nothing is dropped after
                // the fact any more — see __spCoinFailed.
                if (!items.length) return false;

                // Split across the two lanes by alternating rather than by
                // halving: the roster arrives in some order we don't control,
                // and cutting it down the middle would put every logo-less
                // partner in one lane if the source happened to group them.
                var a = [], b = [];
                for (var j = 0; j < items.length; j++) (j % 2 ? b : a).push(items[j]);
                // One lane's worth is duplicated so the CSS can translate the
                // track exactly half its width and land on an identical frame.
                // A single short lane would also leave a visible gap at speed,
                // which the doubling closes.
                laneA.innerHTML = a.join('') + a.join('');
                laneB.innerHTML = (b.length ? b : a).join('') + (b.length ? b : a).join('');

                // Count what was actually drawn, after the de-duplication above,
                // so the label and the lanes can never disagree.
                if (label) {
                    label.textContent = items.length > 1
                        ? items.length + ' Partner VAs'
                        : 'Our Partner VAs';
                }
                strip.hidden = false;
                strip.removeAttribute('aria-hidden');
                startWhenPainted();
                return true;
            }

            /* Start the lanes moving only once nothing is left to repaint them.
             *
             * The tracks render before their logos have been fetched, and each
             * one that arrives repaints the whole lane — so starting straight
             * away means the first seconds of movement compete with forty image
             * loads and the app's own boot. That is the "smooth after a while"
             * everyone sees. Waiting costs a moment of stillness, which nobody
             * reads as a fault, and buys motion that is clean from frame one.
             *
             * The timeout is the important half: one slow logo host must never
             * be able to hold the lanes still for the whole splash.
             */
            function startWhenPainted() {
                var imgs = [].slice.call(strip.getElementsByTagName('img'));
                var pending = 0, started = false;
                function go() {
                    if (started) return;
                    started = true;
                    strip.classList.add('is-rolling');
                }
                for (var i = 0; i < imgs.length; i++) {
                    if (imgs[i].complete) continue;
                    pending++;
                    (function (img) {
                        var done = function () { if (--pending <= 0) go(); };
                        img.addEventListener('load', done, { once: true });
                        img.addEventListener('error', done, { once: true });
                    })(imgs[i]);
                }
                if (!pending) { go(); return; }
                setTimeout(go, 2500);
            }

            var t = setInterval(function () {
                tries++;
                try {
                    var api = window.InflightVaAds;
                    if (api && typeof api.allPartners === 'function') {
                        var list = api.allPartners();
                        if (list && list.length && render(list)) { clearInterval(t); return; }
                    }
                } catch (_) { /* ignore */ }
                if (tries > 40) clearInterval(t); // ~6s safety
            }, 150);
        })();
    </script>

            <i class="fa-solid fa-chevron-right"></i>

        <div class="panel-tabs">

        <div class="panel-content">
            <div id="panel-tab-routes" class="tab-content active">

    <!-- Three.js is only touched from inside functions (via window.THREE) by
         the 3D layers, never at load time, so it does not need to block the
         parser. `defer` keeps these three in order relative to each other and
         still runs them before the module scripts below. -->
    <script defer src="https://unpkg.com/three@0.126.0/build/three.min.js"></script>
    <script defer src="https://unpkg.com/three@0.126.0/examples/js/loaders/FontLoader.js"></script>
    <script defer src="https://unpkg.com/three@0.126.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="simbrief.apiv1.js"></script>
    <script src="colors.js"></script>
    <script src="sb.js"></script>
    <script src="mapAnimator.js" type="module"></script>
    <script src="weather.js"></script>
    <script src="windLayer.js"></script>
    <script src="haptics.js"></script>
    <script src="vaAds.js"></script>
    <script src="sector-ops-mobile-ui.js" defer></script>

    <!-- ============================================================
         PANEL FEATURES — loaded after the app is on screen.
         ============================================================
         These nine scripts are ~386 KB of the ~4 MB the tracker used to
         execute before it drew anything. As parser-blocking tags they all
         had to be downloaded AND run before DOMContentLoaded fired, and
         DOMContentLoaded is what starts flight.js's boot — so every visitor
         waited on the fuel planner, the changelog, the cabin map and the
         community gallery before the map was even asked for.

         None of them is needed to draw a map. Each backs a panel or a card
         inside the flight window, every call site already guards on its
         global (`typeof FuelEstimator !== 'undefined'`, `window.CabinMap &&
         …`), and each script self-initialises when it finds the document
         already parsed — they all carry the
         `readyState === 'loading' ? addEventListener : init()` pattern —
         so arriving after DOMContentLoaded is a case they already handle.

         `async = false` on an injected script preserves execution order
         between them, matching the order the tags were in. -->
    <script>
        (function () {
            var deferred = [
                'weatherWidget.js',
                'replayBrowser.js',
                'changelog.js',
                'flight-graph.js',
                'flight-legs.js',
                'windsAloft.js',
                'fuelEstimator.js',
                'cabinMap.js',
                'communityHub.js'
            ];

            function loadPanelFeatures() {
                deferred.forEach(function (src) {
                    var s = document.createElement('script');
                    s.src = src;
                    // Ordered, not "whenever it lands" — see above.
                    s.async = false;
                    document.body.appendChild(s);
                });
            }

            // After `load`, so these never compete with the map, the socket or
            // the airport database for bandwidth; on an idle callback so they
            // never land in the middle of the first interaction. The timeout
            // is the backstop for a tab that never goes idle.
            window.addEventListener('load', function () {
                if (typeof requestIdleCallback === 'function') {
                    requestIdleCallback(loadPanelFeatures, { timeout: 4000 });
                } else {
                    setTimeout(loadPanelFeatures, 1200);
                }
            }, { once: true });
        })();
    </script>
    <script type="module" src="aircraftPhoto.js"></script>
    <script type="module" src="searchEngine.js"></script>
    <script type="module" src="flight.js"></script>

    <!-- Discord Rich Presence. Boots independently of the profile panel so a
         pilot who turned it on keeps broadcasting without opening Settings;
         it no-ops when the backend has no Discord credentials configured. -->
    <script type="module">
        // Booted on an idle callback rather than inline. As a static import it
        // put discordPresence.js on the boot module graph for every visitor and
        // fired a backend config fetch that competed with the Mapbox token and
        // airport database for the critical path — for a feature that only does
        // anything on a desktop running the Discord app, and only after the
        // pilot has opted in. Auto-reconnect still happens, a moment later.
        const bootDiscord = () => import('./discordPresence.js')
            .then(({ DiscordPresence }) => DiscordPresence.boot())
            .catch(() => { /* presence is optional; the panel reports why */ });

        if (typeof requestIdleCallback === 'function') {
            requestIdleCallback(bootDiscord, { timeout: 8000 });
        } else {
            window.addEventListener('load', () => setTimeout(bootDiscord, 2000), { once: true });
        }
    </script>
