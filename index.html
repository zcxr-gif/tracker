<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InFlight Operations</title>

    <link rel="icon" type="image/x-icon" href="Images/inflightIcon.ico">

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="panel-styles.css">

    <style>
        /* --- Base Layout Styles --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117; /* Fallback color */
            color: #e8eaf6;
            overflow: hidden;
        }

        /* --- Map Container Setup --- */
        .main-content {
            padding: 0;
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            position: relative;
        }

        #standalone-map-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #sector-ops-map-fullscreen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- Floating Side Panel (Container) --- */
        .sector-ops-floating-panel {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 360px;
            max-width: 85vw; /* Responsive width */
            background: rgba(18, 20, 38, 0.95); /* Initial background before JS styling */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1040; /* Below Info Windows (1050/1060) but above map */
            display: flex;
            flex-direction: column;
            transition: transform 0.4s ease-in-out;
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        }

        .sector-ops-floating-panel.panel-collapsed {
            transform: translateX(-100%);
        }

        /* Internal Toggle Button (Desktop) */
        .panel-toggle-btn {
            position: absolute;
            top: 50%;
            right: -24px;
            transform: translateY(-50%);
            width: 24px;
            height: 60px;
            background: rgba(18, 20, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: none;
            color: #e8eaf6;
            cursor: pointer;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            display: grid;
            place-items: center;
            z-index: 10;
        }
        
        .panel-toggle-btn:hover {
            background: #27272a;
        }

        /* Main Content Area of Panel */
        .panel-content {
            flex-grow: 1;
            overflow-y: auto; /* Allow scrolling within the panel */
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- Toolbar (Right Side) --- */
        .dashboard-toolbar {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 1030; /* Above map */
            background: rgba(24, 24, 27, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px; /* Pill shape */
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .toolbar-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        /* Base styles for buttons injected by JS */
        .toolbar-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #a1a1aa;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: grid;
            place-items: center;
        }

        .toolbar-btn:hover, .toolbar-btn.active {
            background: #27272a;
            color: #fff;
            border-color: #a1a1aa;
        }
        
        /* Specific recall buttons (hidden by default, toggled by JS) */
        #airport-recall-btn, #aircraft-recall-btn {
            display: none; 
        }
        
        /* Palpitate animation for recall buttons */
        @keyframes palpitate {
            0%, 100% { transform: scale(1); color: #38bdf8; }
            50% { transform: scale(1.2); color: #fff; }
        }
        .toolbar-btn.palpitate {
            animation: palpitate 0.6s ease-in-out 2;
            display: grid !important; /* Force show when animating */
        }

        /* --- Loading Overlay --- */
        .main-loader-overlay {
            position: fixed;
            inset: 0;
            background: #09090b; /* Zinc-950 */
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }
        .main-loader-overlay.active {
            display: flex;
        }
        .spinner-large {
            width: 48px;
            height: 48px;
            border: 4px solid #27272a;
            border-bottom-color: #38bdf8; /* Brand Blue */
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Utility Classes for Map Markers (Base) --- */
        /* Note: JS injects more specific styles, these are fallbacks */
        .plane-marker {
            cursor: pointer;
            width: 30px;
            height: 30px;
            background-image: url('Images/map_icons/default.png'); 
            background-size: contain;
            background-repeat: no-repeat;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            .sector-ops-floating-panel {
                width: 100%;
                max-width: 100%;
            }
            .dashboard-toolbar {
                right: 10px;
                padding: 6px;
                gap: 8px;
            }
            .toolbar-btn {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div id="standalone-map-view" class="active">
            <div id="sector-ops-map-fullscreen"></div>
            
            </div>
    </div>

    <div id="sector-ops-floating-panel" class="sector-ops-floating-panel panel-collapsed">
        <button id="sector-ops-toggle-btn" class="panel-toggle-btn" aria-expanded="false" title="Toggle Panel">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
        
        <div class="panel-content">
            <div class="spinner-small" style="margin: 2rem auto;"></div>
        </div>
    </div>

    <div class="dashboard-toolbar">
        <div class="toolbar-group">
            <button id="toolbar-toggle-panel-btn" class="toolbar-btn" title="Toggle Flight Panel">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            
            </div>
    </div>

    <div id="main-content-loader" class="main-loader-overlay active">
        <div class="spinner-large"></div>
        <div style="font-family: 'Inter', sans-serif; color: #a1a1aa; font-size: 0.9rem;">Initializing System...</div>
    </div>

    <script src="https://unpkg.com/three@0.126.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/geometries/TextGeometry.js"></script>

    <script src="simbrief.apiv1.js"></script>
    <script src="sb.js"></script>
    
    <script src="mapAnimator.js" type="module"></script>
    
    <script src="weather.js"></script>
    
    <script src="sector-ops-mobile-ui.js" defer></script>
    
    <script type="module" src="flight.js"></script> 
    </body>
</html>
